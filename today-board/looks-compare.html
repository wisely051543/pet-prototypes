<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日看板原型</title>
<style>
@font-face{font-family:"Alfa Slab One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/AlfaSlabOne-Regular.woff2) format("woff2");unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2022,U+2026}
/* 手寫價目牌 world. Status colors are the fixed set shared by every surface and shop. */
:root{
  --background:#E8EBE5;--surface:#FFFFFF;--surface-variant:#DCE0D8;--ink:#17150F;--ink-muted:#4B5046;
  --border:#C2C7BC;--control-border:#6F7568;--track:#D3D8CD;
  --primary:#17150F;--primary-hover:#38352B;--on-primary:#FFFFFF;--primary-tint:#DDE1D5;--focus-ring:#1D5FA8;
  --sign:#FFCF1A;--sign-hover:#FFDB4D;--on-sign:#17150F;
  --rail-bg:#17150F;--rail-ink:#CFD2C6;--rail-line:#38352B;--rail-on:#FFFFFF;--rail-cur:#FFFFFF;--rail-cur-ink:#17150F;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;--boarding:#5B3BA6;--boarding-bg:#EDE7FA;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;--border-danger:#E9A9A3;--danger-tint:#FDF0EE;
  --toast:#17150F;--on-toast:#FFFFFF;--scrim:#17150F99;
  --owner-surface:#FFFFFF;--owner-surface-variant:#F4F4F6;--owner-ink:#1B1C1F;--owner-ink-muted:#5E6168;--owner-border:#E2E3E7;--owner-control-border:#8A8D94;
  --brand:#C2386B;--on-brand:#FFFFFF;--brand-tint:#FBECF2;
  --proto-bg:#2A2820;--proto-ink:#ECEBE2;--proto-muted:#ABAE9F;--proto-line:#4A473B;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --display:"Alfa Slab One","Rockwell","Roboto Slab","Noto Serif TC",serif;
  --r-sm:3px;--r-md:5px;--r-lg:7px;--r-owner-md:12px;--r-owner-lg:16px;
  --rail:4.75rem;color-scheme:light;
}
:root[data-theme="dark"]{
  --background:#11120E;--surface:#1B1C17;--surface-variant:#262820;--ink:#F3F1E7;--ink-muted:#B3B7AA;
  --border:#363930;--control-border:#80857A;--track:#2D3028;
  --primary:#F3F1E7;--primary-hover:#FFFFFF;--on-primary:#17150F;--primary-tint:#2D3028;--focus-ring:#8CC2F5;
  --sign:#FFCF1A;--sign-hover:#FFDB4D;--on-sign:#17150F;
  --rail-bg:#090A07;--rail-ink:#B3B7AA;--rail-line:#2D3028;--rail-on:#F3F1E7;--rail-cur:#F3F1E7;--rail-cur-ink:#17150F;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;--boarding:#C6B3F5;--boarding-bg:#2D2347;
  --danger-solid:#FF8A80;--on-danger-solid:#2B0806;--border-danger:#6B2A27;--danger-tint:#2A1A1A;
  --toast:#F3F1E7;--on-toast:#17150F;--scrim:#000000B3;
  --owner-surface:#1B1C20;--owner-surface-variant:#24262B;--owner-ink:#EDEEF1;--owner-ink-muted:#A2A6AF;--owner-border:#33363C;--owner-control-border:#6C7078;
  --brand:#F28CB1;--on-brand:#3A0A1E;--brand-tint:#3A2330;
  --proto-bg:#ECEBE2;--proto-ink:#17150F;--proto-muted:#4B5046;--proto-line:#C9CCBF;color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#11120E;--surface:#1B1C17;--surface-variant:#262820;--ink:#F3F1E7;--ink-muted:#B3B7AA;
    --border:#363930;--control-border:#80857A;--track:#2D3028;
    --primary:#F3F1E7;--primary-hover:#FFFFFF;--on-primary:#17150F;--primary-tint:#2D3028;--focus-ring:#8CC2F5;
    --sign:#FFCF1A;--sign-hover:#FFDB4D;--on-sign:#17150F;
    --rail-bg:#090A07;--rail-ink:#B3B7AA;--rail-line:#2D3028;--rail-on:#F3F1E7;--rail-cur:#F3F1E7;--rail-cur-ink:#17150F;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;--boarding:#C6B3F5;--boarding-bg:#2D2347;
    --danger-solid:#FF8A80;--on-danger-solid:#2B0806;--border-danger:#6B2A27;--danger-tint:#2A1A1A;
    --toast:#F3F1E7;--on-toast:#17150F;--scrim:#000000B3;
    --owner-surface:#1B1C20;--owner-surface-variant:#24262B;--owner-ink:#EDEEF1;--owner-ink-muted:#A2A6AF;--owner-border:#33363C;--owner-control-border:#6C7078;
    --brand:#F28CB1;--on-brand:#3A0A1E;--brand-tint:#3A2330;
    --proto-bg:#ECEBE2;--proto-ink:#17150F;--proto-muted:#4B5046;--proto-line:#C9CCBF;color-scheme:dark;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:56px;scroll-padding-bottom:96px}
body{font-family:var(--font);background:var(--background);color:var(--ink);font-size:.9375rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
::selection{background:var(--sign);color:var(--on-sign)}
*{scrollbar-width:thin;scrollbar-color:var(--control-border) transparent}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:24px;height:24px}
.num{font-feature-settings:"tnum"}

/* ---------- prototype strip (not product UI) ---------- */
.proto{background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;display:flex;align-items:center;gap:6px 16px;padding:6px 16px;overflow-x:auto;white-space:nowrap;min-height:44px}
.proto b{font-weight:600}
.proto .muted{color:var(--proto-muted)}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select,.proto .pbtn{background:transparent;border:1px solid var(--proto-line);border-radius:var(--r-sm);padding:4px 8px;min-height:32px;color:var(--proto-ink)}
.proto select option{color:#14211F;background:#fff}
.proto input[type=checkbox]{width:16px;height:16px;accent-color:var(--proto-ink)}
.proto :focus-visible{outline-color:var(--proto-ink)}
.proto .sp{flex:1}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 44px)}
#app.phone{display:block;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.rail{position:sticky;top:0;height:100vh;background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.mark{width:40px;height:40px;border-radius:var(--r-sm);background:var(--rail-cur);color:var(--rail-cur-ink);display:grid;place-items:center;font-size:1.125rem;font-weight:700;margin-bottom:14px;border:2px solid var(--rail-cur)}
.rail-item{width:3.25rem;min-height:3.25rem;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--rail-ink);font-size:.75rem;text-align:center;line-height:1.25;padding:4px 0}
.rail-item:hover{color:var(--rail-on);background:var(--rail-line)}
.rail-item[aria-current="page"]{background:var(--rail-cur);color:var(--rail-cur-ink);font-weight:700}
.rail-item[aria-current="page"]{--cut:var(--rail-cur)}
.rail :focus-visible{outline-color:var(--rail-on)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rail-bg);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;color:var(--rail-ink)}
.bnav button[aria-current="page"]{color:var(--rail-cur-ink);background:var(--rail-cur);font-weight:700}
.bnav button[aria-current="page"]{--cut:var(--rail-cur)}
.bnav :focus-visible{outline-color:var(--rail-on);outline-offset:-4px}
main{min-width:0}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:12px;padding:20px 24px 16px;flex-wrap:wrap}
.head-title{display:flex;align-items:baseline;gap:12px;margin-right:auto;flex-wrap:wrap}
.head h1{font-size:1.5rem;font-weight:800;line-height:1.3;letter-spacing:0}
.updated{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:500;color:var(--ink-muted)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--ink-muted)}
.iconbtn:hover{background:var(--surface);color:var(--ink)}
.search{position:relative;width:clamp(200px,26vw,320px)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none}
.search input{text-overflow:ellipsis;width:100%;min-height:44px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--surface);padding:0 12px 0 40px;font-size:.9375rem}
.search input::placeholder{color:var(--ink-muted)}
.branch{position:relative}
.branch select{appearance:none;min-height:44px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--surface);padding:0 36px 0 14px;font-size:.9375rem;cursor:pointer}
.branch .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-muted)}
@media (min-width:768px) and (max-width:1099px){.head-title{width:100%}.search{flex:1;width:auto}}
.phone .head{padding:12px 16px 10px;gap:8px;flex-wrap:nowrap}
.phone .head h1{font-size:1.125rem}
.phone .head-title{flex-direction:column;align-items:flex-start;gap:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:12px 16px;border-radius:var(--r-md);font-size:.9375rem;font-weight:600;line-height:1.3;text-align:center}
.btn{border:2px solid transparent}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);min-height:48px}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.next{background:var(--sign);color:var(--on-sign);border-color:var(--ink);min-height:48px;font-weight:700}
.btn.next:hover{background:var(--sign-hover)}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--ink);font-weight:600}
.btn.secondary:hover{background:var(--background)}
.btn.destructive{background:var(--danger-solid);color:var(--on-danger-solid)}
.btn[aria-disabled="true"]{background:transparent;color:var(--ink-muted);cursor:not-allowed;border:2px dashed var(--control-border)}
.btn[aria-busy="true"]{cursor:progress}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.textbtn{min-height:44px;min-width:44px;padding:0 8px;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;font-size:.9375rem;border-radius:var(--r-md)}
.textbtn:hover{background:var(--primary-tint)}
.tertiary{min-height:44px;padding:0 4px;color:var(--ink-muted);font-size:.8125rem;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.reason{font-size:.8125rem;font-weight:500;color:var(--ink-muted);margin-top:4px;line-height:1.4}

/* ---------- chips & tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:var(--r-sm);font-size:.8125rem;font-weight:500;line-height:1.4;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.neutral{color:var(--neutral);background:var(--neutral-bg)}
.chip.warning{color:var(--warning);background:var(--warning-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip.success{color:var(--success);background:var(--success-bg)}
.chip.boarding{color:var(--boarding);background:var(--boarding-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-sm);font-size:.8125rem;line-height:1.4;white-space:nowrap}
.tag.safety{background:var(--danger-solid);color:var(--on-danger-solid);font-weight:600}
.tag.care{background:var(--warning-bg);color:var(--warning);font-weight:500}
.tag .ico{width:16px;height:16px}

/* ---------- exception / request bars ---------- */
.bars{display:flex;flex-direction:column;gap:8px;padding:0 24px 12px}
.bar{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:var(--r-lg);min-height:52px;font-size:.875rem}
.bar.exc{background:var(--rail-bg);color:var(--rail-on);border:2px solid var(--rail-bg)}
.bar.req{background:var(--surface);border:2px solid var(--ink)}
.bar-title{display:inline-flex;align-items:center;gap:8px;color:var(--sign);font-weight:800;white-space:nowrap}
.bar.req .bar-title{color:var(--ink)}
.bar-sum{flex:1;color:inherit;line-height:1.5;min-width:0}
.bar.exc .textbtn{color:var(--sign)}
.reqchip{min-height:44px;padding:0 12px;border:2px solid var(--sign);border-radius:var(--r-sm);color:var(--sign);font-weight:700;white-space:nowrap}
.reqchip:hover{background:var(--rail-line)}
.bar.exc .textbtn:hover{background:var(--rail-line)}
.bar.exc :focus-visible{outline-color:var(--sign)}
.phone .bars{padding:0 16px 10px}
.phone .bar{padding:6px 6px 6px 12px;gap:8px}

/* ---------- tabs ---------- */
.tabs-wrap{position:sticky;top:0;z-index:5;background:var(--background);border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 24px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs{scroll-snap-type:x proximity;scroll-padding-inline:24px}
.phone .tabs{scroll-padding-inline:12px}
.tab{scroll-snap-align:start}
.tabs.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.tabs.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px);mask-image:linear-gradient(to right,transparent,#000 48px)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 10px;color:var(--ink-muted);white-space:nowrap;font-size:.9375rem}
.tab .count{min-width:26px;padding:1px 7px;border-radius:var(--r-sm);background:var(--surface-variant);font-size:.8125rem;font-weight:600;text-align:center;color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:800}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:4px;right:4px;bottom:-2px;height:5px;background:var(--ink)}
.tab[aria-selected="true"] .count{background:var(--ink);color:var(--background);font-weight:700}
.phone .tabs{padding:0 12px}
.filterrow{display:flex;align-items:center;gap:8px;padding:12px 24px 0;font-size:.875rem;color:var(--ink-muted)}
.phone .filterrow{padding:10px 16px 0}

/* ---------- list & cards ---------- */
.list{display:flex;flex-direction:column;gap:10px;padding:14px 24px 120px}
.phone .list{padding:12px 16px 120px}
.group-label{font-size:.8125rem;font-weight:500;color:var(--ink-muted);padding:14px 4px 2px}
.now{display:flex;align-items:center;gap:0;font-size:0;font-weight:800;color:var(--background);padding:2px 0}
.now::before{content:attr(aria-label);font-size:.875rem;background:var(--ink);border:2px solid var(--ink);border-radius:var(--r-sm);padding:2px 12px;white-space:nowrap}
.now::after{content:"";flex:1;height:2px;background:var(--ink)}
.cardwrap{container-type:inline-size}
.card{position:relative;display:grid;grid-template-columns:8.5rem minmax(0,1fr) minmax(0,1.45fr) minmax(0,1.15fr) 13.5rem;grid-template-areas:"time pet svc tags act";gap:4px 20px;align-items:center;padding:14px 20px 14px 14px;min-height:96px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);transition:background-color .25s ease-out,border-color .25s ease-out}
.card.exc{background:var(--danger-tint);border:2px solid var(--danger-solid)}
.card.ended{background:transparent}
.card:has(.c-link:focus-visible){outline:2px solid var(--focus-ring);outline-offset:2px}
.card:hover:not(.exc){border-color:var(--ink)}
/* numeral plate: state lives in the plate's form, not only its hue */
.c-time{grid-area:time;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:center;align-self:stretch;padding:10px 12px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--surface);color:var(--ink)}
.c-time .t{font-family:var(--display);font-size:1.625rem;font-weight:400;line-height:1.05;letter-spacing:0}
.c-time .t2{font-size:.8125rem;font-weight:600;color:inherit;opacity:.85}
.c-time .stage{font-size:.8125rem;font-weight:800;line-height:1.3}
.card.blocked .c-time{border:3px dashed var(--ink);padding:9px 11px}
.card.next .c-time{background:var(--sign);color:var(--on-sign);border-color:var(--ink);border-style:solid}
.card.exc .c-time{background:var(--rail-bg);color:var(--sign);border-color:var(--ink);border-style:solid;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--danger-solid)}
.card.ended .c-time{background:var(--surface-variant);border:2px solid var(--border);color:var(--ink-muted)}
.c-pet{grid-area:pet;min-width:0}
.c-link{text-decoration:none;outline:none}
.c-link::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg)}
.c-pet .name{font-size:1.1875rem;font-weight:800;line-height:1.4}
.c-pet .breed{font-size:.875rem;font-weight:500;color:var(--ink-muted);margin-left:6px}
.c-pet .owner{font-size:.875rem;font-weight:500;color:var(--ink-muted);margin-top:2px}
.c-svc{grid-area:svc;min-width:0;font-size:.9375rem;line-height:1.45}
.c-svc .res{color:var(--ink-muted);font-size:.875rem;font-weight:500}
.c-svc .ctx{color:var(--ink-muted);font-size:.875rem;font-weight:500;margin-top:2px}
.c-svc .ctx.danger{color:var(--danger);font-size:.9375rem;font-weight:800}
.c-tags{grid-area:tags;display:flex;flex-wrap:wrap;gap:6px}
.c-act{grid-area:act;position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;margin-left:8px}
.act-row{display:flex;gap:12px;align-items:center}
.act-row .btn.primary,.act-row .btn.next,.act-row .btn.secondary,.act-row .btn[aria-disabled]{min-width:9.5rem;min-height:52px}
.more{width:48px;height:48px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.more:hover{background:var(--primary-tint)}
.more[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.c-act .reason{text-align:right;max-width:13rem}
.ended-note{font-size:.875rem;font-weight:500;color:var(--ink-muted)}

/* lifecycle track: drawn with currentColor so it reads on any plate; hollow = next to press, solid = happening now */
.track{display:flex;gap:3px;margin-top:4px;align-items:center;height:10px}
.track i{display:block;width:10px;height:5px;border-radius:0;background:currentColor;opacity:.6;transform-origin:left;transition:opacity .35s cubic-bezier(.16,1,.3,1)}
.track i.done{height:7px;opacity:1}
.track i.cur{width:22px;height:10px;background:transparent;opacity:1;outline:2px solid currentColor;outline-offset:-2px}
.track i.cur.active{background:currentColor;outline:0;animation:fill .5s cubic-bezier(.16,1,.3,1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card.flash{outline:3px solid var(--sign);outline-offset:2px;animation:lit 4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes lit{70%{outline-color:var(--sign)}to{outline-color:transparent}}

/* medium width: 3-column card */
@container (max-width: 880px){
  .card{grid-template-columns:7.5rem minmax(0,1fr) 13.5rem;grid-template-areas:"time pet act" "time svc act" "time tags act";gap:6px 16px}
}
/* narrow / large text: stacked card, primary + ⋯ on one row */
@container (max-width: 560px){
  .card{grid-template-columns:minmax(0,1fr);grid-template-areas:"time" "pet" "svc" "tags" "act";gap:8px;padding:14px 16px}
  .c-time{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;align-self:auto;padding:8px 12px}
  .c-time .track{margin:0 0 0 auto}
  .c-act{align-items:stretch;margin-left:0}
  .act-row{width:100%}
  .act-row .btn.primary,.act-row .btn.next,.act-row .btn.secondary,.act-row .btn[aria-disabled]{flex:1;min-width:0}
  .c-act .reason{text-align:left;max-width:none}
}
.stacked .card{grid-template-columns:minmax(0,1fr);grid-template-areas:"time" "pet" "svc" "tags" "act";gap:8px;padding:14px 16px}
.stacked .c-time{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;align-self:auto;padding:8px 12px}
.stacked .c-time .track{margin:0 0 0 auto}
.stacked .c-act{align-items:stretch;margin-left:0}
.stacked .act-row{width:100%}
.stacked .act-row .btn.primary,.stacked .act-row .btn.next,.stacked .act-row .btn.secondary,.stacked .act-row .btn[aria-disabled]{flex:1;min-width:0}
.stacked .c-act .reason{text-align:left;max-width:none}

.empty{padding:40px 16px;text-align:center;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.skel{height:84px;border-radius:var(--r-lg);background:var(--surface-variant);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}

/* ---------- overflow menu (portalled) ---------- */
.menu{position:fixed;z-index:40;width:220px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-md);padding:4px 0;overflow:hidden}
.menu button{display:flex;align-items:center;width:100%;min-height:44px;padding:0 16px;font-size:.9375rem;text-align:left;color:var(--ink)}
.menu button+button{border-top:1px solid var(--border)}
.menu button:hover,.menu button:focus-visible{background:var(--background);outline:none}
.menu button[aria-disabled="true"]{color:var(--ink-muted);cursor:not-allowed}
.menu .mreason{font-size:.8125rem;color:var(--ink-muted);margin-left:auto;padding-left:12px}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:30;left:calc(var(--rail) + (100vw - var(--rail)) / 2);bottom:24px;transform:translateX(-50%);width:min(480px,calc(100vw - var(--rail) - 48px));background:var(--toast);color:var(--on-toast);border-radius:var(--r-md);min-height:48px;display:flex;align-items:center;gap:12px;padding:4px 8px 4px 16px;overflow:hidden;animation:rise .22s cubic-bezier(.16,1,.3,1)}
.phone-toast{left:50%;bottom:calc(76px + env(safe-area-inset-bottom));width:calc(100vw - 32px)}
.toast .msg{flex:1;font-size:.9375rem}
.toast .undo{min-height:44px;min-width:44px;padding:0 10px;color:var(--on-toast);font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:0}
.toast .undo:focus-visible{outline-color:var(--on-toast)}
.toast .left{position:absolute;left:0;bottom:0;height:2px;background:var(--on-toast);opacity:.5;transform-origin:left}
@keyframes rise{from{transform:translate(-50%,12px);opacity:0}}

/* ---------- sub pages ---------- */
.sub{padding:12px 24px 120px;max-width:1100px}
.phone .sub{padding:8px 16px 140px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px 0 2px;color:var(--ink-muted);font-weight:500;border-radius:var(--r-md)}
.back:hover{color:var(--ink)}
.sub h1{font-size:1.375rem;font-weight:600;line-height:1.3;margin:8px 0 4px}
.phone .sub h1{font-size:1.125rem}
.sub .lede{color:var(--ink-muted);font-size:.875rem;margin-bottom:20px}
.sub h2{font-size:1.0625rem;font-weight:600;margin-bottom:12px}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-lg);padding:20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.phone .cols,.stacked .cols{grid-template-columns:minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;font-size:.875rem;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-muted)}
.row.total{font-size:1.0625rem;font-weight:600;border-top:1px solid var(--ink);border-bottom:0;margin-top:4px}
.dl{display:grid;grid-template-columns:7rem 1fr;gap:10px 16px;font-size:.9375rem}
.dl dt{color:var(--ink-muted);font-size:.875rem}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:.875rem;min-height:44px}
.notice.warning{background:var(--warning-bg);color:var(--warning)}
.notice.success{background:var(--success-bg);color:var(--success)}
.notice.neutral{background:var(--neutral-bg);color:var(--neutral)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.875rem;color:var(--ink-muted);margin-bottom:20px}
.steps .on{color:var(--ink);font-weight:600}
.steps .ok{color:var(--success)}
.bigtrack{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.bigtrack div{font-size:.8125rem;color:var(--ink-muted);padding-top:8px;border-top:3px solid var(--track)}
.bigtrack .done{border-color:var(--ink-muted)}
.bigtrack .cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.actions .cell{display:flex;flex-direction:column}

/* pickers */
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{min-height:48px;border:1px solid var(--control-border);border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:.9375rem;text-align:left}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--control-border);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{background:var(--primary-tint);border-color:var(--ink);font-weight:700}
.opt[aria-checked="true"] .radio{border-color:var(--ink)}
.opt[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-variant);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:var(--r-sm);color:var(--ink-muted);font-size:.9375rem;padding:0 8px}
.seg button[aria-checked="true"]{background:var(--surface);border:2px solid var(--ink);color:var(--ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.875rem;color:var(--ink-muted)}
.field input,.field textarea{min-height:44px;border:1px solid var(--control-border);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;font-size:1rem}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
.field .err{color:var(--danger);font-size:.8125rem;font-weight:500}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.change{display:flex;justify-content:space-between;font-size:.9375rem;padding:10px 0}
.checklist{display:flex;flex-direction:column}
.checkrow{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.checkrow:last-child{border-bottom:0}
.checkrow .seg{width:100%}
.phone .checkrow{grid-template-columns:1fr}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 0 4px}
.result .badge{width:56px;height:56px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center}
.result h2{font-size:1.375rem;margin:0}
.result p{color:var(--ink-muted)}
.result .btn{width:100%;margin-top:8px}
.camera{aspect-ratio:4/3;max-height:320px;border-radius:var(--r-lg);background:var(--ink);display:grid;place-items:center;color:var(--surface);font-size:.9375rem;position:relative;overflow:hidden}
.camera .frame{width:52%;aspect-ratio:1;border:3px solid var(--surface);border-radius:var(--r-lg)}
.camera p{position:absolute;bottom:14px;left:0;right:0;text-align:center}
.results{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);text-align:left;width:100%}
.rrow:hover{border-color:var(--control-border)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dialog{width:min(440px,100%);background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-lg);padding:24px}
.dialog h2{font-size:1.125rem;font-weight:600;margin-bottom:8px}
.dialog p{color:var(--ink-muted);font-size:.9375rem;margin-bottom:20px}
.dialog .dbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- tablet sign mode (owner tokens + merchant brand) ---------- */
.handover{position:fixed;inset:0;z-index:60;background:var(--owner-surface);color:var(--owner-ink);display:flex;flex-direction:column;--focus-ring:var(--owner-ink)}
.handover .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.logo{width:56px;height:56px;border-radius:var(--r-owner-md);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:1.375rem;font-weight:600}
.logo.s{width:36px;height:36px;font-size:1.125rem}
.handover .store{font-size:1rem}
.handover .store small{display:block;font-size:.875rem;color:var(--owner-ink-muted);font-weight:500}
.handover h2{font-size:1.375rem;font-weight:600;line-height:1.3}
.handover p{font-size:1rem;color:var(--owner-ink-muted);line-height:1.6;max-width:30em}
.obtn{min-height:52px;padding:14px 20px;border-radius:var(--r-owner-md);background:var(--brand);color:var(--on-brand);font-size:1.0625rem;font-weight:600;width:min(400px,100%)}
.obtn.big{min-height:64px}
.obtn.sec{background:var(--owner-surface);color:var(--owner-ink);border:1px solid var(--owner-control-border);font-weight:500}
.signbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--owner-border)}
.signbar .who{display:flex;align-items:center;gap:10px;font-size:1rem}
.signbar .step{font-size:1.125rem;font-weight:600}
.signbar .n{justify-self:end;font-size:.875rem;font-weight:500;color:var(--owner-ink-muted)}
.protonote{max-width:640px;width:100%;border:1px dashed var(--owner-ink-muted);border-radius:var(--r-owner-md);padding:16px;font-size:.875rem;color:var(--owner-ink-muted);text-align:left;line-height:1.6}
.avatar{position:relative;width:72px;height:72px;border-radius:var(--r-owner-md);background:var(--owner-surface-variant);display:grid;place-items:center;font-size:1.375rem;font-weight:600}
.avatar .ok{position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;border-radius:50%;background:var(--success-bg);color:var(--success);border:3px solid var(--owner-surface);display:grid;place-items:center}


/* ================= alternative looks (data-skin) ================= */

:root[data-skin="warm"][data-theme="dark"]{--background:#1C1816;--surface:#27211E;--surface-variant:#322B27;--ink:#F5EFEB;--ink-muted:#BCB0A8;--border:#3B332E;--control-border:#8A7D75;--track:#3A322D;--primary:#F5EFEB;--primary-hover:#FFFFFF;--on-primary:#2B2420;--primary-tint:#3A2F29;--focus-ring:#FFB08F;--sign:#FF8A5C;--sign-hover:#FFA07B;--on-sign:#2B1A12;--rail-bg:#14110F;--rail-ink:#BCB0A8;--rail-line:#322B27;--rail-on:#F5EFEB;--rail-cur:#3A2F29;--rail-cur-ink:#F5EFEB;--danger-tint:#2E1D1C;--border-danger:#6B2A27;--line:#FF8A5C;color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-skin="warm"]:not([data-theme="light"]){--background:#1C1816;--surface:#27211E;--surface-variant:#322B27;--ink:#F5EFEB;--ink-muted:#BCB0A8;--border:#3B332E;--control-border:#8A7D75;--track:#3A322D;--primary:#F5EFEB;--primary-hover:#FFFFFF;--on-primary:#2B2420;--primary-tint:#3A2F29;--focus-ring:#FFB08F;--sign:#FF8A5C;--sign-hover:#FFA07B;--on-sign:#2B1A12;--rail-bg:#14110F;--rail-ink:#BCB0A8;--rail-line:#322B27;--rail-on:#F5EFEB;--rail-cur:#3A2F29;--rail-cur-ink:#F5EFEB;--danger-tint:#2E1D1C;--border-danger:#6B2A27;--line:#FF8A5C;color-scheme:dark}}
:root[data-skin="planner"]{--background:#F6F7F9;--surface:#FFFFFF;--surface-variant:#E8EBF0;--ink:#171B26;--ink-muted:#4D5568;--border:#DADEE6;--control-border:#6D7589;--track:#DDE1E9;--primary:#1F3A8A;--primary-hover:#2B4BA6;--on-primary:#FFFFFF;--primary-tint:#E6EBF8;--focus-ring:#1F3A8A;--sign:#1F3A8A;--sign-hover:#2B4BA6;--on-sign:#FFFFFF;--rail-bg:#FFFFFF;--rail-ink:#4D5568;--rail-line:#E8EBF0;--rail-on:#171B26;--rail-cur:#E6EBF8;--rail-cur-ink:#1F3A8A;--danger-tint:#FDF1EF;--border-danger:#E9A9A3;--r-sm:4px;--r-md:8px;--r-lg:10px;--line:#1F3A8A;--hl:#CFF1DE;color-scheme:light}
:root[data-skin="planner"][data-theme="dark"]{--background:#0F1115;--surface:#171A21;--surface-variant:#20242D;--ink:#E9ECF2;--ink-muted:#A7AEBF;--border:#272C37;--control-border:#7B8397;--track:#252A35;--primary:#8FA8FF;--primary-hover:#A9BCFF;--on-primary:#0F1115;--primary-tint:#1D2540;--focus-ring:#8FA8FF;--sign:#8FA8FF;--sign-hover:#A9BCFF;--on-sign:#0F1115;--rail-bg:#0B0D11;--rail-ink:#A7AEBF;--rail-line:#20242D;--rail-on:#E9ECF2;--rail-cur:#1D2540;--rail-cur-ink:#C9D5FF;--danger-tint:#2A1A1A;--border-danger:#6B2A27;--line:#8FA8FF;--hl:#1F3D33;color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-skin="planner"]:not([data-theme="light"]){--background:#0F1115;--surface:#171A21;--surface-variant:#20242D;--ink:#E9ECF2;--ink-muted:#A7AEBF;--border:#272C37;--control-border:#7B8397;--track:#252A35;--primary:#8FA8FF;--primary-hover:#A9BCFF;--on-primary:#0F1115;--primary-tint:#1D2540;--focus-ring:#8FA8FF;--sign:#8FA8FF;--sign-hover:#A9BCFF;--on-sign:#0F1115;--rail-bg:#0B0D11;--rail-ink:#A7AEBF;--rail-line:#20242D;--rail-on:#E9ECF2;--rail-cur:#1D2540;--rail-cur-ink:#C9D5FF;--danger-tint:#2A1A1A;--border-danger:#6B2A27;--line:#8FA8FF;--hl:#1F3D33;color-scheme:dark}}
:root[data-skin] .c-time .t{font-family:var(--font);font-weight:800;letter-spacing:0}

/* ---- metro 捷運線: the day is a line, each pet rides it station by station ---- */
:root[data-skin="metro"] .c-time{border:0;background:transparent;padding:0;box-shadow:none;color:var(--ink)}
:root[data-skin="metro"] .c-time .t{font-size:1.5rem;line-height:1.15}
:root[data-skin="metro"] .c-time .t2{opacity:1;color:var(--ink-muted);font-weight:500}
:root[data-skin="metro"] .c-time .stage{color:var(--line);font-weight:800}
:root[data-skin="metro"] .card.exc .c-time,:root[data-skin="metro"] .card.next .c-time,:root[data-skin="metro"] .card.blocked .c-time,:root[data-skin="metro"] .card.ended .c-time{background:transparent;border:0;padding:0;box-shadow:none}
:root[data-skin="metro"] .card.exc .c-time,:root[data-skin="metro"] .card.exc .c-time .stage{color:var(--danger)}
:root[data-skin="metro"] .card.ended .c-time{color:var(--ink-muted)}
:root[data-skin="metro"] .card{border-radius:var(--r-lg);padding:16px 20px}
:root[data-skin="metro"] .card.next{border:2px solid var(--line)}
:root[data-skin="metro"] .card.exc{border:2px solid var(--danger-solid)}
:root[data-skin="metro"] .card.blocked:not(.exc):not(.next){border-style:dashed;border-color:var(--control-border)}
:root[data-skin="metro"] .track{gap:0;height:18px;margin-top:8px}
:root[data-skin="metro"] .track i,:root[data-skin="metro"] .track i.done,:root[data-skin="metro"] .track i.cur,:root[data-skin="metro"] .track i.cur.active{position:relative;flex:none;width:12px;height:12px;margin-right:12px;border-radius:50%;background:var(--surface);border:2px solid var(--control-border);outline:0;opacity:1;animation:none}
:root[data-skin="metro"] .track i:not(:last-child)::after{content:"";position:absolute;left:100%;top:50%;width:12px;height:3px;margin-top:-1.5px;background:var(--control-border)}
:root[data-skin="metro"] .track i.done{background:var(--line);border-color:var(--line)}
:root[data-skin="metro"] .track i.done::after{background:var(--line)!important}
:root[data-skin="metro"] .track i.cur{width:18px;height:18px;margin-right:8px;margin-left:-3px;border:4px solid var(--line);background:var(--surface)}
:root[data-skin="metro"] .track i.cur::after{width:8px}
:root[data-skin="metro"] .track i.cur.active{background:var(--line)}
:root[data-skin="metro"] .card.exc .track i.cur{border-color:var(--danger-solid)}
:root[data-skin="metro"] .bar.exc{border-radius:var(--r-lg)}
:root[data-skin="metro"] .bar.exc .bar-title{color:#FFB4A8}
:root[data-skin="metro"] .bar.exc .textbtn,:root[data-skin="metro"] .reqchip{color:#fff}
:root[data-skin="metro"] .reqchip{border-color:#fff}
:root[data-skin="metro"] .now::before{background:var(--line);border-color:var(--line);color:var(--on-sign)}
:root[data-skin="metro"] .now{color:var(--on-sign)}

const branchAppts = () => state.branch === '中山店' ? state.appts : [];

function tagsOf(a, full) {

  a.care.forEach(t => out.push({k:'care', t}));
  if (a.overdue) out.push({k:'danger', t: a.overdue.kind === 'checkout' ? `退房逾時 ${late(a)} 分` : `逾時 ${late(a)} 分未到`});

/* one primary per card: the most urgent next step */
function primaryOf(a) {
  const ph = state.phone, off = state.offline;

        if (a.later) return {label:'改期', act:'reschedule'};

      }
      return {label: a.cat === 'boarding' ? '入住' : '報到', act:'checkin'};
    case 'checked_in':
      return a.petCheck ? {label:'開始服務', act:'start'} : {label:'記錄現況', act:'petcheck'};
    case 'in_service':
      if (a.cat === 'boarding') return a.outToday ? {label:'開始退房', act:'checkoutB'} : {label:'新增照護備註', act:'note'};

  return `<div class="handover" role="dialog" aria-modal="true" aria-labelledby="ho-t">${head}<div class="center">
    ${later ? `<div class="avatar" aria-hidden="true">${esc(a.pet[0])}</div>` : `<div class="avatar" aria-hidden="true">${esc(a.pet[0])}<span class="ok">${ic('check')}</span></div>`}
    <h2 id="ho-t" tabindex="-1">${later ? '契約已傳到你的 LINE' : '簽署完成'}</h2>
    <p>${later ? '可以慢慢看。簽約後才能開始服務。' : '正本會傳到你的 LINE'}</p>
    <button class="obtn" data-key="ho-back" data-do="hoBack">交還店員</button></div></div>`;
}

/* ---------- toast with deferred commit (undo whitelist: 報到, 新增備註) ---------- */
let tick = null;
function toast(text, undo, announce) {
  if (state.toast?.undo) commitPending();
  clearInterval(tick);
  state.toast = {text, undo: undo || null, total: undo ? 10000 : 4000, remain: undo ? 10000 : 4000, paused:false};
  renderLayer();
  say(announce || text);
  let last = Date.now();
  tick = setInterval(() => {
    const now = Date.now(), t = state.toast;
    if (!t) return clearInterval(tick);
    if (!t.paused) t.remain -= now - last;
    last = now;
    const bar = document.getElementById('tleft'); if (bar) bar.style.transform = `scaleX(${Math.max(0, t.remain / t.total)})`;
    if (t.remain <= 0) { if (t.undo) commitPending(); state.toast = null; clearInterval(tick); renderLayer(); }
  }, 100);
}
function commitPending() { if (state.toast?.undo) { state.toast.undo.commit?.(); state.toast.undo = null; } }
function doUndo() {
  const u = state.toast?.undo; if (!u) return;
  u.revert(); state.toast = null; clearInterval(tick);
  focusAfter = u.focus; render(); say('已復原');
}

/* ---------- actions ---------- */
const snap = a => JSON.parse(JSON.stringify(a));
const restore = (a, s) => { Object.keys(a).forEach(k => delete a[k]); Object.assign(a, s); };
function flash(a) { a.flash = true; setTimeout(() => { a.flash = false; }, 1300); }
function toBoard(id) {
  state.view = {name:'board'}; state.pay = null; state.check = null; state.note = null;
  focusAfter = id ? (primaryOf(byId(id)) && byId(id).status !== 'completed' ? `p-${id}` : `l-${id}`) : null;
  render();
  if (id && !document.querySelector(`[data-key="${focusAfter}"]`)) document.getElementById('board-title')?.focus();
}
function open(view) { closeMenu(false); state.view = view; render(); window.scrollTo(0, 0); (document.getElementById('sub-title') || document.getElementById('board-title'))?.focus(); }

const ACTIONS = {
  checkin(a) {
    const before = snap(a);
    a.status = a.cat === 'boarding' ? 'in_service' : 'checked_in';
    if (a.cat === 'boarding') { a.inToday = false; a.t = '10/5'; a.t2 = '→ 10/8'; a.start = '99:00'; a.ctx = `${NOW} 入住・10/8 退房`; }
    else { a.ctx = `${NOW} 報到${a.overdue ? `・晚到 ${late(a)} 分` : ''}`; }
    delete a.overdue; a.notifyFailed = false; flash(a);
    const verb = a.cat === 'boarding' ? '已入住' : '已報到';
    toast(`${verb}。${a.pet}`, {revert: () => restore(a, before), focus:`p-${a.id}`}, `${verb}，${a.pet}，可復原`);
    focusAfter = `p-${a.id}`; render();
  },
  petcheck(a) { state.check = {}; open({name:'petcheck', id:a.id}); },
  start(a) { a.status = 'in_service'; a.ctx = `${NOW} 開始・${a.res}`; flash(a); toast(`已開始服務。${a.pet}`); focusAfter = `p-${a.id}`; render(); },
  complete(a) { a.status = 'service_completed'; a.recordSigned = false; a.ctx = `${NOW} 完成・已通知接回`; flash(a); toast(`已完成服務。${a.pet}・已通知接回`); focusAfter = `p-${a.id}`; render(); },
  sign(a) { if (state.phone || state.offline) return; closeMenu(false); state.handover = {id:a.id, kind:'contract', step:'start'}; renderLayer(); document.getElementById('ho-t')?.focus(); },
  recordSign(a) { if (state.phone || state.offline) return; state.handover = {id:a.id, kind:'record', step:'start'}; renderLayer(); document.getElementById('ho-t')?.focus(); },
  confirmSign(a) { a.contract = 'signed'; a.staffConfirm = false; a.expired = false; a.read = false; a.ctx = `契約已簽 ${NOW}・正本傳送中`; flash(a); toast(`已確認簽署。${a.pet}`); focusAfter = `p-${a.id}`; render(); },
  pay(a) { if (state.offline) return; state.pay = {method:null, mode:'full', part:'', cash:'', busy:false, done:false}; open({name:'pay', id:a.id}); updatePayUI(); },
  checkoutB(a) {
    if (!a.lateAdded && a.overdue) { a.items.push([`逾時退房費（逾時 ${late(a)} 分，系統自動加收）`, 600]); a.lateAdded = true; }
    ACTIONS.pay(a);
  },
  checkout(a) {
    a.status = 'completed'; a.ctx = `${NOW} 已離店`; delete a.overdue;
    toast(`已離店。${a.pet}`); toBoard(a.id);
  },
  review(a) { if (state.role !== 'mgr') return; open({name:'review', id:a.id}); },
  reschedule(a) { open({name:'stub', kind:'reschedule'}); },
  note(a) { state.note = ''; open({name:'note', id:a.id}); },
  resendNotify(a) { a.notifyFailed = false; a.ctx = `${NOW} 已補發提醒（改用簡訊）`; closeMenu(false); toast(`已補發通知。${a.pet}`); focusAfter = `p-${a.id}`; render(); },
  resendLink(a) { a.expired = false; a.ctx = `${NOW} 已補發契約連結，舊連結失效`; closeMenu(false); toast(`已補發契約連結。${a.pet}`); focusAfter = `p-${a.id}`; render(); },
  resendOriginal(a) {
    a.original = 'sending'; a.ctx = `${NOW} 補發正本（改用簡訊）`; closeMenu(false); toast(`已補發正本。${a.pet}`); focusAfter = `p-${a.id}`; render();
    setTimeout(() => { a.original = 'delivered'; if (state.view.name === 'board') renderBoardBody(); }, 2500);
  },
  noShow(a) {
    closeMenu(false);
    state.confirm = {title:`把${a.pet}標記為未到？`, body:`會釋放 ${a.res.split('・')[0]} 這個時段，並依取消政策計算費用。之後要取消標記需店長以上權限。`, yes:'確認標記', no:'返回', id:a.id, ret:`p-${a.id}`,
      run: () => { a.status = 'no_show'; a.ctx = `${NOW} 標記未到・${staff()}`; delete a.overdue; a.notifyFailed = false; toast(`已標記未到。${a.pet}・已記錄操作紀錄`); }};
    renderLayer(); document.querySelector('[data-key="dlg-no"]')?.focus();
  }
};

const DO = {
  refresh() { state.loading = true; renderBoardBody(); setTimeout(() => { state.loading = false; renderBoardBody(); say(`已更新，${NOW}`); }, 600); },
  walkin() { open({name:'stub', kind:'walkin', nav: state.phone ? 'walkin' : null}); },
  filterExc() { state.filter = 'exc'; focusAfter = 'clearfilter'; renderBoardBody(); },
  filterReq() { state.filter = 'req'; focusAfter = 'clearfilter'; renderBoardBody(); },
  clearFilter() { state.filter = null; focusAfter = `tab-${state.tab}`; renderBoardBody(); },
  back() { const id = state.view.id; toBoard(id); },
  undo: doUndo,
  saveCheck() {
    const a = byId(state.view.id); a.petCheck = true;
    const ab = CHECK_ITEMS.filter(k => state.check[k] === '異常');
    a.ctx = `${NOW} 現況已記錄${ab.length ? `・${ab.join('、')}異常` : '・全部正常'}`; flash(a);
    toast(`已記錄現況。${a.pet}`); toBoard(a.id);
  },
  paySubmit() {
    const a = byId(state.view.id), s = state.pay; if (payDisabled(a) || s.busy) return;
    s.busy = true; updatePayUI();
    setTimeout(() => {
      const amt = payAmount(a);
      a.paid += amt; (a.records ||= []).push({m:s.method, t:NOW, by:staff(), amt});
      s.busy = false; s.done = true;
      if (a.cat !== 'boarding') a.ctx = owed(a) ? `${NOW} 收款 ${nt(amt)}・還有 ${nt(owed(a))} 未收` : `${NOW} 已收清`;
      render(); document.getElementById('pay-done')?.focus(); say(`已收款，新台幣 ${fmt(amt)} 元`);
    }, 700);
  },
  confirmCheckoutB() {
    const a = byId(state.view.id); a.status = 'completed'; a.ctx = `${NOW} 已退房`; delete a.overdue; a.outToday = false;
    toast(`已退房。${a.pet}・已記錄操作紀錄`); toBoard(a.id);
  },
  approve() {
    const a = byId(state.view.id), to = a.request.to;
    state.appts = state.appts.filter(x => x !== a);
    toast(`已核准改期。${a.pet} → ${to}`); toBoard(null); document.getElementById('board-title')?.focus();
  },
  reject() {
    const why = document.getElementById('rv-why'), r = document.getElementById('rv-no-r');
    if (!why.value.trim()) { r.textContent = '請填寫拒絕原因'; why.setAttribute('aria-invalid', 'true'); why.setAttribute('aria-describedby', 'rv-no-r'); why.focus(); return; }
    const a = byId(state.view.id); delete a.request; a.ctx = `${NOW} 已拒絕改期・原時段保留`;
    toast(`已拒絕改期。${a.pet}・已通知飼主`); toBoard(a.id);
  },
  saveNote() {
    const a = byId(state.view.id), text = state.note.trim(), before = snap(a);
    (a.notes ||= []).push(`${NOW} ${staff()}：${text}`);
    if (a.cat === 'boarding') a.ctx = `${NOW} ${text}`.slice(0, 40);
    toast(`已新增備註。${a.pet}`, {revert: () => restore(a, before), focus:`p-${a.id}`}, `已新增備註，${a.pet}，可復原`); toBoard(a.id);
  },
  dlgNo() { const r = state.confirm.ret; state.confirm = null; renderLayer(); document.querySelector(`[data-key="${r}"]`)?.focus(); },
  dlgYes() { const c = state.confirm; state.confirm = null; c.run(); focusAfter = null; render(); document.getElementById('board-title')?.focus(); },
  hoStart() { state.handover.step = 'sign'; renderLayer(); document.getElementById('ho-t')?.focus(); },
  hoDone() { state.handover.step = 'done'; renderLayer(); document.getElementById('ho-t')?.focus(); },
  hoLater() { state.handover.step = 'later'; renderLayer(); document.getElementById('ho-t')?.focus(); },
  hoBack() {
    const h = state.handover, a = byId(h.id); state.handover = null;
    if (h.step === 'later') { a.later = true; a.expired = false; a.ctx = `契約已傳到 LINE・${NOW}`; }
    else if (h.kind === 'contract') { a.staffConfirm = true; a.ctx = `平板簽署 ${NOW}・已交還`; }
    else { a.recordSigned = true; a.original = 'sending'; a.ctx = `服務內容紀錄已簽 ${NOW}・正本傳送中`; setTimeout(() => { a.original = 'delivered'; }, 2500); }
    flash(a); state.view = {name:'board'}; focusAfter = `p-${a.id}`; render();
    say(h.step === 'later' ? `${a.pet}，飼主選擇之後再簽` : `${a.pet}，已交還，${h.kind === 'contract' ? '待店員確認' : '服務紀錄已簽'}`);
  }
};

const WRITES = new Set(['checkin','start','complete','confirmSign','checkout','resendNotify','resendLink','resendOriginal','saveCheck','paySubmit','confirmCheckoutB','approve','reject','saveNote','dlgYes','hoBack']);

/* ---------- overflow menu ---------- */
function openMenu(id, trigger) {
  const r = trigger.getBoundingClientRect(), w = 220, items = overflowOf(byId(id)).length;
  const hgt = items * 45 + 10;
  let top = r.bottom + 6; if (top + hgt > innerHeight - 8) top = Math.max(8, r.top - hgt - 6);
  state.menu = {id, top, y: scrollY, left: Math.max(8, Math.min(r.right - w, innerWidth - w - 8))};
  trigger.setAttribute('aria-expanded', 'true');
  renderLayer();
  placeMenu(trigger);
  document.querySelector('#menu [data-mi="0"]')?.focus();
}
function placeMenu(trigger) {
  const m = document.getElementById('menu'); if (!m) return;
  const r = trigger.getBoundingClientRect(), h = m.offsetHeight, left = state.menu.left, right = left + m.offsetWidth;
  const btns = [...document.querySelectorAll('.c-act .btn, .c-act .more')].filter(b => b !== trigger).map(b => b.getBoundingClientRect()).filter(b => b.right > left && b.left < right);
  const cuts = (top, bottom) => btns.some(b => (b.top < bottom && b.bottom > bottom) || (b.top < top && b.bottom > top));
  const below = r.bottom + 6, above = r.top - 6 - h;
  let top = below, pad = 0;
  if (cuts(below, below + h) || below + h > innerHeight - 8) {
    if (above >= 8 && !cuts(above, above + h)) top = above;
    else { const hit = btns.find(b => b.top < below + h && b.bottom > below + h); if (hit) pad = hit.bottom + 6 - (below + h); }
  }
  state.menu.top = top; m.style.top = top + 'px'; if (pad) m.style.paddingBottom = (4 + pad) + 'px';
}
function closeMenu(returnFocus = true) {
  if (!state.menu) return;
  const id = state.menu.id; state.menu = null; renderLayer();
  const t = document.querySelector(`[data-key="m-${id}"]`);
  if (t) { t.setAttribute('aria-expanded', 'false'); if (returnFocus) t.focus(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-do],[data-more],[data-open],[data-tab],[data-nav],[data-check],[data-method],[data-mode]');
  if (state.menu && !e.target.closest('#menu') && !e.target.closest('[data-more]')) closeMenu(false);
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') { const r = el.getAttribute('aria-describedby'); if (r) say(document.getElementById(r)?.textContent || ''); return; }
  const d = el.dataset;
  if (d.more) { e.preventDefault(); state.menu?.id === d.more ? closeMenu() : (closeMenu(false), openMenu(d.more, el)); return; }
  if (d.open) { e.preventDefault(); open({name:'detail', id:d.open}); return; }
  if (d.act) { e.preventDefault(); const a = byId(d.id); closeMenu(false); if (WRITES.has(d.act)) advance(); ACTIONS[d.act]?.(a); return; }
  if (d.do) { e.preventDefault(); if (WRITES.has(d.do)) advance(); DO[d.do]?.(); return; }
  if (d.tab) { state.tab = d.tab; state.filter = null; if (state.view.name !== 'board') open({name:'board'}); focusAfter = `tab-${d.tab}`; renderBoardBody(); return; }
  if (d.nav) {
    if (d.nav === 'board') { state.view = {name:'board'}; render(); document.getElementById('board-title')?.focus(); }
    else if (d.nav === 'search') open({name:'search'});
    else open({name:'stub', kind:d.nav, nav:d.nav});
    return;
  }
  if (d.check) { state.check[d.check] = d.val; focusAfter = `ck-${d.check}-${d.val}`; render(); return; }
  if (d.method) { state.pay.method = d.method; focusAfter = `pm-${d.method}`; document.getElementById('paycol').innerHTML = payForm(byId(state.view.id)); document.querySelector(`[data-key="pm-${d.method}"]`)?.focus(); updatePayUI(); return; }
  if (d.mode) { state.pay.mode = d.mode; document.getElementById('paycol').innerHTML = payForm(byId(state.view.id)); (document.getElementById('pamt') || document.querySelector(`[data-key="pmode-${d.mode}"]`))?.focus(); updatePayUI(); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { state.q = t.value; renderBoardBody(); return; }
  if (t.id === 'sq') { state.sq = t.value; const q = t.value; document.getElementById('sres').innerHTML = searchResults(q ? state.appts.filter(a => a.pet.includes(q) || a.ph.includes(q) || a.code.toLowerCase() === q.toLowerCase()) : [], q); return; }
  if (t.dataset.payin) { t.value = t.value.replace(/\D/g, ''); state.pay[t.dataset.payin] = t.value; updatePayUI(); return; }
  if (t.dataset.checknote) { state.check[t.dataset.checknote + '_n'] = t.value; return; }
  if (t.id === 'note') { const had = !!state.note.trim(); state.note = t.value; if (had !== !!state.note.trim()) document.getElementById('notebtn').innerHTML = noteBtn(); return; }
  if (t.id === 'rv-why') { document.getElementById('rv-no-r').textContent = ''; t.removeAttribute('aria-invalid'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'branch') { state.branch = e.target.value; state.tab = 'all'; state.filter = null; focusAfter = 'branch'; render(); say(`已切換到${state.branch}`); }
});
document.addEventListener('keydown', e => {
  if (state.menu) {
    const items = [...document.querySelectorAll('#menu [role=menuitem]')], i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Tab') closeMenu();
    return;
  }
  if (state.confirm && e.key === 'Escape') { DO.dlgNo(); return; }
  if (state.confirm && e.key === 'Tab') {
    const f = [...document.querySelectorAll('.dialog button')], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); return;
  }
  const tab = e.target.closest?.('[role=tab]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = [...document.querySelectorAll('[role=tab]')], i = tabs.indexOf(tab);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    n.click();
  }
});
/* toast pauses while touched, hovered or focused */
['pointerenter','focusin','pointerdown'].forEach(ev => layer.addEventListener(ev, e => { if (e.target.closest?.('#toast') && state.toast) state.toast.paused = true; }, true));
['pointerleave','focusout'].forEach(ev => layer.addEventListener(ev, e => { if (e.target.closest?.('#toast') && state.toast && !document.getElementById('toast')?.matches(':hover,:focus-within')) state.toast.paused = false; }, true));
addEventListener('scroll', () => state.menu && Math.abs(scrollY - state.menu.y) > 24 && closeMenu(false), {passive:true});
addEventListener('resize', () => { state.menu && closeMenu(false); const tb = document.querySelector('.tabs'); if (tb) fadeTabs(tb); });

/* ---------- prototype controls ---------- */
const mq = matchMedia('(max-width: 767px)');
const params = new URLSearchParams(location.search);
function setTheme(v) { v ? document.documentElement.setAttribute('data-theme', v) : document.documentElement.removeAttribute('data-theme'); }
const $ = id => document.getElementById(id);
$('p-role').value = state.role = params.get('role') === 'clerk' ? 'clerk' : 'mgr';
$('p-theme').value = params.get('theme') || ''; setTheme($('p-theme').value);
function setSkin(v) { v ? document.documentElement.setAttribute('data-skin', v) : document.documentElement.removeAttribute('data-skin'); }
{ const sk = params.get('skin') || ''; $('p-skin').value = ['metro','warm','planner'].includes(sk) ? sk : ''; setSkin($('p-skin').value); }
$('p-skin').onchange = e => setSkin(e.target.value);
$('p-scale').value = String(state.scale = params.get('scale') === '1.3' ? 1.3 : 1);
$('p-offline').checked = state.offline = params.get('offline') === '1';
document.documentElement.style.fontSize = state.scale === 1.3 ? '130%' : '';
$('p-role').onchange = e => { state.role = e.target.value; render(); };
$('p-theme').onchange = e => setTheme(e.target.value);
$('p-scale').onchange = e => { state.scale = +e.target.value; document.documentElement.style.fontSize = state.scale === 1.3 ? '130%' : ''; render(); };
$('p-offline').onchange = e => { state.offline = e.target.checked; render(); say(state.offline ? `離線，${NOW} 更新` : '已連線'); };
$('p-reset').onclick = () => { commitPending(); state.toast = null; clearInterval(tick); Object.assign(state, {appts: SEED(), tab:'all', filter:null, q:'', view:{name:'board'}, menu:null, confirm:null, handover:null}); render(); say('已重設'); };
state.phone = mq.matches;
mq.addEventListener('change', () => { state.phone = mq.matches; closeMenu(false); render(); });
render();
setTimeout(() => { state.loading = false; renderBoardBody(); }, 450);
})();
