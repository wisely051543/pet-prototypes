<!doctype html>
<html lang="zh-Hant-TW" data-brand="magenta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平板簽署交接比較</title>
<style>
/* 平板簽署交接：三種構圖比較稿。暖心生活 world tokens; the shop brand color replaces persimmon on the owner side. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--surface:#FFFFFF;--surface-2:#FBF6F0;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;
  --ink:#2B211C;--ink-muted:#6E6058;--border:#EADFD3;--control-border:#9A8878;--track:#E6D9CC;
  --success:#1E6B3A;--success-bg:#E3F4EA;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --frame-shadow:0 2px 6px rgb(0 0 0 / .25),0 30px 60px -24px rgb(0 0 0 / .55);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-brand="magenta"]{--brand:#C2386B;--on-brand:#FFFFFF;--brand-tint:#FBEAF0;--brand-ink:#A42D5A}
:root[data-brand="sage"]{--brand:#3D6B57;--on-brand:#FFFFFF;--brand-tint:#E6EFE6;--brand-ink:#33604D}
:root[data-brand="navy"]{--brand:#2F5597;--on-brand:#FFFFFF;--brand-tint:#E6ECF5;--brand-ink:#2A4D8A}
:root[data-brand="plum"]{--brand:#6E3B78;--on-brand:#FFFFFF;--brand-tint:#F1E6EF;--brand-ink:#63346C}
:root[data-theme="dark"]{
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
  --success:#8EDBA9;--success-bg:#173B26;
  --proto-bg:#0B0806;--proto-line:#33281F;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  color-scheme:dark;
}
:root[data-theme="dark"][data-brand="magenta"]{--brand:#F28CB1;--on-brand:#3A0A1E;--brand-tint:#3A2229;--brand-ink:#F6A9C5}
:root[data-theme="dark"][data-brand="sage"]{--brand:#93CBB0;--on-brand:#0E2A1F;--brand-tint:#20302A;--brand-ink:#A9D8C1}
:root[data-theme="dark"][data-brand="navy"]{--brand:#A3BCF0;--on-brand:#0F1F40;--brand-tint:#1F2737;--brand-ink:#B8CBF4}
:root[data-theme="dark"][data-brand="plum"]{--brand:#D6AADF;--on-brand:#2D1033;--brand-tint:#30212F;--brand-ink:#E0BEE7}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
    --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
    --success:#8EDBA9;--success-bg:#173B26;
    --proto-bg:#0B0806;--proto-line:#33281F;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-brand="magenta"]{--brand:#F28CB1;--on-brand:#3A0A1E;--brand-tint:#3A2229;--brand-ink:#F6A9C5}
  :root:not([data-theme="light"])[data-brand="sage"]{--brand:#93CBB0;--on-brand:#0E2A1F;--brand-tint:#20302A;--brand-ink:#A9D8C1}
  :root:not([data-theme="light"])[data-brand="navy"]{--brand:#A3BCF0;--on-brand:#0F1F40;--brand-tint:#1F2737;--brand-ink:#B8CBF4}
  :root:not([data-theme="light"])[data-brand="plum"]{--brand:#D6AADF;--on-brand:#2D1033;--brand-tint:#30212F;--brand-ink:#E0BEE7}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--proto-bg);color:var(--proto-ink);font-family:var(--font);font-feature-settings:"tnum";line-height:1.5;min-height:100vh}
::selection{background:var(--brand);color:var(--on-brand)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--proto-ink);outline-offset:3px;border-radius:8px}

/* ---- comparison chrome ---- */
.top{position:sticky;top:0;z-index:5;background:var(--proto-bg);border-bottom:1px solid var(--proto-line);padding:14px 16px}
.top .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.top h1{font-size:1.125rem;font-weight:900;margin-right:auto}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.ctl>span{font-size:.8125rem;font-weight:700;color:var(--proto-muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:rgb(255 255 255 / .06);padding:4px;border-radius:999px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;font-size:.875rem;font-weight:800;color:var(--proto-muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--proto-ink);color:var(--proto-bg)}
.sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .35)}
main{max-width:1240px;margin:0 auto;padding:28px 16px 64px}
.concept{margin-bottom:64px}
.concept>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
.concept h2{font-size:1.5rem;font-weight:900}
.concept h2 b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--proto-ink);color:var(--proto-bg);font-size:1rem;margin-right:10px;vertical-align:3px}
.concept .why{color:var(--proto-muted);font-size:.9375rem;font-weight:600;max-width:72ch;margin:0 0 18px 44px}
.concept .why em{font-style:normal;color:var(--proto-ink);font-weight:800}
.shots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 24px}
.shots figure:first-child{grid-column:1 / -1}
figure figcaption{font-size:.8125rem;font-weight:800;color:var(--proto-muted);margin-top:10px}
.fit{position:relative;width:100%;overflow:hidden;border-radius:22px;box-shadow:var(--frame-shadow)}
@media (max-width:820px){.shots{grid-template-columns:minmax(0,1fr)}.concept .why{margin-left:0}}

/* ---- tablet frame: 1180 × 820 landscape, scaled to fit ---- */
.tab{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;background:var(--bg);color:var(--ink);font-size:1rem;overflow:hidden;display:flex;flex-direction:column;pointer-events:none;user-select:none}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:900;font-size:1.25rem;flex:none}
.logo.l{width:72px;height:72px;border-radius:22px;font-size:2rem}
.store{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.0625rem}
.store small{display:block;font-size:.875rem;font-weight:700;color:var(--ink-muted)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 28px;border-radius:20px;background:var(--brand);color:var(--on-brand);font-size:1.1875rem;font-weight:900;box-shadow:var(--lift)}
.btn.w{width:400px}
.btn.full{width:100%}
.link{font-weight:800;font-size:.9375rem;color:var(--ink-muted);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;padding:10px}
.link.ink{color:var(--ink)}
.quiet{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--sunk);font-weight:800;font-size:.9375rem;color:var(--ink-muted)}
.quiet[aria-disabled="true"]{opacity:.55}

/* 臉環 for the signing session: N segments, done = ink, current = brand, ahead = track */
.face{--s:120px;position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;flex:none}
.face>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.face circle{fill:none;stroke:var(--track);stroke-width:6;stroke-linecap:round}
.face circle.done{stroke:var(--ink)}
.face circle.cur{stroke:var(--brand);stroke-width:8.5}
.face.closed circle{stroke:var(--brand);stroke-width:7}
.face img{width:calc(var(--s) * .76);height:calc(var(--s) * .76);border-radius:50%;object-fit:cover;background:var(--sunk)}
.face .ok{position:absolute;right:2%;bottom:2%;width:calc(var(--s) * .3);height:calc(var(--s) * .3);border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;border:4px solid var(--bg)}
.face .ok .ico{width:58%;height:58%;stroke-width:3}

/* signing bar */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px;padding:0 28px;background:var(--surface);box-shadow:0 1px 0 var(--border)}
.bar .mid{font-weight:900;font-size:1.125rem}
.bar .r{justify-self:end;display:flex;align-items:center;gap:12px;font-weight:900;color:var(--ink-muted)}
.bar .r .face{--s:48px}
.bar .r .face circle{stroke-width:9}
.bar .r .face circle.cur{stroke-width:12}
.back{display:inline-flex;align-items:center;gap:4px;min-height:52px;padding:0 18px 0 10px;border-radius:999px;font-weight:900;background:var(--sunk);justify-self:start}

/* signature step parts */
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:0 24px;background:var(--surface);border-radius:20px;padding:16px 24px;box-shadow:var(--lift)}
.facts dt{font-size:.8125rem;font-weight:800;color:var(--ink-muted)}
.facts dd{font-weight:900;font-size:1.0625rem}
.pad{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--lift);height:330px}
.pad .lbl{position:absolute;left:24px;top:18px;font-size:.875rem;font-weight:800;color:var(--ink-muted)}
.pad .line{position:absolute;left:56px;right:56px;bottom:84px;border-bottom:2px dashed var(--control-border)}
.pad .x{position:absolute;left:30px;bottom:76px;font-weight:900;color:var(--control-border);font-size:1.25rem}
.pad svg.ink{position:absolute;left:120px;bottom:70px;width:440px;height:170px;fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.under{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
h3.t{font-size:1.75rem;font-weight:900;line-height:1.3}

/* ===== A 臉環置中 ===== */
.A .hand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
.A .hand .store{position:absolute;top:32px;left:36px}
.A .hand .face{--s:236px;margin-bottom:22px}
.A .hand .pet{font-size:1.25rem;font-weight:900;color:var(--ink-muted);margin-bottom:6px}
.A .hand h3{font-size:2.75rem;font-weight:900;line-height:1.2;margin-bottom:40px;letter-spacing:-.01em}
.A .hand .link{position:absolute;bottom:26px}
.A .body{flex:1;padding:26px 0 0;display:flex;flex-direction:column}
.A .col{width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.A .foot{background:var(--surface);box-shadow:0 -1px 0 var(--border);padding:16px 0 18px;margin-top:auto}
.A .foot .btn{width:780px;margin:0 auto}
.A .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.A .done .face{--s:220px;margin-bottom:26px}
.A .done h3{font-size:2.5rem;font-weight:900;margin-bottom:8px}
.A .done p{font-size:1.25rem;font-weight:700;color:var(--ink-muted);margin-bottom:40px}

/* ===== B 名牌側欄 ===== */
.B{flex-direction:row}
.B .side{width:372px;flex:none;background:var(--brand-tint);padding:30px 30px 26px;display:flex;flex-direction:column}
.B .side .face{--s:150px;margin:34px 0 14px}
.B .side .nm{font-size:2rem;font-weight:900;line-height:1.2}
.B .side .ow{font-weight:800;color:var(--ink-muted);margin-bottom:20px}
.B .side dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:1rem}
.B .side dt{font-weight:800;color:var(--ink-muted)}
.B .side dd{font-weight:900}
.B .steps{list-style:none;margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:18px}
.B .steps li{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--ink-muted);min-height:38px}
.B .steps i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.875rem;font-weight:900;border:2px solid var(--control-border)}
.B .steps .done{color:var(--ink)}
.B .steps .done i{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.B .steps .done i .ico{width:16px;height:16px;stroke-width:3}
.B .steps .cur{color:var(--ink);font-weight:900}
.B .steps .cur i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.B .main{flex:1;display:flex;flex-direction:column;padding:30px 48px 30px}
.B .main.center{justify-content:center;align-items:flex-start}
.B .main.center h3{font-size:3rem;font-weight:900;line-height:1.2;margin-bottom:14px}
.B .main.center p{font-size:1.25rem;font-weight:700;color:var(--ink-muted);margin-bottom:40px}
.B .main .topr{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.B .main .topr .n{font-weight:900;color:var(--ink-muted)}
.B .main .pad{height:420px;margin-top:18px}
.B .main .btn.full{margin-top:auto}
.B .cancel{position:absolute;right:36px;bottom:24px}

/* ===== C 店家門牌 ===== */
.C .band{background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none}
.C .band.tall{height:300px;padding-bottom:70px;gap:10px}
.C .band.tall .logo.l{background:var(--on-brand);color:var(--brand)}
.C .band .sn{font-size:1.5rem;font-weight:900}
.C .band .sn small{font-size:1rem;font-weight:700;opacity:.85;margin-left:8px}
.C .band.tall .face{position:absolute;bottom:-96px;--s:192px}
.C .band.tall .face::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--bg)}
.C .band.tall .face svg,.C .band.tall .face img,.C .band.tall .face .ok{z-index:1}
.C .face circle.cur{stroke:var(--ink)}
.C .face circle.done{stroke:var(--ink)}
.C .face.closed circle{stroke:var(--brand)}
.C .face .ok{border-color:var(--bg)}
.C .lower{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:116px;text-align:center}
.C .lower h3{font-size:2.5rem;font-weight:900;line-height:1.2;margin-bottom:8px}
.C .lower .pet{font-size:1.125rem;font-weight:800;color:var(--ink-muted);margin-bottom:30px}
.C .lower p{font-size:1.25rem;font-weight:700;color:var(--ink-muted);margin-bottom:30px}
.C .lower .link{margin-top:auto;margin-bottom:22px}
.C .band.slim{height:72px;flex-direction:row;justify-content:space-between;padding:0 28px}
.C .band.slim .who{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.0625rem}
.C .band.slim .logo{background:var(--on-brand);color:var(--brand);width:40px;height:40px;border-radius:12px}
.C .band.slim .back{background:color-mix(in srgb,var(--on-brand) 16%,transparent);color:var(--on-brand)}
.C .stepper{display:flex;gap:8px;padding:16px 28px 0;width:100%}
.C .stepper li{list-style:none;flex:1;display:flex;flex-direction:column;gap:8px;font-size:.875rem;font-weight:800;color:var(--ink-muted)}
.C .stepper li::before{content:"";height:8px;border-radius:999px;background:var(--track)}
.C .stepper li.done::before{background:var(--ink)}
.C .stepper li.cur{color:var(--ink);font-weight:900}
.C .stepper li.cur::before{background:var(--brand)}
.C .stepper li span.n{color:var(--ink-muted);font-weight:800;margin-left:6px}
.C .body{flex:1;display:flex;flex-direction:column;padding:18px 0 0}
.C .col{width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.C .foot{padding:14px 0 20px;margin-top:auto}
.C .foot .btn{width:820px;margin:0 auto}

.note{margin-top:8px;color:var(--proto-muted);font-size:.875rem;font-weight:600;max-width:72ch}
.pick{margin-top:40px;border-top:1px solid var(--proto-line);padding-top:24px;color:var(--proto-muted);font-weight:600;font-size:.9375rem;max-width:72ch}
.pick b{color:var(--proto-ink)}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>平板簽署交接：三種構圖</h1>
  <div class="ctl"><span id="lb-brand">店家品牌色</span><div class="seg" role="group" aria-labelledby="lb-brand" id="brands">
    <button data-brand="magenta" aria-pressed="true"><i class="sw" style="background:#C2386B"></i>洋紅（現有）</button>
    <button data-brand="sage" aria-pressed="false"><i class="sw" style="background:#3D6B57"></i>鼠尾草綠</button>
    <button data-brand="navy" aria-pressed="false"><i class="sw" style="background:#2F5597"></i>海軍藍</button>
    <button data-brand="plum" aria-pressed="false"><i class="sw" style="background:#6E3B78"></i>梅紫</button>
  </div></div>
  <div class="ctl"><span id="lb-theme">主題</span><div class="seg" role="group" aria-labelledby="lb-theme" id="themes">
    <button data-theme="light" aria-pressed="true">淺色</button><button data-theme="dark" aria-pressed="false">深色</button>
  </div></div>
</div></div>

<main id="main"></main>

<script>
(() => {
const ic = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const CHECK = ic('<path d="m5 12.5 4.5 4.5L19 7.5"/>'), BACK = ic('<path d="m14 6-6 6 6 6"/>');
const PET = {name:'毛毛', breed:'貴賓', owner:'王太太', svc:'精緻美容・小型犬', time:'10/5（一）10:30', fee:'NT$1,200', img:'pets/maomao.webp'};
const STEPS = ['契約摘要', '毛孩資料確認', '手寫簽名', '簡訊驗證'];
// N-segment ring; cur = index of current step (-1 = not started, N = closed)
function ring(size, cur, extra = '') {
  const N = STEPS.length, gap = 14, len = 600 / N - gap;
  const closed = cur >= N;
  const segs = STEPS.map((_, i) => `<circle cx="50" cy="50" r="46" pathLength="600" class="${closed ? '' : i < cur ? 'done' : i === cur ? 'cur' : ''}" stroke-dasharray="${len} 600" stroke-dashoffset="${-(i * 600 / N + gap / 2)}"/>`).join('');
  return `<span class="face${closed ? ' closed' : ''} ${extra}" style="--s:${size}px"><svg viewBox="0 0 100 100" aria-hidden="true">${segs}</svg><img src="${PET.img}" alt="">${closed ? `<span class="ok">${CHECK}</span>` : ''}</span>`;
}
const store = `<div class="store"><span class="logo" aria-hidden="true">毛</span><div>毛孩日和<small>中山店</small></div></div>`;
const facts = `<dl class="facts"><div><dt>毛孩</dt><dd>${PET.name}・${PET.breed}</dd></div><div><dt>服務</dt><dd>${PET.svc}</dd></div><div><dt>時間</dt><dd class="num">${PET.time}</dd></div><div><dt>費用</dt><dd class="num">${PET.fee}</dd></div></dl>`;
const scribble = `<svg class="ink" viewBox="0 0 440 170" aria-hidden="true"><path d="M14 118c18-46 40-86 52-84 12 2-14 86-6 92 9 7 30-68 44-66 12 2-6 58 4 60 10 2 22-34 34-34 10 0 2 30 14 30 14 0 24-40 38-40 12 0 0 38 14 38 18 0 30-52 52-52 16 0 6 46 22 46 16 0 30-30 46-30"/><path d="M60 146c90-10 200-14 330-18"/></svg>`;
const pad = signed => `<div class="pad"><span class="lbl">簽名區，請用手指在框內簽名</span><span class="x">×</span><span class="line"></span>${signed ? scribble : ''}</div>`;
const under = `<div class="under"><span class="link ink">無法手寫簽名？改用其他方式簽署</span><span class="quiet">清除簽名</span></div>`;
const bar = (step, left) => `<div class="bar">${left}<div class="mid">${STEPS[step]}</div><div class="r"><span class="num">${step + 1} / ${STEPS.length}</span>${ring(48, step)}</div></div>`;

const A = {
  hand: `<div class="tab A"><div class="hand">${store}${ring(236, -1)}<div class="pet">${PET.name}・${PET.svc}</div><h3>請將平板交給飼主</h3><div class="btn w">開始</div><span class="link">取消，回到看板</span></div></div>`,
  sign: `<div class="tab A">${bar(2, `<span class="back">${BACK}上一步</span>`)}<div class="body"><div class="col"><h3 class="t">手寫簽名</h3>${facts}${pad(true)}${under}</div><div class="foot"><div class="btn">下一步：簡訊驗證</div></div></div></div>`,
  done: `<div class="tab A">${bar(3, store).replace(/<div class="mid">.*?<\/div><div class="r">.*?<\/div><\/div>$/, '<div></div><div></div></div>')}<div class="done">${ring(220, 4)}<h3>簽署完成</h3><p>正本會傳到你的 LINE</p><div class="btn w">交還店員</div></div></div>`
};
const sideSteps = cur => `<ol class="steps">${STEPS.map((s, i) => `<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"><i>${i < cur ? CHECK : i + 1}</i>${s}</li>`).join('')}</ol>`;
const side = cur => `<aside class="side">${store}${ring(150, cur)}<div class="nm">${PET.name}</div><div class="ow">${PET.breed}・${PET.owner}</div><dl><dt>服務</dt><dd>${PET.svc}</dd><dt>時間</dt><dd class="num">${PET.time}</dd><dt>費用</dt><dd class="num">${PET.fee}</dd></dl>${sideSteps(cur)}</aside>`;
const B = {
  hand: `<div class="tab B">${side(-1)}<div class="main center"><h3>請將平板交給飼主</h3><p>${PET.owner}，接下來請確認${PET.name}的資料並簽名。</p><div class="btn w">開始</div><span class="link cancel">取消，回到看板</span></div></div>`,
  sign: `<div class="tab B">${side(2)}<div class="main"><div class="topr"><span class="back">${BACK}上一步</span><span class="n num">3 / 4</span></div><h3 class="t">手寫簽名</h3>${pad(true)}${under}<div class="btn full">下一步：簡訊驗證</div></div></div>`,
  done: `<div class="tab B">${side(4)}<div class="main center"><h3>簽署完成</h3><p>正本會傳到你的 LINE</p><div class="btn w">交還店員</div></div></div>`
};
const tallBand = cur => `<div class="band tall"><span class="logo l" aria-hidden="true">毛</span><div class="sn">毛孩日和<small>中山店</small></div>${ring(192, cur)}</div>`;
const stepper = cur => `<ol class="stepper">${STEPS.map((s, i) => `<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span>${s}${i === cur ? `<span class="n num">${i + 1} / ${STEPS.length}</span>` : ''}</span></li>`).join('')}</ol>`;
const C = {
  hand: `<div class="tab C">${tallBand(-1)}<div class="lower"><h3>請將平板交給飼主</h3><div class="pet">${PET.name}・${PET.svc}</div><div class="btn w">開始</div><span class="link">取消，回到看板</span></div></div>`,
  sign: `<div class="tab C"><div class="band slim"><span class="back">${BACK}上一步</span><div class="who"><span class="logo" aria-hidden="true">毛</span>毛孩日和・中山店</div></div>${stepper(2)}<div class="body"><div class="col"><h3 class="t">手寫簽名</h3>${facts}${pad(true)}${under}</div><div class="foot"><div class="btn">下一步：簡訊驗證</div></div></div></div>`,
  done: `<div class="tab C">${tallBand(4)}<div class="lower"><h3>簽署完成</h3><p>正本會傳到你的 LINE</p><div class="btn w">交還店員</div></div></div>`
};

const CONCEPTS = [
  {k:'A', t:'臉環置中', s:A, why:'延續看板的<em>臉環</em>：交接時畫面中央是毛毛的大臉，外圈分成 4 段，簽一步亮一段，右上角縮小成進度。整體最安靜、最接近看板，店家色只出現在 Logo 和主按鈕。'},
  {k:'B', t:'名牌側欄', s:B, why:'左側一張<em>常駐名牌</em>：毛孩、服務、時間、費用和步驟清單一直都在，飼主隨時知道自己簽的是什麼、還剩幾步。右側只放這一步的事，簽名區可以更高。店家色淡淡鋪滿側欄。<br>注意：摘要改放側欄，會偏離規格「簽名區上方摘要四欄」。'},
  {k:'C', t:'店家門牌', s:C, why:'<em>店家品牌最強</em>：交接和完成頁上方是整片品牌色門牌，毛毛的臉環壓在門牌邊緣；簽署中收成細條，下方是 4 段進度條。最像「這家店的畫面」，各店之間的差異也最大。'}
];
const SHOTS = [['hand', '交接畫面：店員遞出平板'], ['sign', '手寫簽名（已讀快速簽 3 / 4，已簽）'], ['done', '簽署完成：交還店員']];
document.getElementById('main').innerHTML = CONCEPTS.map(c => `<section class="concept" aria-labelledby="c-${c.k}"><header><h2 id="c-${c.k}"><b>${c.k}</b>${c.t}</h2></header><p class="why">${c.why}</p>
  <div class="shots">${SHOTS.map(([key, cap]) => `<figure><div class="fit" role="img" aria-label="方案 ${c.k}：${cap}">${c.s[key]}</div><figcaption>${cap}</figcaption></figure>`).join('')}</div></section>`).join('')
  + `<p class="pick">請告訴我要用 <b>A、B 或 C</b>（也可以混搭，例如「A 的交接畫面＋B 的側欄」），以及要用哪個<b>品牌色</b>。洋紅在深色主題下和危險紅最接近，照推導規則 6 焦點框要改成可可墨色。</p>`;

function fit() {
  document.querySelectorAll('.fit').forEach(f => {
    const k = f.clientWidth / 1180; f.style.height = 820 * k + 'px';
    f.firstElementChild.style.transform = `scale(${k})`;
  });
}
new ResizeObserver(fit).observe(document.body); fit();

const root = document.documentElement;
const press = (wrap, attr) => wrap.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  root.dataset[attr] = b.dataset[attr];
  wrap.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
press(document.getElementById('brands'), 'brand');
press(document.getElementById('themes'), 'theme');
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.querySelector(`#themes [data-theme="${theme}"]`)?.click();
if (q.get('brand')) document.querySelector(`#brands [data-brand="${q.get('brand')}"]`)?.click();
})();
</script>
</body>
</html>
