<script>
(() => {
/* 毛毛的一天 (prototypes/life): ?life=<act> moves the board to 毛毛's arrival day, 10/12（一）, at the moment of that act. Every other booking keeps
   its place in the day, shifted four hours later so the board looks just as busy at 14:00 as the 10/5 board does at 09:55. Without ?life= nothing changes. */
const LIFE = (v => ['arrive', 'service', 'finish', 'record', 'pay'].includes(v) ? v : null)(new URLSearchParams(location.search).get('life'));
/* 阿福的過敏 (prototypes/allergy): ?life=afu-checkin moves the board to 10/9（五）10:55, the day of 阿福's 11:00 精緻美容 on 美容台 A・阿哲
   in M-02, five minutes before he arrives. Every other booking keeps its place in the day, an hour later and four days on (a date's weekday
   follows it), so the board looks just as busy at 10:55 as the 10/5 board does at 09:55; 毛毛 is not on this day (M-02 has her on 10/10).
   阿福's allergy reads 雞肉、牛肉, as 陳老闆 changed it at 09:40 in M-03. Without ?life= nothing changes. */
const AFU = new URLSearchParams(location.search).get('life') === 'afu-checkin' ? 'afu-checkin' : null;
/* 毛毛住兩晚 (prototypes/stay): ?life=stay-in / stay-care / stay-out move the board to the three days of 毛毛's stay in 狗房 4 (M-06,
   10/20（二）12:00 → 10/22（四）12:00, 2 晚 × NT$800, booked by 王太太 in LINE on 10/9). stay-in is 10/20 12:02, a minute after she signed
   the 住宿同意書 on the tablet; stay-care is 10/21（三）09:10, the shop's 公休, when only the stays that run through it are on the board;
   stay-out is 10/22 12:55, 55 minutes past 退房, so 開始退房 adds one hour of the 逾時照護費 (寬限 30 分, NT$100 an hour, M-04 / 住宿同意書
   第二條; 豆皮's own overdue 退房 is left off that day). Every other booking keeps its place in the day, two or three hours later and DOFF days
   on (a later date with its weekday, like 布丁's request, moves three weeks and keeps its weekday, so it never lands on a 公休); the stays'
   day numbers stay as they are and only their labels move (stD / stLbl). Without ?life= nothing changes. */
const STAYL = (v => ['stay-in', 'stay-care', 'stay-out'].includes(v) ? v : null)(new URLSearchParams(location.search).get('life'));
/* 郭太太的刪除申請 (prototypes/erase): ?life=del-walkin is 11/9（一）09:55, a month after 林店長 approved her 刪除申請 on 10/9. The board is
   the 10/5 board moved 35 days (same weekday, same times) without 糖糖's 08:30 visit, and her phone 0920334126 looks up as deleted: the
   walk-in has to make her a new customer. Handing the tablet over for the contract (現場簽名) posts 'sign'. */
const DELW = new URLSearchParams(location.search).get('life') === 'del-walkin' ? 'del-walkin' : null;
/* 毛孩日和被停權到恢復 (prototypes/suspend): ?life=sus-board is 11/17（二）09:55, the morning after 寵派 suspended 毛孩日和 (11/16 10:12, its
   11 月月費 unpaid). The board is the 10/5 board moved 43 days (a dated weekday moves seven weeks and keeps it) and runs as ?suspended=1:
   every 新增現場預約 is blocked with the reason, while the day's bookings, 報到, 收款 and 住宿退房 go on. 阿福's 報到 posts 'checkin'. */
const SUSB = new URLSearchParams(location.search).get('life') === 'sus-board' ? 'sus-board' : null;
/* 阿楷離職那天 (prototypes/last-day): ?life=qt-finish is 10/9（五）11:12, 阿楷's last day, on the counter tablet he is signed in to. 美容台 C
   follows M-02 that day (user decision 2026-10-16): 湯圓 10:30 基礎洗澡 (in service since 10:32, his last booking), 12:30 麻糬 and 15:00 皮皮;
   阿福 is in service on 美容台 A as in M-02 and 毛毛 is not on the day. Every other booking keeps its place, an hour later and four days on
   (DOFF 4). 阿楷 finishing 湯圓 posts 'finish'. ?life=qt-next is 10/10（六）09:55, the next morning, after 陳老闆 stopped 阿楷 and handed
   美容台 C to 小葵: the board is M-02's 10/10 at 中山店 (every booking still to come, 毛毛 with her request to 10/12, 可可 and 奶油 staying),
   美容台 C labelled 小葵, who keeps 美容台 B too. 豆奶's 報到 posts 'checkin-c'. */
const QUIT = (v => ['qt-finish', 'qt-next'].includes(v) ? v : null)(new URLSearchParams(location.search).get('life'));
/* 貓咪剃毛上架 (prototypes/new-service): ?life=sv-first is 10/17（六）15:40, the day of 年糕's first 貓咪剃毛 (王太太 booked it in LINE on
   10/9 at 21:00, the evening 陳老闆 turned the service on in M-04). 年糕 has been in service on 美容台 A・阿哲 since 14:04, wearing her 頭套
   (M-03's 需戴頭套). The board is the 10/5 board moved 12 days (a dated weekday moves two weeks and keeps it), every time four hours later
   as in 毛毛的一天, without 毛毛 (年糕 takes her 14:00 on 美容台 A) and 樂樂 (M-06 has 樂樂 on 美容台 C at 14:00 that day). Finishing 年糕 posts 'finish'. */
const SVB = new URLSearchParams(location.search).get('life') === 'sv-first' ? 'sv-first' : null;
/* 簡訊用量快爆了 (prototypes/sms-quota): ?life=sms-call is the 10/5 board itself at 11:18. At 11:05 陳老闆 set 可接回 to 只送 LINE in 通知設定
   to save 簡訊. 豆豆's owner 黃先生 has no LINE (his reminder SMS failed this morning, so he came 32 minutes late and 豆豆 has been in service
   on 美容台 B・小葵 since 10:06); 阿福 waits for that table. The morning has moved on to match: 豆皮 checked out, 小黑 and Lucky have left,
   小米 and 毛毛 are in service. Finishing 豆豆 says 可接回 still goes to him by 簡訊: it is tied to the 逾時照護 fee, so it falls back to SMS whatever the channel setting (decided 2026-10-18); it posts 'finish'. */
const SMSB = new URLSearchParams(location.search).get('life') === 'sms-call' ? 'sms-call' : null;
const DOFF = STAYL ? {'stay-in':15, 'stay-care':16, 'stay-out':17}[STAYL] : DELW ? 35 : SUSB ? 43 : QUIT ? {'qt-finish':4, 'qt-next':5}[QUIT] : SVB ? 12 : 0;
const lifeSay = k => { const act = LIFE || AFU || STAYL || DELW || SUSB || QUIT || SVB || SMSB; if (act && parent !== window) try { parent.postMessage({pp:'life', act, done:k}, location.origin); } catch (e) { /* opened on its own */ } };
const NOW0 = LIFE ? {arrive:'13:55', service:'14:01', finish:'15:34', record:'15:41', pay:'15:47'}[LIFE] : AFU ? '10:55' : QUIT === 'qt-finish' ? '11:12' : STAYL ? {'stay-in':'12:02', 'stay-care':'09:10', 'stay-out':'12:55'}[STAYL] : SVB ? '15:40' : SMSB ? '11:18' : '09:55';
let NOW = NOW0;
const GRACE = 10;                                       /* minutes past start before a booking counts as 逾時未到 */
const TODAY = LIFE ? '10/12（一）' : AFU ? '10/9（五）' : STAYL ? {'stay-in':'10/20（二）', 'stay-care':'10/21（三）', 'stay-out':'10/22（四）'}[STAYL] : DELW ? '11/9（一）' : SUSB ? '11/17（二）' : QUIT ? {'qt-finish':'10/9（五）', 'qt-next':'10/10（六）'}[QUIT] : SVB ? '10/17（六）' : '10/5（一）';
const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const advance = () => { NOW = hm(mins(NOW) + 1); };
const late = a => a.overdue ? mins(NOW) - mins(a.overdue.due) : 0;
const I = {
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z"/>',

  userF:'<circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5Z" fill="currentColor"/>',
  walkF:'<circle cx="12" cy="12" r="8" fill="currentColor"/><path d="M12 8v8M8 12h8" style="stroke:var(--cut)"/>',
  camoff:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3l18 18"/>',

};
const ic = (n, c='') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const fmt = n => n.toLocaleString('en-US');
const nt = n => `NT$${fmt(n)}`;
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };

  slot(el) {

    s.res = free.find(r => tableOf(r) === tableOf(a.res)) ?? null;
    focusAfter = el.dataset.key; render();
    say(`${hm(s.t)} 到 ${hm(s.t + rsDur(a))}，${s.res ? `原本的${s.res}有空，已選好，也可以換一張` : `${free.length} 張美容台有空，請選一張`}`);
  },
  res(el) { const s = state.rs; s.res = WK_TABLES[+el.dataset.v]; focusAfter = el.dataset.key; render(); say(`已選${s.res}`); },
  cell(el) {
    const s = state.rs, a = byId(state.view.id); s.t = +el.dataset.v; s.res = WK_TABLES[+el.dataset.r]; s.taken = null;
    focusAfter = el.dataset.key; render(); say(`已選${s.res}，${hm(s.t)} 到 ${hm(s.t + rsDur(a))}`);
  },
  who(el) { const s = state.rs, a = byId(state.view.id); s.who = el.dataset.v; focusAfter = el.dataset.key; render(); const f = rsFee(a); say(`${f.label}新台幣 ${fmt(f.amt)} 元，${f.why}`); },
  tryGo() {
    const a = byId(state.view.id), bl = rsBlockers(a); state.rs.tried = true; render();

  go() {

    const rev = rsReview(a), d = rsDur(a), fee = rsFee(a), when = rsWhen(s.day, s.t), moved = s.day !== 0;
    const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
    const extra = `<dl class="cdl dlg-cdl">${row('原本', `<span class="num">今天 ${a.start}${a.t2}</span>・${esc(a.res.split('・')[0])}`)}${row('改成', `<span class="num">${when}–${hm(s.t + d)}</span>・${esc(s.res.split('・')[0])}`)}
      ${row(fee.label, `${money(fee.amt)}<small class="why">${esc(fee.why)}</small>`)}${row('契約', moved || a.contract !== 'signed' ? (a.contract === 'signed' ? '舊約作廢，飼主要重簽' : '傳新日期的契約，到店簽') : '沿用')}</dl>`;
    state.confirm = rev
      ? {title:'改期後原時段將釋放，是否送出改期申請？', body:`店長核准後才會釋放原時段、通知${a.owner}。${moved ? '日期變更，核准後飼主要重新簽署契約。' : ''}`, yes:'送出申請', no:'返回修改'}

    Object.assign(state.confirm, {extra, slow:true, nav:true, ret:'rs-go', run: () => RS.commit(rev)});

  commit(rev) {

    if (state.rsResp === 'conflict') {

      state.rsResp = 'ok'; $('p-rsresp').value = 'ok';
      RS_TAKEN.push({i:s.day, res:s.res, from:hm(s.t), to:hm(s.t + d), why:'剛被訂走'});
      s.taken = `${rsWhen(s.day, s.t)} ${s.res.split('・')[0]}`; s.t = null; s.res = null;

    }

  }
};

/* ---------- S-03 取消 / No-show: the reason, what is released and what it costs are on screen before anything is written ---------- */

/* the table's day as a two-lane strip: this booking on top, the table's other holds below, so an overlap never hides either.

function rlStrip(a, from, to, hs, name = h => h.why, hit = () => false) {
  const lo = Math.floor(Math.min(RS_OPEN, from, ...hs.map(h => mins(h.from))) / 60) * 60, n = (RS_CLOSE - lo) / RS_STEP, now = mins(NOW);
  const col = t => (Math.max(lo, Math.min(RS_CLOSE, t)) - lo) / RS_STEP + 1;
  const blk = (f, t, txt, row, cls = '') => col(t) > col(f) ? `<span class="rl-blk${cls}" style="grid-column:${col(f)} / ${col(t)};grid-row:${row}">${esc(txt)}</span>` : '';
  const hrs = []; for (let h = lo / 60; h < RS_CLOSE / 60; h++) if (h % 2 === 0 || h === lo / 60) hrs.push(h);
  return `<div class="rl" style="grid-template-columns:repeat(${n},minmax(0,1fr))" aria-hidden="true">${hrs.map(h => `<span class="rl-h" style="grid-column:${col(h * 60)} / span 2">${h}</span>`).join('')}<span class="rl-track"></span>
    ${now > lo ? `<span class="rl-past" style="grid-column:1 / ${Math.min(n + 1, Math.floor((now - lo) / RS_STEP) + 1)}"></span>` : ''}${blk(from, to, a.pet, 2, ' me')}${hs.map(h => blk(mins(h.from), mins(h.to), name(h), 3, hit(h) ? ' hit' : '')).join('')}</div>`;
}
/* what is given back: the table's day with this booking as the dashed block, plus the notices and contract that stop with it */
function cxFreeHtml(a) {
  const s = state.cx, g = a.cat === 'grooming', after = cxAfter(a, s);

    /* the free run this release opens: walk out from the first freed half hour until another hold or closing */
    const busyAt = t => t < Math.max(RS_OPEN, Math.ceil(now / RS_STEP) * RS_STEP) || hs.some(h => mins(h.from) <= t && t < mins(h.to));

  }

  return `<section class="panel cx-free" aria-labelledby="h-cxf"><div class="panel-h"><h2 id="h-cxf">會釋放的時段</h2><span class="hint">${after}就能給別的預約</span></div>

    <dl class="dl cx-dl"><dt>${g ? '美容台' : '房間'}</dt><dd>${esc(a.res)}</dd><dt>時段</dt><dd>${cxWhen(a)}</dd>${gap ? `<dt>空出來</dt><dd>${gap}</dd>` : ''}</dl>

function cxSumHtml(a) {
  const s = state.cx, ns = s.kind === 'noshow', rev = s.mode === 'review', ask = cxAsk(a, s), fee = cxFee(a, s), after = cxAfter(a, s);

  const tile = `<div class="mv old cx-tile"><span class="k">${ns ? '未到' : '取消'}</span><b class="num">${cxWhen(a)}</b><small>${esc(a.res)}・${after}釋放</small></div>`;
  const rows = `<div class="rs-sec"><h3 id="cx-fee-h">費用</h3><div class="rows" role="group" aria-labelledby="cx-fee-h">
    <div class="row"><span><span class="k">${esc(a.svc)}</span><small class="why">原價 ${nt(cxBase(a))}，${ns ? '沒到店' : '取消'}不收服務費</small></span>${money(0)}</div>
    <div class="row"><span><span class="k">${fee ? fee.label : '取消費'}</span><small class="why">${fee ? esc(fee.why) : '選了是誰提出，才算得出來'}</small></span>${fee ? money(fee.amt) : '<span class="mnote">—</span>'}</div>
    ${a.paid ? `<div class="row"><span><span class="k">${paidLbl(a)}</span><small class="why">${dep ? `${dep.m}・${dep.t}` : ''}</small></span>${money(-a.paid)}</div>` : ''}

/* ---------- overflow menu ---------- */
function openMenu(id, trigger) {
  const r = trigger.getBoundingClientRect(), w = 220, items = overflowOf(byId(id)).length;
  const hgt = items * 45 + 10;
  let top = r.bottom + 6; if (top + hgt > innerHeight - 8) top = Math.max(8, r.top - hgt - 6);
  state.menu = {id, key: trigger.dataset.key, top, y: scrollY, left: Math.max(8, Math.min(r.right - w, innerWidth - w - 8))};
  trigger.setAttribute('aria-expanded', 'true');
  renderLayer();
  placeMenu(trigger);
  document.querySelector('#menu [data-mi="0"]')?.focus();
}
function placeMenu(trigger) {
  const m = document.getElementById('menu'); if (!m) return;
  const r = trigger.getBoundingClientRect(), h = m.offsetHeight, left = state.menu.left, right = left + m.offsetWidth;
  const btns = [...document.querySelectorAll('.c-act .btn, .c-act .more, .n-act .btn, .n-act .more, .nc-act .btn, .nc-act .more')].filter(b => b !== trigger).map(b => b.getBoundingClientRect()).filter(b => b.right > left && b.left < right);
  const cuts = (top, bottom) => btns.some(b => (b.top < bottom && b.bottom > bottom) || (b.top < top && b.bottom > top));
  const below = r.bottom + 6, above = r.top - 6 - h;
  let top = below, pad = 0;
  if (cuts(below, below + h) || below + h > innerHeight - 8) {

    else { const hit = btns.find(b => b.top < below + h && b.bottom > below + h); if (hit) pad = hit.bottom + 6 - (below + h); }

  if (!state.menu) return;

  const t = document.querySelector(`[data-key="${key}"]`);

}
