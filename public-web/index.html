<style>
/* 暖心生活 App world, owner side (公開網頁 W-01). Status colors are the fixed set shared by every surface and shop; the shop brand slot replaces persimmon. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;--track:#E6D9CC;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --owner-surface:#FFFFFF;--owner-ink:#2B211C;--owner-ink-muted:#6E6058;--owner-border:#EADFD3;--owner-control-border:#9A8878;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --lift-up:0 -12px 28px -16px rgb(74 44 26 / .35);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --protoh:52px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--sunk:#30261F;--sunk-hover:#3B2F27;--track:#46382F;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --owner-surface:#211915;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--sunk:#30261F;--sunk-hover:#3B2F27;--track:#46382F;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --owner-surface:#211915;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
html{--fs:1}
html.fs13{font-size:130%;--fs:1.2}
html.fs20{font-size:200%;--fs:1.5}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--protoh) + 16px)}
html:not(.wide){scroll-padding-bottom:calc(120px + 40px * var(--fs))}
body{font-family:var(--font);background:var(--bg);color:var(--owner-ink);font-size:1rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit}
ul,ol{list-style:none}
::selection{background:var(--brand-tint);color:var(--owner-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--owner-control-border) transparent}
:focus-visible{outline:3px solid var(--owner-ink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--owner-ink-muted)}
.nw{white-space:nowrap}
p,.desc,.sub{text-wrap:pretty}
.yen{font-size:.72em;font-weight:800;margin-right:.08em}

/* ---------- prototype chrome: inverted against the theme so it never reads as product UI ---------- */
.proto{position:fixed;inset:0 0 auto 0;z-index:50;min-height:var(--protoh);background:var(--proto-bg);color:var(--proto-ink);display:flex;align-items:center;gap:6px 14px;padding:6px 14px;overflow-x:auto;white-space:nowrap;font-size:13px;font-weight:700;border-bottom:1.5px dashed var(--proto-muted);scrollbar-width:none}
.proto::-webkit-scrollbar{display:none}
@media (min-width:1200px){.proto{flex-wrap:wrap;white-space:normal;overflow:visible}.proto label,.proto .note{white-space:nowrap}}
.proto .tag{flex:none;border:1.5px dashed var(--proto-muted);border-radius:999px;padding:2px 9px;color:var(--proto-muted);font-weight:800}
.proto label{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--proto-muted)}
.proto select,.proto .pbtn{height:36px;border-radius:10px;border:1.5px solid var(--proto-line);background:transparent;color:var(--proto-ink);padding:0 8px;font-weight:700;font-size:13px}
.proto select option{background:var(--proto-bg);color:var(--proto-ink)}
.proto .pbtn{display:inline-flex;align-items:center;gap:4px;flex:none;text-decoration:none}
.proto input[type="checkbox"]{width:18px;height:18px;accent-color:var(--proto-ink)}
.proto .sep{flex:none;width:1px;height:24px;background:var(--proto-line)}
.proto :focus-visible{outline-color:var(--proto-ink)}
.proto .ico{width:16px;height:16px}

/* ---------- page frame ---------- */
.site{padding-top:var(--protoh);min-height:100dvh}
html.pframe .site,html.pframe .dock{max-width:390px;margin-inline:auto}
html.pframe .site{box-shadow:0 0 0 1px var(--owner-border);background:var(--bg)}
html.pframe body{background:var(--sunk)}
.wrap{padding:20px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.wrap.enter{animation:rise .32s var(--out) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
html.wide .wrap{max-width:1180px;margin:0 auto;padding:40px 40px 56px;grid-template-columns:minmax(0,1fr) minmax(360px,404px);grid-template-areas:"hdr slip" "svcs slip" "info slip" "pw slip";column-gap:clamp(32px,4vw,56px);row-gap:36px;align-items:start}
html.wide .a-hdr{grid-area:hdr}
html.wide .a-svcs{grid-area:svcs}
html.wide .a-info{grid-area:info}
html.wide .a-pw{grid-area:pw}
html.wide .a-quick{display:none}
html.wide .slip{grid-area:slip}

/* ---------- store header ---------- */
.hdr{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.logo{width:4rem;height:4rem;border-radius:16px;flex:none;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:1.75rem;font-weight:900;box-shadow:var(--lift);line-height:1}
.hdr .nm{min-width:0}
.hdr h1{font-size:1.5rem;font-weight:900;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.hdr .br{font-size:1rem;font-weight:800;color:var(--owner-ink-muted);margin-top:2px}
.state{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:.9375rem;font-weight:800;margin-top:8px}
.state .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.state .on{display:inline-flex;align-items:center;gap:8px;color:var(--success)}
.state .off{display:inline-flex;align-items:center;gap:8px;color:var(--neutral)}
.state .sus{display:inline-flex;align-items:center;gap:6px;color:var(--warning);background:var(--warning-bg);border-radius:999px;padding:3px 12px 3px 10px;font-size:.875rem}
.state .sus .ico{width:16px;height:16px}
.state .then{color:var(--owner-ink-muted);font-weight:700}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
html.wide .hdr{grid-template-columns:auto 1fr;column-gap:22px}
html.wide .logo{width:5.5rem;height:5.5rem;border-radius:20px;font-size:2.5rem;grid-row:span 2}
html.wide .hdr h1{font-size:2rem;line-height:1.2}
html.wide .hdr .br{font-size:1.0625rem}
html.wide .state,html.wide .acts{grid-column:2}
html.wide .state{margin-top:2px}

/* ---------- buttons, links ---------- */
.btn{min-height:48px;padding:11px 18px;border-radius:14px;font-weight:800;font-size:.9375rem;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;text-align:center;text-decoration:none;transition:transform .35s var(--spring),background .2s,border-color .2s,filter .2s}
.btn:active{transform:scale(.97);transition-duration:.08s}
.btn.pri{width:100%;min-height:56px;border-radius:16px;font-size:1.0625rem;background:var(--brand);color:var(--on-brand);box-shadow:var(--lift)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--sunk);color:var(--owner-ink)}
.btn.sec:hover{background:var(--sunk-hover)}
.btn.quiet{background:var(--owner-surface);border-color:var(--owner-control-border);color:var(--owner-ink);min-height:44px;padding:8px 14px}
.btn.quiet:hover{border-color:var(--owner-ink)}
.btn .ico{width:18px;height:18px}
.btn[aria-disabled="true"]{background:transparent;border:1.5px dashed var(--owner-control-border);color:var(--owner-ink-muted);box-shadow:none;cursor:not-allowed;filter:none}
.btn[aria-disabled="true"]:active{transform:none}
.btn.busy{pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* LINE Login button: LINE's own spec, fixed colors in both themes, official icon (vendor/line/SOURCES.md) */
.linebtn{position:relative;width:100%;min-height:56px;display:grid;grid-template-columns:56px 1px 1fr;align-items:center;background:#06C755;color:#FFFFFF;border-radius:12px;overflow:hidden;font-weight:800;font-size:1.0625rem;text-align:center;animation:linein .45s var(--out) both}
.linebtn img{width:56px;height:56px;display:block}
.linebtn .sep{align-self:stretch;background:rgb(0 0 0 / .08)}
.linebtn .lbl{padding:0 12px 0 8px;line-height:1.3}
.linebtn::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.linebtn:hover::after{opacity:.1}
.linebtn:active::after{opacity:.3}
.linebtn.busy{pointer-events:none}
.linebtn.busy::after{opacity:.1}
.linebtn.busy .lbl{display:inline-flex;align-items:center;justify-content:center;gap:8px}
@keyframes linein{from{clip-path:inset(0 100% 0 0 round 12px)}to{clip-path:inset(0 0 0 0 round 12px)}}
.tlink{min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px;color:var(--brand-ink);font-weight:800;font-size:.9375rem;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;border-radius:10px}

/* ---------- sections ---------- */
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
h2.sec{font-size:1.25rem;font-weight:900;line-height:1.3;display:flex;align-items:center;gap:8px}
.cnt-pill{min-width:26px;height:26px;border-radius:999px;background:var(--sunk);font-size:.8125rem;font-weight:800;display:inline-grid;place-items:center;padding:0 9px}
.sechd .sub{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
h3.grp{font-size:.9375rem;font-weight:900;color:var(--owner-ink-muted);margin:20px 0 10px}
h3.grp:first-of-type{margin-top:0}
.card{background:var(--owner-surface);border-radius:16px;box-shadow:var(--lift);padding:16px}

/* ---------- 最近空檔 (phone, before services; inside the slip on desktop) ---------- */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.5rem),1fr));gap:8px}
.qd{min-height:72px;border-radius:16px;background:var(--owner-surface);box-shadow:var(--lift);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.25;transition:transform .35s var(--spring),background .2s}
.qd b{font-size:1rem;font-weight:900}
.qd span{font-size:.8125rem;font-weight:700;color:var(--success)}
.qd:active{transform:scale(.96);transition-duration:.08s}
.qd[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.qd[aria-pressed="true"] span{color:var(--on-brand)}
.qempty{font-size:.9375rem;font-weight:700;color:var(--owner-ink-muted)}
html.fs20 .quick{grid-template-columns:1fr}
.slip .quick{grid-template-columns:repeat(3,minmax(0,1fr))}
.slip .qd{min-height:60px;box-shadow:inset 0 0 0 1.5px var(--owner-border);padding:8px 10px}
.slip .qd:hover:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.slip .qd[aria-pressed="true"]{box-shadow:none}
.qlbl{font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted);margin:2px 0 8px}

/* ---------- service options ---------- */
.svcs{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:start;background:var(--owner-surface);border-radius:16px;padding:16px;box-shadow:inset 0 0 0 1.5px var(--owner-border);cursor:pointer;transition:background .2s,box-shadow .2s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{grid-row:1/3;width:26px;height:26px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--owner-control-border);display:grid;place-items:center;color:transparent;transition:background .2s,box-shadow .2s}
.opt .mk .ico{width:16px;height:16px;stroke-width:3}
.opt .t{font-weight:900;font-size:1.0625rem;line-height:1.35;min-width:0}
.opt .p{font-weight:900;font-size:1.1875rem;line-height:1.3;text-align:right;white-space:nowrap}
.opt .meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.opt .meta .m{display:inline-flex;align-items:center;gap:5px}
.opt .meta .ico{width:16px;height:16px}
.opt .d{grid-column:2/-1;font-size:.875rem;font-weight:600;color:var(--owner-ink-muted)}
.opt .ct{grid-column:2/-1;display:none;margin-top:8px;gap:8px;align-items:flex-start;background:var(--brand-tint);color:var(--brand-ink);border-radius:14px;padding:9px 12px;font-size:.875rem;font-weight:800;line-height:1.45}
.opt .ct .ico{width:18px;height:18px;margin-top:1px}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.opt:has(input:checked){background:var(--brand-tint);box-shadow:inset 0 0 0 2px var(--brand)}
.opt:has(input:checked) .mk{background:var(--brand);box-shadow:none;color:var(--on-brand)}
.opt:has(input:checked) .ct{display:flex;background:var(--owner-surface)}
.opt:has(input:focus-visible){outline:3px solid var(--owner-ink);outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.8125rem;font-weight:800;line-height:1.4;white-space:nowrap;border:1.5px solid var(--owner-control-border);color:var(--owner-ink-muted)}
.chip .ico{width:14px;height:14px}
html.fs20 .opt{grid-template-columns:auto 1fr}
html.fs20 .opt .p{grid-column:2;text-align:left}

/* ---------- 店家資訊 ---------- */
.shopinfo{display:grid;gap:18px}
html.wide .shopinfo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px}
.irow{display:grid;grid-template-columns:22px 1fr;gap:2px 12px;align-items:start}
.irow .ico{margin-top:2px;color:var(--owner-ink-muted)}
.irow .k{font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted)}
.irow .v{grid-column:2;font-weight:700;overflow-wrap:anywhere}
.irow .v .tlink{margin-left:-4px}
html.wide .irow.hrs{grid-column:2;grid-row:1/3}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-weight:700;font-size:.9375rem}
.hours .tdy{font-weight:900;color:var(--owner-ink)}
.hours dt.tdy::after{content:"今天";margin-left:8px;font-size:.75rem;font-weight:800;background:var(--sunk);border-radius:999px;padding:1px 7px;vertical-align:1px}
.hours .cl{color:var(--owner-ink-muted)}
.pw{text-align:center;font-size:.75rem;font-weight:700;color:var(--owner-ink-muted);padding-top:4px}
html.wide .pw{text-align:left}

/* ---------- 預約單 (the slip): sticky right column on desktop, sections in the flow on phone ---------- */
.slip{display:flex;flex-direction:column;gap:28px}
.slip .sl-top,.slip .sl-svc,.slip .sl-foot{display:none}
.sl-body{display:flex;flex-direction:column;gap:28px}
.srow{display:grid;grid-template-columns:28px 1fr;gap:0 12px;align-items:start}
.srow>.bd{grid-column:1/-1;margin-top:12px;min-width:0}
.ck{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--track);display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .25s,box-shadow .25s}
.ck .ico{width:16px;height:16px;stroke-width:3}
.srow.done .ck{background:var(--brand);box-shadow:none;color:var(--on-brand)}
.srow.took .ck{animation:pop .5s var(--spring)}
.srow.took .val{animation:take .7s var(--out)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes take{0%{background:var(--brand-tint);box-shadow:0 0 0 6px var(--brand-tint)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.srow .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;min-width:0}
.srow h2{font-size:1.25rem;font-weight:900;line-height:1.35}
.srow .val{font-size:.9375rem;font-weight:800;border-radius:8px;min-width:0}
.srow .val.no{color:var(--owner-ink-muted);font-weight:700}
.why{font-size:.875rem;font-weight:700;min-height:1.3em;margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.why .ico{width:16px;height:16px;margin-top:2px}
.why.err{color:var(--danger);font-weight:800}
.dates{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}

const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

function slotsFor(iso, mins) {
  const s = shop(), out = [];
  for (let m = tmin(s.open); m < tmin(s.close); m += 30) {
    if (iso === TODAY && m < nowMin() + 60) continue;      /* earliest same-day slot: an hour from now */
    const t = tstr(m); let st = 'ok';
    if (s.lunch && m >= tmin(s.lunch) && m < tmin(s.lunch) + 60) st = 'closed';
    else if (m + mins > tmin(s.close)) st = 'late';
    else if (state.taken.has(iso + ' ' + t) || (!LIFE && hash(state.shop + iso + t) % 100 < 26)) st = 'full';
    out.push({t, st});
  }
  return out;
}
function dayInfo(iso, mins) {
  const s = shop(), d = dOf(iso);
  if (iso === TODAY && state.today === 'holiday') return {st:'holiday', word:'公休'};
  if (d.getDay() === s.off) return {st:'holiday', word:'公休'};
  if (iso === TODAY && state.today === 'closed') return {st:'closed', word:'已打烊'};
  if (iso === s.fullDay && !LIFE) return {st:'full', word:'已滿', slots:slotsFor(iso, mins).map(x => ({t:x.t, st:x.st === 'ok' ? 'full' : x.st}))};
  const slots = slotsFor(iso, mins), free = slots.filter(x => x.st === 'ok');
  if (!free.length) return {st:'full', word:'已滿', slots};
  return {st:'ok', word: state.sel.svc ? `${free.length} 個` : '有空檔', slots, free};
}

    <div class="a-hdr hdr"><div class="sk logo" style="box-shadow:none"></div><div class="skl"><div class="sk" style="height:1.6em;width:60%"></div><div class="sk" style="height:1em;width:30%"></div></div><div class="skl" style="grid-column:${isWide() ? 2 : '1/-1'}"><div class="sk" style="height:1em;width:45%"></div><div class="sk" style="height:44px;width:240px;border-radius:14px"></div></div></div>
    <div class="a-svcs skl"><div class="sk" style="height:1.4em;width:9rem"></div>${'<div class="sk" style="height:96px;border-radius:16px"></div>'.repeat(3)}</div>
    ${isWide() ? '<div class="slip" style="grid-row:1/4"><div class="sk" style="height:520px;border-radius:20px"></div></div>' : ''}
  </div>`;
}
function vPage() {
  return `<div class="wrap${state.enter ? ' enter' : ''}">
    ${vHeader()}
    ${isWide() || state.q === 'fail' ? '' : `<section class="a-quick" aria-labelledby="h-quick"><div class="sechd"><h2 class="sec" id="h-quick">最近空檔</h2><span class="sub">點一下就選好日期</span></div>${vQuick(false)}</section>`}
    ${vServices()}
    ${vSlip()}
    ${vInfo()}
    <p class="pw a-pw">寵派小管家 提供預約服務</p>
  </div>`;
}
/* LIFF uses the same service ids, so the chosen service, date and time travel in the link */
const liffUrl = () => `../liff-booking/index.html?at=pet&shop=${state.shop}&svc=${state.sel.svc}&date=${state.sel.date}&time=${state.sel.time}`;
function vHandoff() {
  const s = shop(), x = svc(state.sel.svc), end = tstr(tmin(state.sel.time) + x.mins);
  return `<div class="ho${state.enter ? ' enter' : ''}">
    <div class="who"><div class="logo" aria-hidden="true">${esc(s.logo)}</div><div><b>${esc(s.name)}</b><span>${esc(s.branch)}</span></div></div>
    <div><h1 tabindex="-1" id="ho-h">還差三步就完成預約</h1><p class="desc">已用 LINE 登入，你選的服務和時段都帶過來了。</p></div>
    <div class="card"><dl class="kv">
      <dt>服務</dt><dd>${esc(x.name)}</dd>
      <dt>日期</dt><dd>${dl(state.sel.date)}</dd>
      <dt>時段</dt><dd>${state.sel.time}–${end}（${dur(x.mins)}）</dd>
      <dt class="tt">費用</dt><dd class="tt">${money(x.price)}</dd>
    </dl></div>
    <ol class="steps3" aria-label="接下來">
      <li class="cur"><span class="n" aria-hidden="true">1</span><b>選擇毛孩</b><p>從你的毛孩裡選，或新增一隻。</p></li>
      <li><span class="n" aria-hidden="true">2</span><b>服務前資料</b><p>個性、過敏、緊急聯絡人，回訪可以沿用上次。</p></li>
      <li><span class="n" aria-hidden="true">3</span><b>確認送出</b><p>時段在這一步送出時才算約好。${x.ct ? '契約會傳到你的 LINE，到店後在櫃台平板簽名即可。' : ''}</p></li>
    </ol>
    <div class="row">
      <a class="btn pri" href="${liffUrl()}" data-key="go">下一步：選擇毛孩</a>
      <button class="tlink" data-act="back" data-key="back">回到店家頁修改</button>
    </div>
  </div>`;
}

/* ---------- render ---------- */
let prevDone = {};
function render() {
  applyLayout(); applyBrand(); applyHead();
  const main = document.getElementById('main'), dock = document.getElementById('dock');
  const ae = document.activeElement, fk = ae && ae.closest('#main,#dock') ? ae.dataset.key : null;
  const strip = document.getElementById('dstrip'), sl = strip ? strip.scrollLeft : null;
  const body = document.querySelector('.sl-body'), bst = body ? body.scrollTop : null;
  const {done} = state.route === 'page' ? selSummary() : {done:{}};
  state.took = ['svc', 'date', 'time'].find(k => done[k] && !prevDone[k]) || null;
  prevDone = done;
  main.innerHTML = state.route === 'load' ? vSkeleton() : state.route === 'handoff' ? vHandoff() : vPage();
  dock.innerHTML = state.route === 'page' && !isWide() ? vAction() : '';
  state.enter = false;
  const s2 = document.getElementById('dstrip');
  if (s2) {
    if (sl !== null) s2.scrollLeft = sl;
    const c = s2.querySelector('[aria-checked="true"]');
    if (c && (c.offsetLeft < s2.scrollLeft || c.offsetLeft + c.offsetWidth > s2.scrollLeft + s2.clientWidth)) s2.scrollLeft = c.offsetLeft - 16;
  }
  const b2 = document.querySelector('.sl-body'); if (b2 && bst !== null) b2.scrollTop = bst;
  if (fk) { const el = document.querySelector(`#main [data-key="${fk}"] input, #main [data-key="${fk}"], #dock [data-key="${fk}"]`); if (el) el.focus({preventScroll:true}); }
  document.getElementById('p-now').textContent = `原型時間 ${LIFE ? '10/14（三）' : '10/9（五）'}${NOW[state.today]}`;
}
function say(t) { const l = document.getElementById('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); }
function focusSec(id) {
  const h = document.getElementById(id); if (!h) return;
  const sec = h.closest('section') || h;
  if (isWide() && sec.closest('.slip')) { h.focus({preventScroll:true}); const b = sec.closest('.sl-body'); if (b) b.scrollTop = 0; return; }
  sec.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  h.focus({preventScroll:true});
}

/* ---------- actions ---------- */
function pickSvc(id) {
  const s = state.sel; s.svc = id; state.notice = null; state.twhy = null; state.dwhy = null;
  const x = svc(id);
  if (s.date) {
    const di = dayInfo(s.date, x.mins);
    if (di.st !== 'ok') { state.dwhy = {t:`${dl(s.date)} 放不下「${x.name}」，請換一天。`}; s.date = null; s.time = null; }
    else if (s.time && di.slots.find(z => z.t === s.time)?.st !== 'ok') { state.twhy = {t:`原本的 ${s.time} 放不下「${x.name}」（${dur(x.mins)}），請重選時段。`}; s.time = null; }
  }
  say(`已選服務：${x.name}，${moneyT(x.price)}`);
  render();
}
function pickDate(iso, fromQuick) {
  const di = dayInfo(iso, curMins()); state.notice = null;
  if (di.st === 'holiday') { state.dwhy = {t:ERR.HOLIDAY_NOT_BOOKABLE, err:true}; render(); return; }
  if (di.st === 'closed') { state.dwhy = {t:ERR.OUTSIDE_BUSINESS_HOURS, err:true}; render(); return; }
  if (di.st === 'full') { state.dwhy = {t:`${dl(iso)} 的時段都約滿了，請換一天。`}; render(); return; }
  if (state.sel.date !== iso) state.sel.time = null;
  state.sel.date = iso; state.dateOpen = false; state.dwhy = null; state.twhy = null; state.lost = null;
  say(`已選日期：${dl(iso)}`);
  render();
  if (fromQuick && !isWide()) focusSec(state.sel.svc ? 'h-time' : 'h-svcs');
}
function pickTime(t, st) {
  state.notice = null;
  if (st && st !== 'ok') {
    const x = svc(state.sel.svc);
    state.twhy = {t: st === 'late' ? `這項服務${dur(x.mins)}，${t} 開始會超過 ${shop().close} 打烊。` : st === 'closed' ? '店家這段時間不開放預約。' : state.lost === state.sel.date + ' ' + t ? ERR.RESOURCE_CONFLICT : '這個時段已經約滿了，請選別的時段。'};
    render(); return;
  }
  state.sel.time = t; state.timeOpen = false; state.twhy = null;
  say(`已選時段：${t}。可以用 LINE 登入並送出了。`);
  render();
}
function need() {
  const d = selSummary().done;
  focusSec(!d.svc ? 'h-svcs' : !d.date ? 'h-date' : 'h-time');
}
function login() {
  state.busy = 'login'; state.notice = null; render();
  setTimeout(() => {
    state.busy = null;
    const r = state.login, s = shop();
    if (r === 'ok') { state.authed = true; state.route = 'handoff'; state.enter = true; render(); scrollTo(0, 0); document.getElementById('ho-h')?.focus(); lifeSay('login'); return; }
    if (r === 'cancel') state.notice = {kind:'info', t:'你取消了 LINE 登入。', p:'選好的服務和時段都還在，準備好再按一次。'};
    if (r === 'fail') state.notice = {kind:'danger', t:'LINE 登入沒有成功，請再試一次。', p:`一直不行的話，可以打 ${s.tel} 直接預約。`};
    if (r === 'conflict') {
      state.authed = true;
      const k = state.sel.date + ' ' + state.sel.time; state.taken.add(k); state.lost = k; state.sel.time = null;
      state.twhy = {t:ERR.RESOURCE_CONFLICT, err:true};
      state.notice = {kind:'info', t:'已用 LINE 登入，服務和日期都還在。'};
      state.login = 'ok'; document.getElementById('p-login').value = 'ok';
    }
    render();
    if (r === 'conflict') focusSec('h-time'); else document.getElementById('ntc')?.focus();
  }, 900);
}
function retry() {
  state.qbusy = true; render();
  setTimeout(() => { state.qbusy = false; render(); if (state.q === 'ok') say('時段已更新'); }, 700);
}
function load(ms) {
  state.route = 'load'; render();
  setTimeout(() => { state.route = 'page'; state.enter = true; render(); }, ms);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.tagName === 'INPUT') return;
  const act = a.dataset.act;
  if (act === 'date') pickDate(a.dataset.iso, a.classList.contains('qd'));
  else if (act === 'time') pickTime(a.dataset.t, a.dataset.st);
  else if (act === 'need') need();
  else if (act === 'login') login();
  else if (act === 'retry') retry();
  else if (act === 'reopen-t') { state.timeOpen = true; render(); document.querySelector('.tm[aria-checked="true"]')?.focus(); }
  else if (act === 'reopen') { state.dateOpen = true; render(); document.querySelector('.dcell[aria-checked="true"]')?.focus(); }
  else if (act === 'back') { state.route = 'page'; state.enter = true; render(); scrollTo(0, 0); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'svc') { pickSvc(t.value); return; }
  const k = t.dataset.key; if (!k || !k.startsWith('p-')) return;
  if (k === 'p-shop') { state.shop = t.value; resetSel(); load(500); return; }
  if (k === 'p-svcs') { state.svcs = t.value; resetSel(); }
  if (k === 'p-today') { state.today = t.value; state.sel.date = state.sel.time = null; state.dwhy = state.twhy = null; }
  if (k === 'p-sus') state.sus = t.checked;
  if (k === 'p-q') state.q = t.value;
  if (k === 'p-login') state.login = t.value;
  if (k === 'p-theme') state.theme = t.value;
  if (k === 'p-fs') state.fs = t.value;
  if (k === 'p-view') state.view = t.value;
  render();
});
document.getElementById('p-reload').addEventListener('click', () => load(1100));
/* arrow keys move within the date and time radio groups */
document.addEventListener('keydown', e => {
  const g = e.target.closest('.dates,.times'); if (!g || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const items = [...g.querySelectorAll('[role="radio"]')], i = items.indexOf(e.target);
  const n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)));
  items[n].focus(); e.preventDefault();
});
const protoEl = document.querySelector('.proto');
new ResizeObserver(() => document.documentElement.style.setProperty('--protoh', protoEl.offsetHeight + 'px')).observe(protoEl);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const w = isWide(); if (applyLayout() !== w) render(); }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

/* ---------- deep links: ?at=page|load|picked|handoff|cancel|fail|conflict&shop=&svcs=&today=&sus=1&q=fail&theme=&fs=&view= ---------- */
(function init() {
  const q = new URLSearchParams(location.search);
  if (q.get('shop') in SHOPS) state.shop = q.get('shop');
  if (['one', 'many'].includes(q.get('svcs'))) state.svcs = q.get('svcs');
  if (q.get('today') in NOW) state.today = q.get('today');
  if (LIFE) state.today = 'holiday';
  if (q.get('sus') === '1') state.sus = true;
  if (q.get('q') === 'fail') state.q = 'fail';
  if (['light', 'dark'].includes(q.get('theme'))) state.theme = q.get('theme');
  if (['1.3', '2'].includes(q.get('fs'))) state.fs = q.get('fs');
  if (['m', 'd'].includes(q.get('view'))) state.view = q.get('view');
  for (const [id, v] of [['p-shop', state.shop], ['p-svcs', state.svcs], ['p-today', state.today], ['p-q', state.q], ['p-theme', state.theme], ['p-fs', state.fs], ['p-view', state.view]]) document.getElementById(id).value = v;
  document.getElementById('p-sus').checked = state.sus;
  resetSel();
  const at = q.get('at') || '';
  if (at === 'load') { render(); return; }
  if (['picked', 'handoff', 'cancel', 'fail', 'conflict'].includes(at)) {
    applyLayout();
    const x = svcs().find(z => z.id === 'g2') || svcs()[0], d = quickDays()[0];
    state.sel = {svc:x.id, date:d.iso, time:dayInfo(d.iso, x.mins).free[0].t};
    state.route = 'page'; prevDone = {svc:true, date:true, time:true};
    if (at === 'handoff') { state.authed = true; state.route = 'handoff'; }
    if (at === 'cancel' || at === 'fail' || at === 'conflict') { state.login = at; document.getElementById('p-login').value = at; render(); login(); return; }
    render(); return;
  }
  if (at === 'page') { state.route = 'page'; render(); return; }
  load(650);
})();
</script>
</body>
</html>
