<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飼主 LIFF 原型</title>
<script src="../test-kit/kit.js" data-proto="liff-booking"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232E211B%22/%3E%3Cg fill=%22%23F6EFE7%22%3E%3Ccircle cx=%227.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Ccircle cx=%2210.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2213.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2216.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Cellipse cx=%2212%22 cy=%2215%22 rx=%223.6%22 ry=%223%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/Huninn-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 暖心生活 App world, owner side (飼主 LIFF). Status colors are the fixed set shared by every surface and shop; the shop brand slot replaces persimmon. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;--track:#E6D9CC;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;--border-danger:#E9A9A3;
  --toast:#2E211B;--on-toast:#FFFFFF;--scrim:#2B211C8C;
  --owner-surface:#FFFFFF;--owner-surface-variant:#F6EFE7;--owner-ink:#2B211C;--owner-ink-muted:#6E6058;--owner-border:#EADFD3;--owner-control-border:#9A8878;
  --ring-ahead:#927F70;
  --bezel:#2E211B;--line-bg:#FFFFFF;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --lift-up:0 -12px 28px -16px rgb(74 44 26 / .35);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --protoh:52px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--sunk:#30261F;--sunk-hover:#3B2F27;--track:#46382F;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;
  --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
  --owner-surface:#211915;--owner-surface-variant:#15100D;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
  --ring-ahead:#8D7C6F;
  --bezel:#3A2E27;--line-bg:#1C1512;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--sunk:#30261F;--sunk-hover:#3B2F27;--track:#46382F;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;
    --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
    --owner-surface:#211915;--owner-surface-variant:#15100D;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
    --ring-ahead:#8D7C6F;
    --bezel:#3A2E27;--line-bg:#1C1512;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
html{--fs:1}
html.fs13{font-size:130%;--fs:1.2}
html.fs20{font-size:200%;--fs:1.5}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--owner-ink);font-size:1rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit}
ul,ol{list-style:none}
::selection{background:var(--brand-tint);color:var(--owner-ink)}
input,textarea{caret-color:var(--owner-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--owner-control-border) transparent}
:focus-visible{outline:3px solid var(--owner-ink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--owner-ink-muted)}
.nw{white-space:nowrap}
.lead,.sub,.desc,.stg-s,.stg-n,p,.ntc span{text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}

/* ---------- prototype chrome: inverted against the theme so it never reads as product UI ---------- */
.proto{position:fixed;inset:0 0 auto 0;z-index:50;min-height:var(--protoh);background:var(--proto-bg);color:var(--proto-ink);display:flex;align-items:center;gap:6px 14px;padding:6px 14px;overflow-x:auto;white-space:nowrap;font-size:13px;font-weight:700;border-bottom:1.5px dashed var(--proto-muted);scrollbar-width:none}
.proto::-webkit-scrollbar{display:none}
@media (min-width:900px){.proto{flex-wrap:wrap;white-space:normal;overflow:visible}.proto label,.proto .note{white-space:nowrap}}
#p-jump{max-width:13rem}
.proto .tag{flex:none;border:1.5px dashed var(--proto-muted);border-radius:999px;padding:2px 9px;color:var(--proto-muted);font-weight:800}
.proto label{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--proto-muted)}
.proto select,.proto .pbtn{height:36px;border-radius:10px;border:1.5px solid var(--proto-line);background:transparent;color:var(--proto-ink);padding:0 8px;font-weight:700;font-size:13px}
.proto select option{background:var(--proto-bg);color:var(--proto-ink)}
.proto .pbtn{display:inline-flex;align-items:center;gap:4px;flex:none}
.proto .pbtn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.proto input[type="checkbox"]{width:18px;height:18px;accent-color:var(--proto-ink)}
.proto .sep{flex:none;width:1px;height:24px;background:var(--proto-line)}
.proto :focus-visible{outline-color:var(--proto-ink)}
.proto .note{color:var(--proto-muted);font-weight:600}

/* ---------- device frame ---------- */
.stage{min-height:100dvh;padding:calc(var(--protoh) + 20px) 20px 20px;display:flex;justify-content:center;align-items:flex-start}
.phone{position:relative;width:390px;flex:none;height:min(844px,calc(100dvh - var(--protoh) - 40px));min-height:560px;border-radius:46px;border:10px solid var(--bezel);background:var(--owner-surface-variant);box-shadow:var(--lift-hi);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
@media (max-width:599px){
  .stage{padding:var(--protoh) 0 0}
  .phone{width:100%;height:calc(100dvh - var(--protoh));min-height:0;border:0;border-radius:0;box-shadow:none}
}
/* simulated LINE LIFF header: not ours, not prototype chrome */
.lb{flex:none;height:46px;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:0 4px;background:var(--line-bg);border-bottom:1px solid var(--owner-border);color:var(--owner-ink)}
.lb .ico{width:20px;height:20px;justify-self:center;color:var(--owner-ink-muted)}
.lb .rt{display:flex;justify-content:flex-end;gap:16px;padding-right:10px}
.lb .t{text-align:center;line-height:1.2;min-width:0}
.lb .t b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .t small{display:block;font-size:12px;font-weight:600;color:var(--owner-ink-muted)}
.scr{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;scroll-padding-top:120px;scroll-padding-bottom:24px}
.page{padding:14px 16px 28px;display:flex;flex-direction:column;gap:22px}
.page.enter{animation:rise .32s var(--out) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.dock{flex:none;position:relative;z-index:3;background:var(--owner-surface);box-shadow:var(--lift-up);border-top:1px solid var(--owner-border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.dock .why{font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted);text-align:center}
.dock .row{display:flex;justify-content:center;flex-wrap:wrap;gap:0 10px}
.powered{text-align:center;font-size:.75rem;font-weight:700;color:var(--owner-ink-muted);padding:0 16px 22px}

/* ---------- sticky sub-page header ---------- */
.sbar{position:sticky;top:0;z-index:2;background:var(--owner-surface-variant);padding:6px 12px 8px 4px;display:flex;flex-direction:column;gap:6px}
.sbar .r1{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px;min-height:44px}
.sbar .r1.nob{grid-template-columns:1fr auto;padding-left:12px}
/* 契約全文 at 130% / 200%: one slim row, so the text keeps the screen */
.sbar.cmp{padding:2px 12px 2px 4px}
.sbar.cmp .r1{min-height:40px}
.sbar.cmp h1{font-size:1rem}
.sbar h1{font-size:1.25rem;font-weight:900;line-height:1.25;min-width:0}
.sbar .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.sbar .ttl .av{box-shadow:0 0 0 2px var(--owner-surface-variant),0 0 0 3.5px var(--brand)}
.lead-pet{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lead-pet b{font-weight:900;font-size:1.0625rem;display:block}
.tile.pt{display:flex;align-items:center;gap:12px}
.sbar .cnt{font-size:.875rem;font-weight:800;color:var(--owner-ink-muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--owner-ink);transition:background .2s,transform .35s var(--spring)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn:active{transform:scale(.92);transition-duration:.08s}
.iconbtn .ico{width:24px;height:24px;stroke-width:2.2}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 0 0 12px}
.steps i{height:6px;border-radius:999px;background:var(--track)}
.steps i.on{background:var(--brand)}
.steps i.cur{background:var(--brand);box-shadow:0 0 0 2px var(--owner-surface-variant),0 0 0 3.5px var(--brand)}
.hint{margin:0 0 0 12px;display:flex;gap:8px;align-items:center;background:var(--brand-tint);color:var(--brand-ink);border-radius:14px;padding:9px 12px;font-size:.875rem;font-weight:800;line-height:1.35}
.hint .ico{width:18px;height:18px}

/* ---------- type ---------- */
h2.sec{font-size:1.0625rem;font-weight:900;line-height:1.3;display:flex;align-items:center;gap:8px}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:32px}
.lead{font-size:1.0625rem;font-weight:700;line-height:1.45}
.sub{font-size:.875rem;font-weight:600;color:var(--owner-ink-muted)}
.cnt-pill{min-width:24px;height:24px;border-radius:999px;background:var(--sunk);font-size:.8125rem;font-weight:800;display:inline-grid;place-items:center;padding:0 8px}

/* ---------- cards, rows ---------- */
.card{background:var(--owner-surface);border-radius:16px;box-shadow:var(--lift);padding:16px;position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9375rem}
.kv dt{color:var(--owner-ink-muted);font-weight:700}
.kv dd{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv.me dd{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:4px 10px}
.kv.ed{grid-template-columns:auto 1fr auto;align-items:center}
.kv.ed dd{text-align:left}
html.fs20 .kv{grid-template-columns:1fr;gap:0}
html.fs20 .kv dd{text-align:left;margin-bottom:10px}
html.fs20 .kv.ed{grid-template-columns:1fr auto;align-items:start}
html.fs20 .kv.ed dt{grid-column:1/-1}
html.fs20 .todo{grid-template-columns:1fr}
html.fs20 .todo .btn{grid-column:1}
html.fs20 .today .mid,html.fs20 .bk{grid-template-columns:1fr}
html.fs20 .bk .chips{grid-column:1}
.hr{height:1px;background:var(--owner-border);border:0}

/* ---------- buttons ---------- */
.btn{min-height:48px;padding:11px 18px;border-radius:14px;font-weight:800;font-size:.9375rem;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;text-align:center;text-decoration:none;transition:transform .35s var(--spring),background .2s,border-color .2s}
.btn:active{transform:scale(.97);transition-duration:.08s}
.btn.pri{width:100%;min-height:56px;border-radius:16px;font-size:1.0625rem;background:var(--brand);color:var(--on-brand);box-shadow:var(--lift)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--sunk);color:var(--owner-ink)}
.btn.sec:hover{background:var(--sunk-hover)}
.btn.quiet{background:var(--owner-surface);border-color:var(--owner-control-border);color:var(--owner-ink)}
.btn.quiet:hover{border-color:var(--owner-ink)}
.btn.danger{background:var(--danger-solid);color:var(--on-danger-solid)}
/* LINE Login button: LINE's own spec, fixed colors in both themes, official icon (vendor/line/SOURCES.md) */
.linebtn{position:relative;width:100%;min-height:56px;display:grid;grid-template-columns:56px 1px 1fr;align-items:center;background:#06C755;color:#FFFFFF;border-radius:12px;overflow:hidden;font-weight:800;font-size:1.0625rem;text-align:center}
.linebtn img{width:56px;height:56px;display:block}
.linebtn .sep{align-self:stretch;background:rgb(0 0 0 / .08)}
.linebtn .lbl{padding:0 42px;line-height:1.3;white-space:nowrap}
.linebtn::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.linebtn:hover::after{opacity:.1}
.linebtn:active::after{opacity:.3}
.linebtn.busy{pointer-events:none}
.linebtn.busy::after{opacity:.1}
.btn.full{width:100%}
.btn[aria-disabled="true"]{background:transparent;border:1.5px dashed var(--owner-control-border);color:var(--owner-ink-muted);box-shadow:none;cursor:not-allowed;filter:none}
.btn[aria-disabled="true"]:active{transform:none}
.btn.busy{pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tlink{min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:4px;color:var(--brand-ink);font-weight:800;font-size:.9375rem;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;border-radius:10px}
.tlink.plain{color:var(--owner-ink)}
.tlink.dng{color:var(--danger)}
.tlink[aria-disabled="true"]{color:var(--owner-ink-muted);text-decoration:none;cursor:not-allowed}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;line-height:1.4;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.success{background:var(--success-bg);color:var(--success)}
.chip.warning{background:var(--warning-bg);color:var(--warning)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--neutral-bg);color:var(--neutral)}
.chip.danger{background:var(--danger-bg);color:var(--danger)}
.chip.brand{background:var(--brand-tint);color:var(--brand-ink)}
.chip.brand::before{display:none}
.chip.contract{background:transparent;border:1.5px solid var(--owner-control-border);color:var(--owner-ink-muted);padding:2px 9px}
.chip.contract::before{display:none}

/* ---------- notices ---------- */
.ntc{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;border-radius:14px;padding:12px 14px;font-size:.9375rem;font-weight:700;line-height:1.45}
.ntc .ico{margin-top:1px}
.ntc p{grid-column:2;font-weight:600}
.ntc .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.ntc .acts .tlink{color:inherit;padding:0}
.ntc.warning{background:var(--warning-bg);color:var(--warning)}
.ntc.info{background:var(--info-bg);color:var(--info)}
.ntc.neutral{background:var(--neutral-bg);color:var(--neutral)}
.ntc.success{background:var(--success-bg);color:var(--success)}
.ntc.danger{background:var(--danger-bg);color:var(--danger)}

/* ---------- avatar and the service-day 臉環 ---------- */
.av{--s:56px;width:var(--s);height:var(--s);flex:none;border-radius:50%;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:calc(var(--s) * .4);color:var(--owner-ink-muted);box-shadow:0 0 0 2px var(--owner-surface),0 0 0 3.5px var(--owner-border)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.rf{--s:104px;position:relative;flex:none;width:var(--s);height:var(--s);display:inline-grid;place-items:center}
.rf>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.rf circle{fill:none;stroke:var(--ring-ahead);stroke-width:3.5;stroke-linecap:round;transition:stroke .5s var(--out),stroke-width .5s var(--out)}
.rf circle.done{stroke:var(--owner-ink);stroke-width:6}
.rf circle.cur{stroke:var(--brand);stroke-width:9}
.rf.anim circle.cur{animation:draw .8s var(--out) both}
.rf.anim .ok{animation:pop .5s var(--spring) .35s both}
.rf.closed circle{stroke:var(--brand);stroke-width:7}
@keyframes draw{from{stroke-dasharray:0 600}}
.rf .ph{width:calc(var(--s) * .74);height:calc(var(--s) * .74);border-radius:50%;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:calc(var(--s) * .3);color:var(--owner-ink-muted)}
.rf .ph img{width:100%;height:100%;object-fit:cover}
.rf .ok{position:absolute;right:0;bottom:0;width:calc(var(--s) * .3);height:calc(var(--s) * .3);min-width:24px;min-height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);border:3px solid var(--owner-surface)}
.rf .ok .ico{width:58%;height:58%;stroke-width:3}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ---------- L-01 home ---------- */
.store{display:flex;align-items:center;gap:14px;padding:6px 0 2px}
.logo{width:3.5rem;height:3.5rem;border-radius:16px;flex:none;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:1.625rem;font-weight:900;box-shadow:var(--lift)}
.logo.sm{width:44px;height:44px;border-radius:14px;font-size:1.25rem}
.store h1{font-size:1.375rem;font-weight:900;line-height:1.25}
.store .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.open{display:inline-flex;align-items:center;gap:5px;color:var(--success)}
.open::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.open.shut{color:var(--owner-ink-muted)}
.open.shut::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.todo{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 14px}
.todo .t{font-weight:900;line-height:1.35}
.todo .s{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.todo .btn{grid-column:2;justify-self:start;min-height:44px;padding:8px 16px}
.todo+.todo{margin-top:12px;padding-top:12px;border-top:1px solid var(--owner-border)}
.bk{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.bk .nm{font-size:1.1875rem;font-weight:900;line-height:1.3}
.bk .nm button::after,.lnk::after{content:"";position:absolute;inset:0;border-radius:16px}
.bk .nm button:focus-visible{outline:none}
.card:has(.nm button:focus-visible),.card:has(.lnk:focus-visible){outline:3px solid var(--owner-ink);outline-offset:3px}
.bk .when{font-size:1rem;font-weight:900}
.bk .svc{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.bk .chips{grid-column:2;margin-top:4px}
.bk .ctx{grid-column:1/-1;font-size:.875rem;font-weight:700;color:var(--owner-ink-muted);padding-top:10px;margin-top:6px;border-top:1px solid var(--owner-border);display:flex;gap:8px;align-items:center}
.bk .ctx .ico{width:18px;height:18px}
.card.hover:hover{box-shadow:var(--lift-hi)}
/* today card: the ring is the page */
.today .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.today .top b{font-size:1rem;font-weight:900}
.today .mid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.stg{font-size:1.625rem;font-weight:900;line-height:1.15;color:var(--brand-ink)}
.stg-s{font-size:1rem;font-weight:700;line-height:1.45;margin-top:4px}
.stg-n{font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted);margin-top:6px}
.pay{margin-top:14px;background:var(--sunk);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;flex-wrap:wrap}
.pay .m{font-size:1.25rem;font-weight:900}
.pay .m small,.money small{font-size:.78em;font-weight:700;color:var(--owner-ink-muted);margin-right:1px}
.list{padding:4px 0}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;min-height:60px;padding:8px 14px 8px 16px;width:100%;position:relative;transition:background .2s}
a.lrow{color:inherit;text-decoration:none}
.lrow:hover{background:var(--owner-surface-variant)}
.lrow+.lrow::before{content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--owner-border)}
.lrow .ic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center}
.lrow b{display:block;font-weight:800;line-height:1.3}
.lrow small{display:block;font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.lrow .chev{color:var(--owner-ink-muted)}
.empty{text-align:center;padding:22px 16px}
.empty .ttl{font-weight:900;font-size:1.0625rem}
.empty p{font-size:.9375rem;font-weight:600;color:var(--owner-ink-muted);margin-top:4px}
.empty .btn{margin-top:14px}
.susp{font-size:.9375rem;font-weight:700;line-height:1.5;text-align:center;padding:4px 0}
.susp a{font-weight:900;color:var(--brand-ink);text-underline-offset:4px;display:inline-block;min-height:44px;line-height:44px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--owner-surface);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--owner-border);cursor:pointer;position:relative;transition:box-shadow .2s,background .2s}
.opt.has-av{grid-template-columns:auto 1fr auto}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .t{font-weight:900;font-size:1.0625rem;line-height:1.35}
.opt .d{font-size:.875rem;font-weight:600;color:var(--owner-ink-muted)}
.opt .p{font-weight:900;font-size:1rem}
.opt .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px}
.opt .mk{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--owner-control-border);display:grid;place-items:center;color:transparent;transition:background .2s,box-shadow .2s}
.opt .mk .ico{width:16px;height:16px;stroke-width:3}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.opt:has(input:checked){background:var(--brand-tint);box-shadow:inset 0 0 0 2px var(--brand)}
.opt:has(input:checked) .mk{background:var(--brand);box-shadow:none;color:var(--on-brand)}
.opt:has(input:focus-visible){outline:3px solid var(--owner-ink);outline-offset:3px}
.opt.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--owner-border);border:1.5px dashed var(--owner-control-border);cursor:not-allowed;padding:12.5px 14.5px}
.opt.off .t,.opt.off .p{color:var(--owner-ink-muted)}
.opt.off .mk{visibility:hidden}
.opt .why{color:var(--owner-ink);font-weight:700;font-size:.875rem}
.opt .t .new{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;border:1.5px solid var(--brand-ink);color:var(--brand-ink);font-size:.75rem;font-weight:900;line-height:1.5;vertical-align:2px}
.req{display:inline-flex;align-items:center;gap:4px;font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted)}
.req .ico{width:15px;height:15px}
/* L-02: one card per kind of service; the sizes it comes in are the choices inside it */
.sgrp{background:var(--owner-surface);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--owner-border);display:flex;flex-direction:column;gap:2px}
.sgrp .sizes{margin-top:10px}
.sgrp .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
.sgrp .hd .t{font-weight:900;font-size:1.0625rem;line-height:1.35}
.sgrp .hd .t .new{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;border:1.5px solid var(--brand-ink);color:var(--brand-ink);font-size:.75rem;font-weight:900;line-height:1.5;vertical-align:2px}
.sgrp .d{font-size:.875rem;font-weight:600;color:var(--owner-ink-muted)}
.sgrp .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:8px}
.sz{position:relative;display:flex;flex-direction:column;gap:1px;min-height:56px;padding:8px 12px;border-radius:14px;background:var(--owner-surface-variant);box-shadow:inset 0 0 0 1.5px var(--owner-border);cursor:pointer;transition:box-shadow .2s,background .2s}
.sz input{position:absolute;opacity:0;pointer-events:none}
.sz b{font-weight:900;line-height:1.3}
.sz .money{font-size:.9375rem}
.sz small{font-size:.75rem;font-weight:800;color:var(--owner-ink-muted)}
.sz:hover{box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.sz:has(input:checked){background:var(--brand);color:var(--on-brand);box-shadow:none}
.sz:has(input:checked) small,.sz:has(input:checked) .money small{color:var(--on-brand)}
.sz:has(input:focus-visible){outline:3px solid var(--owner-ink);outline-offset:3px}
.sgrp:has(input:checked){box-shadow:inset 0 0 0 2px var(--brand)}
.addopt{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-radius:16px;border:1.5px dashed var(--owner-control-border);font-weight:900;width:100%}
.addopt .pl{width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--owner-control-border);display:grid;place-items:center}
.addopt:hover{background:var(--owner-surface)}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lbl{font-size:.875rem;font-weight:800}
.fld .opt-mark{font-weight:600;color:var(--owner-ink-muted)}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--owner-control-border);background:var(--owner-surface);padding:10px 14px;font-size:1rem;font-weight:700;transition:border-color .2s}
.inp:hover{border-color:var(--owner-ink)}
.inp:focus-visible{outline:3px solid var(--owner-ink);outline-offset:2px}
.inp[aria-invalid="true"]{border-color:var(--danger-solid)}
.inp::placeholder{color:var(--owner-ink-muted);opacity:1}
.inp:disabled{background:transparent;border-style:dashed;color:var(--owner-ink-muted);cursor:not-allowed}
.inp:disabled::placeholder{color:var(--owner-ink-muted)}
.inp:disabled:hover{border-color:var(--owner-control-border)}
/* 確認預約, first visit: who the booking is for */
.mefs{display:flex;flex-direction:column;gap:14px}
textarea.inp{min-height:88px;resize:vertical;line-height:1.45}
.fmsg{font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.fmsg.bad{color:var(--danger)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg label{flex:1;min-height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.9375rem;cursor:pointer;position:relative;text-align:center;padding:4px 8px;line-height:1.25}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--owner-surface);box-shadow:var(--lift);font-weight:900}
.seg label:has(input:checked)::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.seg label:has(input:focus-visible){outline:3px solid var(--owner-ink);outline-offset:2px}
.chk{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;min-height:44px;padding:10px 0;cursor:pointer;font-weight:700;line-height:1.45}
.chk input{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--owner-control-border);background:var(--owner-surface);display:grid;place-items:center;cursor:pointer;margin-top:0;transition:background .2s,border-color .2s}
.chk input::after{content:"";width:12px;height:7px;border:3px solid var(--on-brand);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.chk input:checked{background:var(--brand);border-color:var(--brand)}
.chk input:checked::after{opacity:1}
.chk small{display:block;font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;width:100%;font-weight:800}
.sw .tr{width:52px;height:32px;border-radius:999px;background:var(--owner-control-border);position:relative;flex:none;transition:background .2s}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .3s var(--spring)}
.sw[aria-checked="true"] .tr{background:var(--brand)}
.sw[aria-checked="true"] .tr::after{transform:translateX(20px)}
.same{display:flex;flex-direction:column;gap:12px}
.same h2{font-size:1.125rem;font-weight:900}

/* photo uploader */
.phup{display:flex;align-items:center;gap:14px}
.phup .av{--s:72px}
.phup .st{font-size:.875rem;font-weight:700}
.phup .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:6px;width:140px}
.phup .bar i{display:block;height:100%;width:0;background:var(--brand);animation:fill 1.2s var(--out) forwards}
@keyframes fill{to{width:100%}}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.album button{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.8125rem;color:var(--owner-ink-muted);text-align:center;padding:6px}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.crop{position:relative;width:220px;height:220px;margin:0 auto;border-radius:16px;overflow:hidden}
.crop img{width:100%;height:100%;object-fit:cover}
.crop::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 999px rgb(0 0 0 / .0)}
.crop .grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgb(255 255 255 / .5) 33%,rgb(255 255 255 / .5) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgb(255 255 255 / .5) 66%,rgb(255 255 255 / .5) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,rgb(255 255 255 / .5) 33%,rgb(255 255 255 / .5) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgb(255 255 255 / .5) 66%,rgb(255 255 255 / .5) calc(66% + 1px),transparent calc(66% + 1px))}

/* ---------- L-05 time slots ---------- */
.dates{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dcell{flex:none;scroll-snap-align:start;width:4.25rem;min-height:5.5rem;border-radius:16px;background:var(--owner-surface);box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 4px;line-height:1.2;transition:background .2s,transform .35s var(--spring)}
.dcell .w{font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.dcell .d{font-size:1.25rem;font-weight:900}
.dcell .s{font-size:.75rem;font-weight:800;color:var(--success)}
.dcell[aria-checked="true"]{background:var(--brand);color:var(--on-brand)}
.dcell[aria-checked="true"] .w,.dcell[aria-checked="true"] .s{color:var(--on-brand)}
.dcell[aria-disabled="true"]{background:transparent;box-shadow:none;border:1.5px dashed var(--owner-control-border);color:var(--owner-ink-muted);cursor:not-allowed}
.dcell[aria-disabled="true"] .s{color:var(--owner-ink)}
.dcell:active:not([aria-disabled]){transform:scale(.95)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.25rem,1fr));gap:8px}
.tm{min-height:48px;border-radius:14px;background:var(--owner-surface);box-shadow:inset 0 0 0 1.5px var(--owner-border);font-weight:900;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px;transition:background .2s}
.tm:hover:not([aria-disabled]){box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.tm small{font-size:.75rem;font-weight:800}
.tm[aria-checked="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}
.tm[aria-disabled="true"]{background:transparent;box-shadow:none;border:1.5px dashed var(--owner-control-border);color:var(--owner-ink-muted);cursor:not-allowed;font-weight:700}
.tm[aria-disabled="true"] small{color:var(--owner-ink)}
.slotwhy{font-size:.875rem;font-weight:700;min-height:1.3em}

/* ---------- L-05 住宿: the pass (入住 → n 晚 → 退房) over a month of dates; the stay is a brand band from the 入住 date to the 退房 date ---------- */
.st-pass{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 12px;padding:14px 16px;border-radius:16px;background:var(--owner-surface);box-shadow:var(--lift)}
.st-end{display:flex;flex-direction:column;gap:1px;min-width:0}
.st-end .k{font-size:.75rem;font-weight:800;color:var(--owner-ink-muted)}
.st-end b{font-size:1.0625rem;font-weight:900;line-height:1.3}
.st-end small{font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.st-end.out{align-items:flex-end;text-align:right}
.st-end.none b{color:var(--owner-ink-muted);font-weight:700}
.st-n{position:relative;display:flex;align-items:baseline;gap:3px;padding:6px 14px;border-radius:999px;background:var(--brand);color:var(--on-brand);box-shadow:var(--lift)}
.st-n b{font-size:1.5rem;font-weight:900;line-height:1}
.st-n span{font-size:.875rem;font-weight:800}
.st-n.none{background:transparent;color:var(--owner-ink-muted);box-shadow:none;border:1.5px dashed var(--owner-control-border)}
.st-n::before,.st-n::after{content:"";position:absolute;top:50%;width:10px;border-top:2px dotted var(--owner-control-border)}
.st-n::before{right:100%}.st-n::after{left:100%}
.st-n.pop{animation:pop .45s var(--spring) both}
.st-tot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-top:1px solid var(--owner-border);padding-top:10px;font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.st-tot .money{font-size:1.25rem;color:var(--owner-ink)}
.st-tot .money small{font-size:.7em}
.st-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:.75rem;font-weight:800;color:var(--owner-ink-muted);text-align:center;padding-bottom:4px}
.st-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.stday{position:relative;isolation:isolate;min-width:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 1px;text-align:center;line-height:1.15;transition:transform .35s var(--spring)}
.stday::before{content:"";position:absolute;inset:4px 0;z-index:-2}
.stday::after{content:"";position:absolute;inset:1px 2px;z-index:-1;border-radius:12px;background:var(--owner-surface);box-shadow:inset 0 0 0 1.5px var(--owner-border);transition:background .2s,box-shadow .2s}
.sd-t{font-size:.75rem;font-weight:800;color:var(--owner-ink-muted);min-height:1.15em;white-space:nowrap}
.sd-n{font-size:1.125rem;font-weight:900}
.sd-w{display:none}
.sd-s{font-size:.75rem;font-weight:800;color:var(--success);white-space:nowrap;letter-spacing:-.02em}
.stday.n .sd-s{color:var(--owner-ink);font-weight:900;font-size:.75rem}
.stday:hover:not([aria-disabled="true"])::after{box-shadow:inset 0 0 0 1.5px var(--owner-control-border)}
.stday:active:not([aria-disabled="true"]){transform:scale(.94);transition-duration:.08s}
.stday:focus-visible{outline-offset:-1px;z-index:1}
.stday[aria-disabled="true"]{cursor:not-allowed}
.stday[aria-disabled="true"]::after{background:transparent;box-shadow:none;border:1.5px dashed var(--owner-control-border)}
.stday[aria-disabled="true"] .sd-n{font-weight:700;color:var(--owner-ink-muted)}
.stday[aria-disabled="true"] .sd-s{color:var(--owner-ink)}
/* a tap here starts the stay over from this date */
.stday.re::after{background:transparent;box-shadow:none;border:1.5px dashed var(--owner-control-border)}
.stday.re .sd-s{color:var(--owner-ink-muted)}
.stday.re.armed::after{border:2px dashed var(--brand)}
/* the band: brand endpoints, a brand tint through the nights */
.stday.mid::before{background:var(--brand-tint)}
.stday.beg:not(.solo)::before{left:50%;background:var(--brand-tint)}
.stday.end::before{right:50%;background:var(--brand-tint)}
.stday.mid::after{background:transparent;box-shadow:none}
.stday.beg::after,.stday.end::after{background:var(--brand);box-shadow:var(--lift)}
.stday.beg>span,.stday.end>span{color:var(--on-brand)!important}
.st-grid>.stday:nth-child(7n+1).mid::before{border-radius:999px 0 0 999px}
.st-grid>.stday:nth-child(7n).mid::before{border-radius:0 999px 999px 0}
.stday.ink::after{animation:ink .4s var(--out) both}
@keyframes ink{from{transform:scale(.7);opacity:.3}}
/* 改期: the original stay as a dashed rule under its dates */
.sd-o{position:absolute;bottom:0;left:0;right:0;border-top:2px dashed var(--owner-ink);pointer-events:none}
.stday.o-beg .sd-o{left:50%}.stday.o-end .sd-o{right:50%}
.st-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.st-key span{display:inline-flex;align-items:center;gap:6px}
.st-key i{width:18px;height:12px;border-radius:4px;flex:none}
.st-key .k-band{background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--owner-border)}
.st-key .k-shut{border:1.5px dashed var(--owner-control-border)}
.st-key .k-orig{height:0;border-radius:0;border-top:2px dashed var(--owner-ink)}
.st-at{display:flex;flex-direction:column;gap:10px}
.stday.blank::before,.stday.blank::after{display:none}
/* larger text: the weeks become a list of dates, one full row each */
html.fs13 .st-wk,html.fs20 .st-wk,html.fs13 .stday.blank,html.fs20 .stday.blank{display:none}
html.fs13 .st-grid,html.fs20 .st-grid{grid-template-columns:minmax(0,1fr);row-gap:0}
html.fs13 .stday,html.fs20 .stday{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:2px 12px;padding:10px 16px;min-height:56px;text-align:left}
html.fs13 .stday::before,html.fs20 .stday::before{left:0!important;right:0!important;inset-block:0;border-radius:0!important}
html.fs13 .stday.beg::before,html.fs20 .stday.beg::before{top:50%}
html.fs13 .stday.end::before,html.fs20 .stday.end::before{bottom:50%}
html.fs13 .sd-n,html.fs20 .sd-n{order:1;min-width:6em}

/* ---------- L-06 confirm ---------- */
.fee{display:flex;flex-direction:column;gap:8px;font-size:.9375rem}
.fee .r{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.fee .r.tot{border-top:1px solid var(--owner-border);padding-top:10px;font-weight:900;font-size:1.0625rem}
.fee .r .lbl small{display:block;font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.money{font-weight:900;white-space:nowrap}
/* L-06: what this booking's cancel rule means in dates and money, always in view next to the consent */
.cxl{display:grid;grid-template-columns:20px 1fr;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:.9375rem;font-weight:800;line-height:1.45}
.cxl .ico{width:18px;height:18px;margin-top:2px}
.cxl .cl{display:inline-block}
.cxl small{display:block;font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.disc{border-radius:14px;background:var(--sunk);}
.disc>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:8px 14px;font-weight:800;font-size:.9375rem;gap:8px}
.disc>button .ico{transition:transform .25s var(--out)}
.disc>button[aria-expanded="true"] .ico{transform:rotate(90deg)}
.disc .bd{padding:0 14px 14px;font-size:.875rem;font-weight:600;line-height:1.6}
.disc .bd li{padding-left:14px;position:relative}
.disc .bd li::before{content:"";position:absolute;left:2px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--owner-ink-muted)}

/* ---------- result page ---------- */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:18px}
.result .av{--s:112px;box-shadow:0 0 0 4px var(--owner-surface-variant),0 0 0 7px var(--brand)}
.result .badge{position:relative}
.result .badge .ok{position:absolute;right:-4px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;border:3px solid var(--owner-surface-variant);animation:pop .5s var(--spring) .2s both}
.result .badge .ok .ico{stroke-width:3}
.result .disc-ico{width:96px;height:96px;border-radius:50%;display:grid;place-items:center}
.result .disc-ico .ico{width:44px;height:44px;stroke-width:2}
.result .disc-ico.warning{background:var(--warning-bg);color:var(--warning)}
.result .disc-ico.info{background:var(--info-bg);color:var(--info)}
.result .disc-ico.neutral{background:var(--neutral-bg);color:var(--neutral)}
.result h1{font-size:1.5rem;font-weight:900;line-height:1.3;text-wrap:balance;margin-top:6px}
.result .desc{font-size:1rem;font-weight:700;line-height:1.55;color:var(--owner-ink-muted);text-wrap:pretty;max-width:22rem}
.result .card{width:100%;text-align:left;margin-top:8px}
.result .got{display:inline-flex;align-items:center;gap:6px;font-size:.9375rem;font-weight:800;color:var(--success);text-wrap:balance}
.result .got::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.hero-when{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.hero-when .pn{font-size:.9375rem;font-weight:800;color:var(--owner-ink-muted)}
.hero-when b{font-size:1.75rem;font-weight:900;line-height:1.2;letter-spacing:-.01em}
.hero-when .where{font-size:.9375rem;font-weight:700}
.result .addopt{margin-top:4px}
.gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 16px}
.gate .logo{width:72px;height:72px;border-radius:20px;font-size:2rem}
.gate .nm{font-size:1.25rem;font-weight:900}
.gate h1{font-size:1.5rem;font-weight:900;margin-top:18px}

/* ---------- L-07 contract ---------- */
.doc{font-size:1rem;line-height:1.75}
.doc :is(h2,h3){font-size:1.0625rem;font-weight:900;line-height:1.4;margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.doc p{font-weight:500;margin-bottom:18px;text-wrap:pretty}
.doc .key{background:var(--brand-tint);border-radius:16px;padding:14px 16px 4px;margin:0 0 18px}

.doc .klbl{font-size:.75rem;font-weight:900;color:var(--brand-ink);background:var(--owner-surface);border-radius:999px;padding:1px 8px}
.doc .upd{font-size:.75rem;font-weight:800;color:var(--info);background:var(--info-bg);border-radius:999px;padding:1px 8px}

.docend{text-align:center;font-size:.875rem;font-weight:800;color:var(--owner-ink-muted);padding:12px;border-top:1.5px dashed var(--owner-control-border)}
.conds{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.conds li{display:inline-flex;align-items:center;gap:5px}
.conds .c{width:18px;height:18px;border-radius:50%;border:2px solid var(--ring-ahead);display:grid;place-items:center}
.conds li.ok{color:var(--success)}
.conds li.ok .c{background:var(--success);border-color:var(--success);color:var(--success-bg)}
.conds .c .ico{width:12px;height:12px;stroke-width:3.4}
/* larger text: the three conditions fold into one line so the contract keeps the screen */
.conds1{text-align:center;font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted);line-height:1.4}
.conds1.ok{color:var(--success)}
.page>.hint{margin:0;text-wrap:balance}
.keys{display:flex;flex-direction:column;gap:6px}
.keys li{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:.9375rem}
.keys li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--brand);flex:none;transform:translateY(-2px)}
.idfield{display:flex;gap:8px}
.idfield .btn{flex:none;white-space:nowrap}
.page.bare{display:flex}
.page.bare .gate{flex:1}
.idfield .inp{font-size:1.25rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.masked{font-size:1.25rem;font-weight:900;letter-spacing:.08em}
.iddone{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code{display:flex;justify-content:center;gap:6px;position:relative}
.code input{position:absolute;inset:0;opacity:0;width:100%;font-size:1px}
.code i{width:44px;height:54px;border-radius:12px;border:1.5px solid var(--owner-control-border);background:var(--owner-surface);display:grid;place-items:center;font-style:normal;font-size:1.5rem;font-weight:900}
.code:focus-within i.at{border:2.5px solid var(--owner-ink)}

/* ---------- L-08 ---------- */
.segtabs{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}

.segtabs button[aria-selected="true"]{background:var(--owner-surface);box-shadow:var(--lift);font-weight:900}
.segtabs .cnt-pill{height:22px;min-width:22px;font-size:.75rem}
.segtabs button[aria-selected="true"] .cnt-pill{background:var(--owner-ink);color:var(--owner-surface)}
.card.past{box-shadow:none;background:transparent;border:1.5px solid var(--owner-border)}
.dhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.dhead .nm{font-size:1.5rem;font-weight:900;line-height:1.25}
.dhead .svc{font-weight:700;color:var(--owner-ink-muted)}
.dhead .chips{justify-content:center;margin-top:4px}
.dhead .av{--s:96px}
.tl{display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;min-height:46px;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:-12px;height:24px;width:2px;background:var(--owner-ink)}
.tl li:first-child::before{display:none}
.tl li.ahead::before{background:none;border-left:2px dashed var(--ring-ahead);width:0}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;background:var(--owner-surface)}
.tl li.done .dot{background:var(--owner-ink);color:var(--owner-surface)}
.tl li.done .dot .ico{width:15px;height:15px;stroke-width:3}
.tl li.cur .dot{box-shadow:inset 0 0 0 7px var(--brand)}
.tl li.ahead .dot{box-shadow:inset 0 0 0 2px var(--ring-ahead)}
.tl li.cur b{font-weight:900}
.tl b{font-weight:700}
.tl li.ahead b{color:var(--owner-ink-muted);font-weight:600}
.tl .tm2{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted)}
.tl .now{font-size:.75rem;font-weight:900;color:var(--brand-ink);background:var(--brand-tint);border-radius:999px;padding:1px 8px;margin-left:6px}
.bcode{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bcode .c{font-size:1.75rem;font-weight:900;letter-spacing:.12em}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .why{font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted);text-align:center;margin-top:-2px}
.tile{background:var(--sunk);border-radius:14px;padding:10px 14px}
.tile .k{font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted)}
.tile .v{font-weight:900}
.arrow{display:grid;place-items:center;color:var(--owner-ink-muted);margin:-4px 0}
.tile.to{background:transparent;border:2px solid var(--owner-ink)}
.tile.to.empty{border:2px dashed var(--owner-control-border)}
.docrow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.docrow .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center}
.docrow b{font-weight:900;line-height:1.35;display:block}
.docrow .m{font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.docrow .btn{grid-column:2;justify-self:start;margin-top:8px}
.paper{background:var(--owner-surface);border-radius:16px;box-shadow:var(--lift);padding:20px 18px}
.paper .ph{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--owner-border);padding-bottom:12px;margin-bottom:14px}
.sigbox{border-top:1.5px solid var(--owner-border);padding-top:14px;display:grid;gap:6px;font-size:.875rem;font-weight:700}
.sigbox .sig{font-size:1.5rem;font-weight:400;font-style:italic;color:var(--owner-ink);border-bottom:1.5px solid var(--owner-ink);padding:6px 4px;width:12rem}
.ntf{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0}
.ntf+.ntf{border-top:1px solid var(--owner-border)}
.ntf .ic{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.ntf b{font-weight:800;display:block;line-height:1.35}
.ntf .m{font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.petc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.petc .nm{font-size:1.125rem;font-weight:900}

/* ---------- overlays inside the phone ---------- */
.layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.layer>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s var(--out) both}
@keyframes fade{from{opacity:0}}
.sht{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--owner-surface);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--lift-hi);animation:up .38s var(--out) both;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(100%)}}
.sht .grab{width:40px;height:5px;border-radius:3px;background:var(--owner-border);margin:2px auto 0}
.sht .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sht h2{font-size:1.25rem;font-weight:900}
.sht p{font-size:.9375rem;font-weight:600;line-height:1.6}
.sht .eq{display:flex;flex-direction:column;gap:10px}
.sht .eq .btn{width:100%;flex-direction:column;gap:2px;min-height:60px}
.sht .eq .btn small{font-size:.8125rem;font-weight:600;color:var(--owner-ink-muted)}
.sht .eq.two{flex-direction:row}
.sht .eq.two .btn{flex:1}
.mdl{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.mdl .box{position:relative;width:100%;background:var(--owner-surface);border-radius:24px;padding:22px 20px 18px;box-shadow:var(--lift-hi);animation:spring .4s var(--spring) both;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
@keyframes spring{from{transform:scale(.92);opacity:0}}
.mdl h2{font-size:1.1875rem;font-weight:900;line-height:1.4}
.mdl p{font-size:.9375rem;font-weight:600;line-height:1.55}
.mdl .sum{background:var(--sunk);border-radius:14px;padding:12px 14px}
.mdl .btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tst{position:absolute;left:16px;right:16px;bottom:calc(var(--dockh,0px) + 12px);background:var(--toast);color:var(--on-toast);border-radius:18px;min-height:52px;padding:12px 16px;font-weight:800;font-size:.9375rem;display:flex;align-items:center;gap:10px;box-shadow:var(--lift-hi);animation:spring .4s var(--spring) both}

/* skeleton */
.sk{background:var(--sunk);border-radius:12px;animation:shim 1.4s ease-in-out infinite}
@keyframes shim{50%{opacity:.55}}

@media (prefers-reduced-motion: reduce){
  /* motion goes, end states stay: a forwards fill still lands full, a popped mark still shows */
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  /* loading keeps a cue without movement: the spinner and skeletons breathe in opacity instead */
  .spin{animation:shim 1.4s ease-in-out infinite!important;border-right-color:currentColor}
  .sk{animation:shim 1.4s ease-in-out infinite!important}
  /* the upload still reads as progress: the bar fills over its time, by width not motion across the screen */
  .phup .bar i{animation-duration:1.2s!important}
}

<script>
/* ---------- helpers ---------- */

/* ---------- 住宿 (示範): rooms and the nights already taken follow M-06 資源 (中山店 狗房 1–4・貓房 1–3, 10/9 起 14 天);
   counting and late fees follow M-04 住宿計價 (24 小時制, 每小時 NT$100, 寬限 30 分); M-06's 毛毛 stay (狗房 4, 10/20 12:00 → 10/22 12:00) is the one this walk books, so it is left out ---------- */
const ROOMK = {'狗':'狗房', '貓':'貓房'};
const STAY = {late:100, grace:30, max:14, first:'2026-10-10', last:'2026-10-31'};
const OCC = {'狗':[
  [['2026-10-05', '2026-10-12'], ['2026-10-17', '2026-10-19'], ['2026-10-19', '2026-10-22']],
  [['2026-10-06', '2026-10-09'], ['2026-10-17', '2026-10-19'], ['2026-10-19', '2026-10-20'], ['2026-10-20', '2026-10-23']],
  [['2026-10-11', '2026-10-13'], ['2026-10-17', '2026-10-19'], ['2026-10-19', '2026-10-22']],
  [['2026-10-08', '2026-10-11'], ['2026-10-17', '2026-10-19']]
], '貓':[[], [], []]};
const nightsOf = (ci, co) => Math.round((dOf(co) - dOf(ci)) / 864e5);
/* the stays already in a room: M-06's, this session's bookings, and a room taken away by the 剛被訂走 simulation */
function roomStays(kind, r, skip) {
  const own = state.books.filter(b => b.stay && b.id !== skip && b.stay.kind === kind && b.stay.room === r && !['cancelled'].includes(b.status)).map(b => [b.stay.ci, b.stay.co]);
  return OCC[kind][r].concat(own, state.takenRooms.filter(t => t.kind === kind && t.r === r).map(t => [t.ci, t.co]));
}
const roomFree = (kind, r, ci, co, skip) => !roomStays(kind, r, skip).some(([a, b]) => a < co && ci < b);
const freeRooms = (kind, night, skip) => OCC[kind].map((_, r) => r).filter(r => roomFree(kind, r, night, addDays(night, 1), skip));
/* one room has to hold the whole stay: no moving rooms in the middle */
const fitRoom = (kind, ci, co, skip) => OCC[kind].map((_, r) => r).find(r => roomFree(kind, r, ci, co, skip));
const shut = iso => dOf(iso).getDay() === shop().off || (OFF && iso === OFF_DAY);
function noIn(kind, iso, skip) {
  if (shut(iso)) return {txt:'公休', why:`${dl(iso)}公休，不能入住；住宿可以跨過公休日`};
  if (!freeRooms(kind, iso, skip).length) return {txt:'已滿', why:`${dl(iso)}那晚${ROOMK[kind]}都住滿了`};
  return null;
}
function noOut(kind, ci, iso, skip) {
  if (iso <= ci) return {txt:'', why:'退房要在入住之後'};
  if (shut(iso)) return {txt:'公休', why:`${dl(iso)}公休，不能退房；住宿可以跨過公休日`};
  const n = nightsOf(ci, iso);
  if (n > STAY.max) return {txt:'太長', why:`線上最多住 ${STAY.max} 晚，更久請打給店家`};
  if (fitRoom(kind, ci, iso, skip) == null) {
    let last = ci; while (fitRoom(kind, ci, addDays(last, 1), skip) != null) last = addDays(last, 1);
    return {txt:'住不下', why:`住不下：${dl(last)}那晚起，沒有一間${ROOMK[kind]}能讓毛孩從頭住到尾`};
  }
  return null;
}

    case 'petnew': state.bk = Object.assign(newDraft(), {svc:'g2'}); state.pf = newPetForm('book'); S('pet', {}, [{n:'home'}, {n:'svc'}]); break;
    case 'inq': state.bk = Object.assign(newDraft(), {svc:'g2', pet:'mm', inq:clone(PET_SEED[0].inq), inqPet:'mm'}); S('inq', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}]); break;
    case 'slot': state.bk = Object.assign(draftFull(), {date:null, time:null}); S('slot', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}, {n:'inq'}]); break;
    case 'conflict': state.bk = Object.assign(draftFull(), {time:null}); state.taken.add('2026-10-1310:30'); S('slot', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}, {n:'inq'}]); state.notice = {tone:'warning', t:'你選的時段剛被預約，請重新選擇。', p:'10/13（二）10:30 被別人約走了，其他資料都保留著。'}; break;
    case 'confirm': case 'offline': state.bk = draftFull(); state.bk.c1 = k === 'offline'; S('confirm', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}, {n:'inq'}, {n:'slot'}]); if (k === 'offline') state.next = 'offline'; break;
    case 'booked': state.newCount = 1; state.books.push({id:'n1', pet:'mm', svc:'g2', date:'2026-10-13', time:'10:30', end:'12:30', fee:1200, status:'booked', contract:'unread', delivered:'剛剛', fresh:true, code:'T9B4'}); S('booked', {id:'n1'}); break;
    case 'gate': state.authed = false; state.link = {bid:'b2', kind:'ok'}; state.gate = null; S('gate', {}, []); break;
    case 'idform': state.rd = {bid:'b2', ticks:{}, end:false, secs:0, idStage:'', idVal:''}; S('idform'); break;
    case 'sum': state.idDone = 'A123456789'; state.rd = {bid:'b2', ticks:{}, end:false, secs:0}; S('sum'); break;
    case 'full': case 'fresh': state.idDone = 'A123456789'; if (k === 'fresh') { book('b2').fresh = true; book('b2').delivered = '10/9（五）19:40'; } state.rd = {bid:'b2', ticks:{}, end:false, secs:0}; S('full', {}, [{n:'home'}, {n:'sum'}]); break;
    case 'readdone': Object.assign(book('b2'), {contract:'read', readVer:VER, readAt:'10/9（五）20:30'}); S('readdone', {id:'b2'}, []); break;
    case 'verchg': Object.assign(book('b1'), {readVer:'v2'}); S('home', {}, []); break;
    case 'expired': state.authed = false; state.link = {bid:'b2', kind:'expired'}; S('gate', {}, []); break;
    case 'voidnew': state.authed = false; state.link = {bid:'b1', kind:'void-new'}; S('gate', {}, []); break;
    case 'voidcx': state.authed = false; state.link = {bid:'h2', kind:'void-cancel'}; S('gate', {}, []); break;
    case 'stay': state.bk = Object.assign(stayDraft(), {ci:null, co:null, at:null}); S('slot', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}, {n:'inq'}]); break;
    case 'staycfm': state.bk = stayDraft(); S('confirm', {}, [{n:'home'}, {n:'svc'}, {n:'pet'}, {n:'inq'}, {n:'slot'}]); break;
    case 'staybooked': state.newCount = 1; state.books.push(stayBook()); S('booked', {id:'n1'}); break;
    case 'staydetail': state.newCount = 1; state.books.push(stayBook()); S('detail', {id:'n1'}, [{n:'home'}, {n:'appts'}]); break;
    case 'stayresched': state.newCount = 1; state.books.push(stayBook()); state.rs = {ci:null, co:null, at:'12:00', fixedAt:true, stayWhy:''}; S('resched', {id:'n1'}, [{n:'home'}, {n:'appts'}, {n:'detail', id:'n1'}]); break;
    case 'appts': S('appts'); break;
    case 'history': state.tab = 'hi'; S('appts'); break;
    case 'detail': S('detail', {id:'b2'}, [{n:'home'}, {n:'appts'}]); break;
    case 'pending': S('detail', {id:'b1'}, [{n:'home'}, {n:'appts'}]); break;   /* 毛毛's request from M-02 (rs-maomao) is already seeded */
    case 'rejected': book('b2').req = {kind:'resched', date:'2026-10-18', time:'14:00', state:'rejected', reason:'那天美容師請假，請改選其他時間，抱歉'}; S('detail', {id:'b2'}, [{n:'home'}, {n:'appts'}]); break;
    case 'nocancel': state.day = Math.max(1, state.day); S('detail', {id:'b1'}, [{n:'home'}, {n:'appts'}]); break;
    case 'cancel': state.cx = {reason:''}; S('cancel', {id:'b1'}, [{n:'home'}, {n:'appts'}, {n:'detail', id:'b1'}]); break;
    case 'resched': state.rs = {date:null, time:null, dateWhy:''}; S('resched', {id:'b2'}, [{n:'home'}, {n:'appts'}, {n:'detail', id:'b2'}]); break;
    case 'docs': S('docs', {id:'h1'}, [{n:'home'}, {n:'appts'}, {n:'detail', id:'h1'}]); break;
    case 'pets': case 'notifs': case 'me': case 'shopinfo': S(k); break;
  }
  syncProto(); render({nav:true});
}
function syncProto() {
  const $ = id => document.getElementById(id);
  $('p-shop').value = state.shop; $('p-visit').value = state.visit; $('p-sus').checked = state.sus; $('p-day').value = String(state.day);
  $('p-next').value = state.next; $('p-theme').value = state.theme; $('p-fs').value = state.fs; $('p-now').textContent = nowLabel();
  const adv = $('p-adv'); adv.setAttribute('aria-disabled', state.day >= 5 || state.visit !== 'return' ? 'true' : 'false');
  $('p-day').disabled = state.visit !== 'return';
}
function applyTheme() {
  const h = document.documentElement;
  state.theme ? h.setAttribute('data-theme', state.theme) : h.removeAttribute('data-theme');
  h.classList.toggle('fs13', state.fs === '1.3'); h.classList.toggle('fs20', state.fs === '2');
}
function syncProtoH() { document.documentElement.style.setProperty('--protoh', `${document.querySelector('.proto').offsetHeight}px`); }
addEventListener('resize', syncProtoH);
(function initProto() {
  const $ = id => document.getElementById(id);
  $('p-day').innerHTML = `<option value="-1">不是今天</option>${STAGES.map((s, i) => `<option value="${i}">${s}</option>`).join('')}`;
  $('p-jump').innerHTML = `<option value="">選一個狀態…</option>${JUMPS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}`;
  $('p-shop').onchange = e => { state.shop = e.target.value; applyShop(); render(); };
  $('p-visit').onchange = e => { state.visit = e.target.value; state.day = -1; seed(); state.stack = []; state.route = {n:'home'}; syncProto(); render({nav:true}); };
  $('p-sus').onchange = e => { state.sus = e.target.checked; if (state.sus && ['svc', 'pet', 'inq', 'slot'].includes(state.route.n)) { state.stack = []; state.route = {n:'home'}; } render(); };
  $('p-day').onchange = e => { setDay(+e.target.value); };
  $('p-adv').onclick = () => { if (state.day < 5 && state.visit === 'return') setDay(state.day + 1); };
  $('p-jump').onchange = e => { if (e.target.value) jump(e.target.value); e.target.value = ''; };
  $('p-next').onchange = e => { state.next = e.target.value; };
  $('p-theme').onchange = e => { state.theme = e.target.value; applyTheme(); };
  $('p-fs').onchange = e => { state.fs = e.target.value; applyTheme(); render(); };
})();
function setDay(d) {
  state.day = d;
  if (d >= 0) { const b = book('b1'); if (b) { b.status = 'booked'; b.req = null; } if (!['home', 'detail', 'appts', 'notifs'].includes(state.route.n)) { state.stack = []; state.route = {n:'home'}; } }
  syncProto(); render({ring:true});
  if (d >= 0) { const b = book('b1'); say(`${pet(b.pet).name}：${STAGES[d]}。${stageLine(b, d)[0]}`); }
}

/* 毛毛's booking at each act: booked on 10/8 for 10/10（六）10:00; asks on 10/9 to move to 10/12（一）14:00 (改期費 NT$240, within 24 hours);
   the shop approves, so the contract is the new date's version and unread; on 10/12 she is home by 15:52 */
function lifeSeed() {
  if (DEL) {
    Object.assign(OWNER, {name:'郭太太', ph:'0920334126', addr:'台北市中山區松江路（門牌略）'});
    state.pets = [{id:'tt', name:'糖糖', photo:'tangtang', kind:'狗', breed:'馬爾濟斯', size:'小型犬', age:'5', chip:'900138000004126', care:'',
      inq:{personality:'親人', bite:'不咬人', biteNote:'', illness:'無', allergy:'無', special:'無', emergency:'郭先生 0921334126'}}];
    state.books = [
      {id:'b1', pet:'tt', svc:'g1', date:'2026-10-05', time:'08:30', end:'09:30', fee:600, status:'booked', contract:'read', readVer:VER, readAt:'10/1（四）21:12', delivered:'9/30（三）19:05', fresh:false, code:'A9Z3'},
      {id:'h1', pet:'tt', svc:'g1', date:'2026-09-05', time:'10:00', end:'11:00', fee:600, status:'completed', contract:'signed', signedAt:'9/5（六）09:58', signedVer:'v2', code:'T4G6'}];
    state.idDone = 'A223456789'; state.marketing = false;
    if (LIFE === 'del-done') { state.books = []; state.stack = []; state.route = {n:'gone'}; }
    return;
  }
  if (SUSL) {
    state.sus = true; state.idDone = 'A123456789';
    Object.assign(book('b1'), {date:'2026-10-12', time:'14:00', end:'16:00', req:null, fee:1440, addon:['改期費・24 小時內改期', 240], addonIn:true, status:'completed', contract:'signed', signedAt:'10/12（一）13:57', signedVer:VER});
    Object.assign(book('b2'), {status:'completed', contract:'signed', signedAt:'10/17（六）13:58', signedVer:VER});
    state.books.unshift({id:'s1', pet:'mm', svc:'g2', date:'2026-11-21', time:'10:00', end:'12:00', fee:1200, status:'booked', contract:'read', readVer:VER, readAt:'11/14（六）21:05', delivered:'11/14（六）20:40', fresh:false, code:'P7S4'});
    return;
  }
  const b1 = book('b1');
  if (LCX) b1.req = null;
  if (RB) { state.idDone = 'A123456789';
    Object.assign(b1, {req:null, status:'cancelled', cxFee:240, cxNote:'你在 10/9（五）10:50 取消，店家 11:10 確認。24 小時內取消，收服務費 20%，由店家和你聯絡收取。'}); }
  if (LIFE === 'book') state.books = state.books.filter(b => b.id !== 'b1');
  if (LIFE === 'resched') b1.req = null;
  if (LIFE === 'reread' || LIFE === 'home') {
    Object.assign(b1, {date:'2026-10-12', time:'14:00', end:'16:00', req:null, fee:1440, addon:['改期費・24 小時內改期', 240], addonIn:true, delivered:'10/9（五）11:21'});
    state.idDone = 'A123456789';
  }
  if (LIFE === 'reread') Object.assign(b1, {contract:'unread', readVer:null, readAt:null});
  if (LIFE === 'home') { Object.assign(b1, {contract:'signed', signedAt:'10/12（一）13:57', signedVer:VER}); state.day = 5; }
  /* 王太太收不到簽署連結 (prototypes/sign-link): 寵派 sent the third link at 11:23; she opens it from LINE. The contract she read on
     10/8 was replaced when the shop changed the service at 22:10, so this version is unread; it arrived 10/8 22:10, so no timer. */
  if (LIFE === 'link-read') {
    Object.assign(b1, {req:null, contract:'unread', readVer:null, readAt:null, delivered:'10/8（四）22:10', fresh:false});
    state.idDone = 'A123456789'; state.authed = false; state.link = {bid:'b1', kind:'ok'}; state.gate = null;
    state.stack = []; state.route = {n:'gate'};
  }
  /* 一份契約的一生 (prototypes/contract-life): 毛孩日和 published 第 4 版 at 11:20 and LINE asked her to read it again. She read 第 3 版
     on 10/8, so it counts as unread; it reached her less than a day before tomorrow 10:00, so the reading is timed (即時審閱) */
  if (DOWN) Object.assign(book('b2'), {delivered:'10/9（五）11:00'});
  if (SV) state.books = state.books.filter(b => b.id !== 'b2');
  if (OFF) state.books.push({id:'b3', pet:'mm', svc:'f1', date:OFF_DAY, time:'10:00', end:'12:00', fee:1500, status:'booked', contract:'read', readVer:VER, readAt:'10/5（一）21:40',
    delivered:'10/5（一）21:30', fresh:false, code:'H6Q3', ask:{why:'10/22（四）臨時公休・員工訓練', at:'10/9（五）11:25'}});
  if (LIFE === 'ct-reread') {
    Object.assign(GROOM, GROOM4);
    Object.assign(b1, {req:null, delivered:'10/9（五）11:20', fresh:true});
    state.idDone = 'A123456789';
  }
}

/* ---------- boot: deep links ?at=<jump>&shop=wangmiao&theme=dark&fs=2&sus=1&day=2&visit=first ---------- */
(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get('shop') in SHOPS) state.shop = q.get('shop');
  if (['light', 'dark'].includes(q.get('theme'))) state.theme = q.get('theme');
  if (['1.3', '2'].includes(q.get('fs'))) state.fs = q.get('fs');
  if (q.get('visit') === 'first') state.visit = 'first';
  state.sus = q.get('sus') === '1';
  applyShop(); applyTheme(); seed(); syncProtoH();
  const at = q.get('at');
  if (q.has('day')) state.day = Math.max(-1, Math.min(5, +q.get('day')));
  const dayClears = () => { if (state.day >= 0) { const b = book('b1'); if (b) b.req = null; } };   /* on the service day (10/10) the 10/12 request is no longer pending, as in setDay */
  if (at && JUMPS.some(j => j[0] === at)) { const d = state.day; jump(at);
    if (at === 'pet' && SVCS.some(s => s.id === q.get('svc') && !s.off)) { Object.assign(state.bk, {svc:q.get('svc')}); if (/^\d{4}-\d\d-\d\d$/.test(q.get('date') || '') && /^\d\d:\d\d$/.test(q.get('time') || '')) Object.assign(state.bk, {date:q.get('date'), time:q.get('time'), handoff:true}); render({nav:true}); } if (q.has('day')) { state.day = d; dayClears(); syncProto(); render({nav:true}); } return; }
  dayClears();
  if (LIFE) lifeSeed();
  state.loading = q.get('skeleton') === '1';
  syncProto(); render({nav:true});
  if (state.loading) setTimeout(() => { state.loading = false; render({nav:true}); }, 1400);
})();
