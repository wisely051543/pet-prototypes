<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寵派後台登入原型</title>
<script src="../test-kit/kit.js" data-proto="platform-login"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232E211B%22/%3E%3Cg fill=%22%23F6EFE7%22%3E%3Ccircle cx=%227.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Ccircle cx=%2210.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2213.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2216.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Cpath d=%22M8.5 16c0-2.2 1.6-4 3.5-4s3.5 1.8 3.5 4c0 1.7-1.6 2-3.5 2s-3.5-.3-3.5-2Z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/Huninn-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 暖心生活 App world. Staff tokens, fields, buttons, notice, toast, the step trace and the prototype strip copied from prototypes/merchant-login;
   the 寵派後台 banner and sidebar (eleven modules, five groups, who sees what) from prototypes/support-console and prototypes/system-settings;
   the QR encoder from prototypes/m07-contract-templates. No new color tokens. Status colors are the fixed set shared by every surface. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--surface:#FFFFFF;--surface-2:#FBF6F0;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;
  --ink:#2B211C;--ink-muted:#6E6058;--border:#EADFD3;--control-border:#9A8878;--track:#E6D9CC;
  --act:#FF6B3D;--act-hover:#FF7E55;--on-act:#2B160C;--act-tint:#FFE5DA;--act-ink:#B5431A;
  --rail:#2E211B;--rail-edge:transparent;--rail-ink:#DCCDC0;--rail-hover:#45352C;--rail-cur:#F6EFE7;--rail-cur-ink:#2B211C;
  --focus:#2B211C;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;--border-danger:#E9A9A3;--danger-tint:#FFF1EE;
  --toast:#2E211B;--on-toast:#FFFFFF;--scrim:#2B211C8C;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --sidew:15rem;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
  --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
  --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
  --focus:#F6EDE6;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
  --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
    --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
    --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
    --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
    --focus:#F6EDE6;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
    --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:56px;scroll-padding-bottom:180px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:.9375rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
::selection{background:var(--act-tint);color:var(--ink)}
input,textarea{caret-color:var(--act-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--control-border) transparent}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}

/* ---------- prototype strip (not product UI) ---------- */
.proto{background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;display:flex;align-items:center;gap:6px 16px;padding:6px 16px;overflow-x:auto;white-space:nowrap;min-height:44px}
.proto b{font-weight:700}
.proto .muted{color:var(--proto-muted)}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select{background:transparent;border:1px solid var(--proto-line);border-radius:8px;padding:4px 8px;min-height:32px;color:var(--proto-ink)}
.proto select option{color:#2B211C;background:#fff}
.proto input[type=checkbox]{width:16px;height:16px;accent-color:var(--proto-ink)}
.proto :focus-visible{outline-color:var(--proto-ink)}
.pbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;border:1px dashed var(--proto-line);background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;font-weight:700}
.pbtn:hover{border-style:solid}
.pbtn .tag{font-size:.75rem;color:var(--proto-muted)}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:var(--r-md);font-size:1rem;font-weight:700;line-height:1.3;text-align:center;border:1.5px solid transparent;transition:transform .35s var(--spring),background-color .2s var(--out),box-shadow .2s var(--out)}
.btn:active:not([aria-disabled="true"]){transform:scale(.96);transition-duration:.08s}
.btn.primary{background:var(--act);color:var(--on-act);font-weight:800;box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,var(--lift)}
.btn.primary:hover{background:var(--act-hover)}
.btn.secondary{background:var(--sunk);color:var(--ink)}
.btn.secondary:hover{background:var(--sunk-hover)}
.btn.wide{width:100%}
.btn[aria-disabled="true"]{background:transparent;color:var(--ink-muted);cursor:not-allowed;border:1.5px dashed var(--control-border);box-shadow:none}
.textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;color:var(--ink);background:var(--sunk);font-weight:800;font-size:.875rem;border-radius:999px;transition:background-color .2s var(--out),transform .35s var(--spring)}
.textbtn:hover{background:var(--sunk-hover)}
.textbtn:active{transform:scale(.96);transition-duration:.08s}
.lnk{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px;margin:0 -6px;border-radius:999px;color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.lnk:hover{background:var(--sunk)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;color:var(--ink-muted);font-weight:800;border-radius:999px}
.back:hover{color:var(--ink);background:var(--sunk)}
.reason{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-muted);margin-top:6px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.9375rem;font-weight:800}
.field input{width:100%;min-height:52px;border:1.5px solid var(--control-border);border-radius:var(--r-md);background:var(--surface);padding:10px 14px;font-size:1.0625rem;font-weight:600}
.field input:hover{border-color:var(--ink)}
.field input::placeholder{color:var(--ink-muted);font-weight:500}
.field input[aria-invalid="true"]{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.field .err{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:800;color:var(--danger)}
.field .hint{font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.pw{position:relative}
.pw input{padding-right:56px}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--ink-muted)}
.pw .eye:hover{color:var(--ink);background:var(--sunk)}
.code input{font-family:"Nunito",var(--font);font-size:1.5rem;font-weight:800;letter-spacing:.3em;text-align:center}
.code.bk input{font-family:var(--mono);font-size:1.25rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:.9375rem;font-weight:600;line-height:1.5}
.notice b{display:block;font-weight:900}
.notice .ico{flex:none;margin-top:2px}
.notice>span{flex:1;min-width:0}
.notice.warning{background:var(--warning-bg);color:var(--warning)}
.notice.danger{background:var(--danger-bg);color:var(--danger)}
.notice.neutral{background:var(--neutral-bg);color:var(--neutral)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.success{background:var(--success-bg);color:var(--success)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;min-height:52px;max-width:min(520px,calc(100vw - 32px));padding:10px 18px;border-radius:var(--r-lg);background:var(--toast);color:var(--on-toast);box-shadow:var(--lift-hi);font-size:.9375rem;font-weight:700;animation:rise .35s var(--out)}
#app:not(.compact) ~ #layer .toast{left:calc(50% + var(--sidew) / 2)}
@keyframes rise{from{transform:translate(-50%,16px);opacity:0}}

/* ---------- shell: 寵派後台 with its lights off ----------
   The cocoa 「寵派內部」 banner and the eleven-module sidebar are the real 寵派後台 frame, drawn dim before sign-in.
   Signing in folds away what this role cannot open and lights the rest. */
#app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);grid-template-rows:auto 1fr;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
#app:not(.compact){background:linear-gradient(to right,var(--rail) var(--sidew),transparent 0)}
.ibar{grid-column:1 / -1;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 20px;background:var(--rail);color:var(--rail-cur);font-size:.8125rem;font-weight:800;box-shadow:inset 0 -1px 0 var(--rail-hover)}
.ibar .in{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;background:var(--rail-cur);color:var(--rail-cur-ink);font-weight:900}
.ibar .in .ico{width:15px;height:15px;stroke-width:2.2}
.ibar .ws{color:var(--rail-ink);font-weight:700}
.ibar .r{margin-left:auto;color:var(--rail-ink);font-weight:700;white-space:nowrap}
.side{grid-row:2;position:sticky;top:40px;height:calc(100vh - 84px);height:calc(100dvh - 84px);overflow:hidden;background:var(--rail);box-shadow:inset -1px 0 0 var(--rail-edge);display:flex;flex-direction:column;padding:18px 12px 16px;color:var(--rail-ink)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.mark{width:40px;height:40px;border-radius:14px;background:var(--rail-cur);color:var(--rail);display:grid;place-items:center;flex:none}
.mark .ico{width:24px;height:24px;stroke-width:0;fill:currentColor}
.brand b{display:block;color:var(--rail-cur);font-size:1rem;font-weight:900;line-height:1.3}
.ghost{display:flex;flex-direction:column}
.sgrp,.sitem{overflow:hidden;max-height:44px}
.sgrp{font-size:.75rem;font-weight:800;letter-spacing:.04em;padding:10px 12px 4px;color:var(--rail-ink);opacity:.82;max-height:34px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;margin-top:2px;padding:8px 12px;border-radius:12px;font-size:.9375rem;font-weight:700;line-height:1.3;color:var(--rail-ink)}
.sitem.cur{background:var(--rail-cur);color:var(--rail-cur-ink);font-weight:900}
/* lights off: the whole menu is there, dim and inert */
.side.dark .ghost .sgrp,.side.dark .ghost .sitem{opacity:.26}
.side.dark .brand b{opacity:.55}
.side.dark .ghost .sitem.peek{opacity:.72;transition:opacity .4s var(--out)}
.side .lit{opacity:1 !important;transition:opacity .28s var(--out),background-color .3s var(--out),color .3s var(--out)}
/* a module this role cannot open folds out of the menu instead of greying */
.side .fold{max-height:0 !important;min-height:0 !important;margin-top:0 !important;padding-top:0 !important;padding-bottom:0 !important;opacity:0 !important;transition:opacity .14s var(--out),max-height .3s var(--out) .12s,min-height .3s var(--out) .12s,padding .3s var(--out) .12s,margin .3s var(--out) .12s}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--rail-hover);font-size:.8125rem;font-weight:700;line-height:1.45;color:var(--rail-ink)}
.side-foot b{display:block;color:var(--rail-cur);font-weight:800}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--rail-hover);color:var(--rail-cur);display:grid;place-items:center;font-weight:900;flex:none}
.me small{display:block;font-size:.75rem;font-weight:700;line-height:1.3}
main{grid-row:2;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}

/* ---------- the sheet ---------- */
.page{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 32px 56px}
.fsheet{width:100%;max-width:460px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--lift);padding:34px 36px 30px}
.fsheet.wide{max-width:560px}
.fsheet.wider{max-width:640px}
.fsheet h1{font-size:1.75rem;font-weight:900;line-height:1.25;text-wrap:balance}
.lede{margin-top:6px;font-size:.9375rem;font-weight:600;color:var(--ink-muted);text-wrap:pretty}
.fsheet form,.stack{display:flex;flex-direction:column;gap:18px;margin-top:24px}
.alts{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:-2px}
.fine{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:.875rem;font-weight:600;color:var(--ink-muted);text-wrap:pretty}
.fine p+p{margin-top:6px}
.fine .lnk{font-size:.875rem;min-height:32px}
.fine .row{display:flex;gap:8px;align-items:flex-start}
.fine .row .ico{margin-top:2px;color:var(--ink-muted)}
.back-row{width:100%;max-width:460px;margin:0 auto 8px}
.back-row.wide{max-width:560px}
.back-row.wider{max-width:640px}
.rules{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.rules li{display:flex;align-items:center;gap:6px}
.rules li .ico{width:16px;height:16px;stroke-width:2.4}
.rules li.met{color:var(--success)}
.rules li.miss{color:var(--danger)}
.rules li.idle .ico{stroke:var(--control-border)}
.who-line{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border)}
.who-line .av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:900;flex:none}
.who-line>span:nth-child(2){min-width:0}
.who-line b{display:block;font-weight:900}
.who-line span span{display:block;font-size:.8125rem;font-weight:700;color:var(--ink-muted);overflow-wrap:anywhere}
.who-line .lnk{margin-left:auto;font-size:.875rem;flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:20px;padding:16px 18px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border)}
.facts dt{font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.facts dd{font-weight:800;margin:0;overflow-wrap:anywhere}
.facts dd small{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.9375rem;font-weight:700;line-height:1.5;cursor:pointer}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--ink);flex:none}
.check[aria-invalid="true"] span{color:var(--danger)}
.big-ico{width:72px;height:72px;border-radius:50%;background:var(--sunk);color:var(--ink-muted);display:grid;place-items:center;margin-bottom:16px}
.big-ico .ico{width:32px;height:32px}
.big-ico.ok{background:var(--success-bg);color:var(--success)}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.app-hint{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--sunk);font-size:.875rem;font-weight:700;line-height:1.45}
.app-hint .tile{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--lift)}

/* setup: named stops, done solid, current persimmon in an ink ring, ahead dashed (the 客服支援 trace vocabulary) */
.isteps{list-style:none;display:grid;grid-template-columns:repeat(var(--n,4),1fr);margin:0 0 22px}
.isteps li{position:relative;padding-top:22px;padding-right:6px;font-size:.8125rem;font-weight:800;line-height:1.35;color:var(--ink-muted)}
.isteps li::before{content:"";position:absolute;left:0;top:6px;width:13px;height:13px;border-radius:50%;border:2px dashed var(--control-border);background:var(--surface);z-index:1}
.isteps li::after{content:"";position:absolute;left:13px;right:0;top:12px;border-top:2px dashed var(--control-border)}
.isteps li:last-child::after{display:none}
.isteps li.done,.isteps li.cur{color:var(--ink)}
.isteps li.done::before{border:2px solid var(--ink);background:var(--ink)}
.isteps li.done::after{border-top:2px solid var(--ink)}
.isteps li.cur::before{border:2px solid var(--ink);background:var(--act)}

/* bind the app: the QR on a white tile beside the three moves */
.bind{display:grid;grid-template-columns:184px minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
.qrbox{width:184px;height:184px;border-radius:var(--r-lg);background:#FFFFFF;padding:8px;box-shadow:inset 0 0 0 1.5px var(--border),var(--lift)}
.qrbox svg{width:100%;height:100%;display:block}
.moves{list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:mv}
.moves li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:.9375rem;font-weight:700;line-height:1.45;counter-increment:mv}
.moves li::before{content:counter(mv);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:.8125rem;font-weight:900}
.moves small{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.bind.one{grid-template-columns:1fr;justify-items:center;margin-top:12px}
.bind .hint{font-size:.8125rem;font-weight:600;color:var(--ink-muted);text-align:center}
.secret{margin-top:4px;padding:14px 16px;border-radius:var(--r-md);background:var(--sunk);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.875rem;font-weight:700}
.secret dt{color:var(--ink-muted)}
.secret dd{margin:0;overflow-wrap:anywhere}
.secret .key{font-family:var(--mono);font-size:1rem;font-weight:700;letter-spacing:.08em;word-spacing:.2em;color:var(--ink)}

/* backup codes: a ledger shown once, each pair in system mono so 0/O and 1/I never blur */
.codes{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;margin-top:18px;padding:6px;border-radius:var(--r-lg);background:var(--sunk)}
.codes li{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--surface);font-family:var(--mono);font-size:1.0625rem;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.codes.anim li{animation:deal .4s var(--out) both}
@keyframes deal{from{opacity:0;transform:translateY(6px)}}
.codes-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.codes-acts .saved{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:800;color:var(--success)}
.codes-acts .saved:empty{display:none}
.ledger{list-style:none;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:20px;padding:5px;border-radius:var(--r-md);background:var(--sunk)}
.ledger li{position:relative;height:28px;border-radius:8px;background:var(--surface);border:1.5px solid var(--ink)}
.ledger li.used{background:transparent;border:1.5px dashed var(--control-border)}
.ledger li.used::after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.5px solid var(--ink-muted);transform:rotate(-24deg)}
.ledger li.now{border-color:var(--ink)}
.left-n{font-weight:900;font-size:1.125rem}

/* leaving: the sheet steps back while the menu sorts itself to the role */
.page.leave .fsheet,.page.leave .back-row{opacity:0;transform:translateY(8px) scale(.985);transition:opacity .3s var(--out),transform .3s var(--out)}
.landing{position:fixed;left:calc(var(--sidew) + 50% - var(--sidew) / 2);top:50%;transform:translate(-50%,-50%);font-size:1rem;font-weight:800;color:var(--ink-muted);display:flex;align-items:center;gap:10px;animation:fade .3s var(--out) .5s both}
@keyframes fade{from{opacity:0}}

/* ---------- compact: no room for the sidebar, the 寵派後台 top bar stands in ---------- */
#app.compact{display:block;background:none}
#app.compact .ibar{position:static;padding:0 16px}
#app.compact .ibar .ws{display:none}
#app.compact .side{display:none}
#app.compact .topbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:var(--rail);color:var(--rail-cur)}
#app.compact .topbar .mark{width:36px;height:36px;border-radius:12px}
#app.compact .topbar b{font-weight:900}
#app.compact .page{justify-content:flex-start;padding:16px 16px 40px}
#app.compact .fsheet{padding:24px 20px 22px}
#app.compact .fsheet h1{font-size:1.5rem}
#app.compact .landing{left:50%}
@media (max-width: 560px){
  .bind{grid-template-columns:1fr;justify-items:center}
  .moves{justify-self:stretch}
  .isteps li{font-size:.75rem}
  .facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:8px}
  .codes li{font-size:.9375rem;letter-spacing:.08em}
  .who-line{flex-wrap:wrap}.who-line .lnk{margin-left:52px}
}
.bigtext .fsheet,.bigtext .back-row{max-width:680px}
.bigtext .codes{grid-template-columns:1fr}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}}
/* touch: DESIGN.md touch-target is 44px; mouse density stays as drawn */
@media (pointer: coarse){.fine .lnk{position:relative}.fine .lnk::before{content:"";position:absolute;inset:-6px 0}}

const QRV = [null, [16, 10, 1], [28, 16, 1], [44, 26, 1], [32, 18, 2], [43, 24, 2], [27, 16, 4]];

    let run = 1; for (let j = 1; j <= n; j++) { if (j < n && row[j] === row[j - 1]) run++; else { if (run >= 5) s += run - 2; run = 1; } }
    const str = row.map(v => v ? 1 : 0).join(''); for (const pat of ['10111010000', '00001011101']) { let k = str.indexOf(pat); while (k !== -1) { s += 40; k = str.indexOf(pat, k + 1); } } } return s; };
  p += lines((i, j) => G[i][j]) + lines((i, j) => G[j][i]);
  for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) { const c = G[y][x]; if (c === G[y][x + 1] && c === G[y + 1][x] && c === G[y + 1][x + 1]) p += 3; }

/* ---------- render ---------- */
function render(focusId) {
  const app = $('app');
  state.compact = innerWidth < 1024;
  app.className = state.compact ? 'compact' : '';
  const v = state.view;
  const page = v === 'login' ? loginView() : v === 'mfa' ? mfaView() : v === 'backup' ? backupView() : v === 'bkok' ? backupOkView()
    : v === 'forgot' ? forgotView() : v === 'setup' ? setupView() : deadLinkView();
  app.innerHTML = `${ibar()}${sideNav()}<main>${topbar()}${page}</main>`;
  const f = focusId && document.getElementById(focusId);

}
function say(text) {
  clearTimeout(say.t);
  const l = $('layer'); l.querySelector('.toast')?.remove();
  l.insertAdjacentHTML('beforeend', `<div class="toast" role="status" data-key="toast">${esc(text)}</div>`);
  say.t = setTimeout(() => l.querySelector('.toast')?.remove(), 3600);
}

/* ---------- the one authored moment ----------
   What this role cannot open folds out of the menu, one module at a time; then what is left comes on top to bottom,
   the module this person opens first lifts into the current pill, and the page opens. */
function land() {
  const p = byId(state.who), [nav, page, dir] = HOME[p.role], href = `../${dir}/index.html?role=${p.role}`;
  state.leaving = {nav, page};
  if (params.get('stay') === '1') { state.leaving.sorted = true; render(); say(`會開啟${page}`); return; }
  if (calm() || state.compact) { location.href = href; return; }
  document.querySelector('.page')?.classList.add('leave');
  setTimeout(() => {
    const keep = document.querySelector('.page');
    $('app').querySelector('.side').outerHTML = sideNav();
    const side = $('app').querySelector('.side');
    side.classList.add('dark');
    const out = markRole(p.role);
    out.forEach((el, i) => setTimeout(() => el.classList.add('fold'), 34 * i));
    const stay = [...side.querySelectorAll('.brand b, .sgrp, .sitem')].filter(el => !out.includes(el));
    const t0 = 34 * out.length + 160;
    stay.forEach((el, i) => setTimeout(() => el.classList.add('lit'), t0 + 30 * i));
    keep.insertAdjacentHTML('afterend', `<p class="landing" role="status">${ic('fwd','sm')}正在開啟${page}</p>`);
    setTimeout(() => { location.href = href; }, t0 + 30 * stay.length + 520);
  }, 160);
}
/* which menu rows leave for this role: its closed modules, then any group left empty */
function markRole(role) {
  const side = $('app').querySelector('.side'), out = [];
  side.querySelectorAll('.sitem').forEach(el => { if (!el.dataset.roles.split(' ').includes(role)) out.push(el); });
  side.querySelectorAll('.sgrp').forEach(g => {
    let n = g.nextElementSibling, any = false;
    while (n && n.classList.contains('sitem')) { if (!out.includes(n)) any = true; n = n.nextElementSibling; }
    if (!any) out.push(g);
  });
  out.sort((a, b) => a.compareDocumentPosition(b) & 4 ? -1 : 1);
  return out;
}

/* ---------- submit handlers ---------- */
function mailErr(v) {
  const s = String(v || '').trim().toLowerCase();
  if (!s) return '請輸入公司 Email';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)) return 'Email 格式不對';
  if (!s.endsWith('@' + DOMAIN)) return `請用寵派公司 Email（@${DOMAIN}）；店家帳號請到寵派商家中心登入`;
  return '';
}
function submitLogin() {
  const f = state.f; f.mail = $('lg-mail').value; f.pw = $('lg-pw').value; f.err = {}; f.top = null;
  const me = mailErr(f.mail); if (me) f.err.mail = me;
  if (!f.pw) f.err.pw = '請輸入密碼';
  if (f.err.mail || f.err.pw) return render(f.err.mail ? 'lg-mail' : 'lg-pw');
  if (state.offline) { f.top = ['neutral', '連不上網路', '登入需要連線。請確認網路後再試，已輸入的 Email 會留著。']; return render('f-top'); }
  const p = byMail(f.mail);
  /* an account still waiting for setup has no password yet: it reads like any wrong pair, so the page never says which Emails exist */
  if (!p || p.st === 'pend' || f.pw !== PASS) {
    f.tries++; f.pw = '';
    if (f.tries >= TRIES) { f.lockUntil = Date.now() + 15 * 60 * 1000; f.top = ['warning', '錯太多次，先暫停 15 分鐘', '這是為了保護帳號；這幾次嘗試已記在稽核中心。忘記密碼可以用 Email 重設。']; return render('f-top'); }
    f.top = ['danger', 'Email 或密碼不正確', f.tries >= 3 ? `再錯 ${TRIES - f.tries} 次要等 15 分鐘。` : '請再檢查一次。'];
    return render('lg-pw');
  }
  if (p.st === 'off') { f.top = ['danger', '這個帳號已停用', `${esc(p.by)}在 ${esc(p.offAt)} 停用了這個帳號，所有裝置都已登出。有問題請聯絡${esc(p.by)}。`, 'ban']; f.pw = ''; return render('f-top'); }
  f.tries = 0;
  state.view = 'mfa'; state.f = newForm({id:p.id, mail:f.mail}); render('mf-code');
}
function checkTotp(f, key) {
  f.code = String($(key).value || '').replace(/\D/g, ''); delete f.err.code; f.top = null;
  if (f.code.length !== 6) { f.err.code = '驗證碼是 6 位數字'; render(key); return false; }
  if (f.code !== TOTP) {
    f.codeTries++; f.code = '';
    if (f.codeTries >= TRIES) { f.lockUntil = Date.now() + 15 * 60 * 1000; f.top = ['warning', '錯太多次，先暫停 15 分鐘', '這幾次嘗試已記在稽核中心。手機的時間要設成自動，App 上的數字才會對。']; render('f-top'); return false; }
    f.err.code = `驗證碼不對，請輸入 App 上最新的 6 位數（還能試 ${TRIES - f.codeTries} 次）`;
    render(key); return false;
  }
  return true;
}
function submitMfa() {
  const f = state.f;
  if (state.offline) { f.top = ['neutral', '連不上網路', '驗證需要連線。']; return render('f-top'); }
  if (!checkTotp(f, 'mf-code')) return;
  state.who = f.id; land();
}
function submitBackup() {
  const f = state.f, p = byId(f.id);
  const raw = String($('bk-code').value || '').toUpperCase(), c = raw.replace(/[^A-Z0-9]/g, '');
  f.code = raw; delete f.err.code; f.top = null;
  if (c.length !== 8) { f.err.code = '備用碼是 8 個英文字母或數字，例：K7Q2-M9DF'; return render('bk-code'); }
  if (state.offline) { f.top = ['neutral', '連不上網路', '驗證需要連線。']; return render('f-top'); }
  if (c === BACKUP && state.used[p.id]) { f.err.code = '這組備用碼已經用過了，請換一組'; return render('bk-code'); }
  if (c !== BACKUP) {
    f.codeTries++;
    if (f.codeTries >= TRIES) { f.lockUntil = Date.now() + 15 * 60 * 1000; f.top = ['warning', '錯太多次，先暫停 15 分鐘', '這幾次嘗試已記在稽核中心。']; return render('f-top'); }
    f.err.code = `不是你的備用碼，或已經用過（還能試 ${TRIES - f.codeTries} 次）`; return render('bk-code');
  }
  state.used[p.id] = true; p.left = Math.max(0, p.left - 1); state.who = p.id; state.view = 'bkok'; render('f-title');
}
function submitForgot() {
  const f = state.f; f.err = {}; f.top = null;
  if (f.step === 1) {
    f.mail = $('fp-mail').value; const me = mailErr(f.mail); if (me) { f.err.mail = me; return render('fp-mail'); }
    if (state.offline) { f.top = ['neutral', '連不上網路', '寄出重設連結需要連線。']; return render('f-top'); }
    f.step = 2; return render('f-title');
  }
  f.npw = $('fp-npw').value; const p = byId(f.id);
  if (!pwOk(f.npw, p.u)) { f.err.npw = '新密碼還不符合上面的規則'; return render('fp-npw'); }
  if (f.npw === PASS) { f.err.npw = '不能和舊密碼一樣'; return render('fp-npw'); }
  if (!checkTotp(f, 'fp-code')) return;
  state.view = 'login'; state.f = newForm({mail:mailOf(p)}); render('lg-pw'); say('密碼已更新，其他裝置都已登出；請用新密碼登入');
}
function submitSetup(kind) {
  const f = state.f, L = LINKS[f.link], p = byId(L.id); f.err = {}; f.top = null;
  const next = focus => { f.step++; f.show = false; f.code = ''; f.codeTries = 0; render(focus || 'f-title'); };
  if (kind === 'su-pw-check') {
    f.pw = $('su-cur').value;
    if (!f.pw) { f.err.pw = '請輸入現在的密碼'; return render('su-cur'); }
    if (state.offline) { f.top = ['neutral', '連不上網路', '綁定需要連線。']; return render('f-top'); }
    if (f.pw !== PASS) { f.pw = ''; f.err.pw = '密碼不對；忘記了，請先到登入頁用 Email 重設'; return render('su-cur'); }
    f.pw = ''; return next();
  }
  if (kind === 'su-pw') {
    f.npw = $('su-npw').value;
    if (!pwOk(f.npw, p.u)) { f.err.npw = '密碼還不符合上面的規則'; return render('su-npw'); }
    return next();
  }
  if (kind === 'su-bind') {
    if (state.offline) { f.top = ['neutral', '連不上網路', '綁定需要連線；App 裡那一組先留著，恢復連線後再輸入一次。']; return render('f-top'); }
    if (!checkTotp(f, 'su-code')) { if (f.err.code) f.err.code = f.err.code.replace('請輸入 App 上最新的 6 位數', '請確認手機時間設為自動，再輸入 App 上最新的 6 位數'); render('su-code'); return; }
    f.boundAt = hm(new Date()); return next();
  }
  if (kind === 'su-codes') {
    f.ok = $('su-ok').checked;
    if (!f.ok) { f.err.ok = '請先存好備用碼，再勾選這一項'; return render('su-ok'); }
    if (state.offline) { f.top = ['neutral', '連不上網路', '完成設定需要連線。']; return render('f-top'); }
    p.st = 'on'; p.left = 10; state.who = p.id; return next();
  }
}

/* ---------- actions ---------- */
function savedNote(t) { state.f.saved = t; const el = document.querySelector('[data-key="su-saved"]'); if (el) el.innerHTML = `${ic('check','sm')}${esc(t)}`; }
const ACT = {
  toForgot() { const mail = $('lg-mail')?.value || ''; state.view = 'forgot'; state.f = newForm({mail}); render('f-title'); },
  toLogin(el) { const mail = el?.dataset?.keep ? state.f?.mail || '' : ''; state.view = 'login'; state.f = newForm({mail}); render(mail ? 'lg-pw' : 'f-title'); },
  toLoginWith(el) { state.view = 'login'; state.f = newForm({mail:el.dataset.mail}); render('lg-pw'); },
  toBackup() { const id = state.f.id; state.view = 'backup'; state.f = newForm({id, mail:state.f.mail}); render('bk-code'); },
  toMfa() { const id = state.f.id; state.view = 'mfa'; state.f = newForm({id, mail:state.f.mail}); render('mf-code'); },
  toggleShow() {
    const f = state.f;
    [['lg-mail','mail'],['lg-pw','pw'],['fp-npw','npw'],['su-npw','npw'],['su-cur','pw']].forEach(([id, k]) => { const el = $(id); if (el) f[k] = el.value; });
    f.show = !f.show; const k = document.activeElement?.dataset?.key; render(); if (k) document.querySelector(`[data-key="${k}"]`)?.focus();
  },
  openReset() {
    const f = state.f, p = byMail(f.mail);
    if (!p || p.st !== 'on') { say('（原型）這個 Email 沒有可以重設的帳號，實際上不會收到信'); return; }
    f.step = 3; f.id = p.id; f.npw = ''; f.code = ''; f.show = false; render('f-title');
  },
  suStart() { const f = state.f; if (state.offline) { f.top = ['neutral', '連不上網路', '設定帳號需要連線。']; return render('f-top'); } f.notMe = false; f.step = 2; render('f-title'); },
  suNotMe() { state.f.notMe = true; render('su-notme-note'); },
  showQr() { state.f.showQr = true; render(); document.querySelector('[data-key="su-qr"]')?.scrollIntoView({block:'nearest'}); },
  showKey() { state.f.showKey = true; render(); document.querySelector('[data-key="su-secret"]')?.scrollIntoView({block:'nearest'}); $('su-code')?.focus({preventScroll:true}); },
  dlCodes() {
    const p = byId(LINKS[state.f.link].id);
    const txt = `寵派管理後台 備用碼\n帳號：${mailOf(p)}\n產生時間：2026/${TODAY} ${hm(new Date())}\n每組只能用一次。\n\n${NEW_CODES.join('\n')}\n`;
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'})); a.download = '寵派管理後台-備用碼.txt'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
    savedNote('已下載文字檔');
  },
  copyCodes() {
    const done = () => savedNote('已複製；貼到密碼管理工具後，記得清掉剪貼簿');
    try { navigator.clipboard.writeText(NEW_CODES.join('\n')).then(done, done); } catch (e) { done(); }
  },
  enter() { land(); },
  land
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-do]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  e.preventDefault(); ACT[el.dataset.do]?.(el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const k = e.target.dataset.form;
  if (k === 'login') submitLogin(); else if (k === 'mfa') submitMfa(); else if (k === 'backup') submitBackup(); else if (k === 'forgot') submitForgot(); else submitSetup(k);
});
document.addEventListener('input', e => {
  const f = state.f; if (!f) return;
  const t = e.target;
  if (['mf-code', 'su-code', 'fp-code'].includes(t.id)) t.value = t.value.replace(/\D/g, '').slice(0, 6);
  if (t.id === 'su-ok') f.ok = t.checked;
  if (t.id === 'fp-npw' || t.id === 'su-npw') {
    f.npw = t.value; const u = t.id === 'su-npw' ? byId(LINKS[f.link].id).u : byId(f.id).u;
    const r = document.querySelector('.rules'); if (r) r.outerHTML = rulesHtml(f.npw, u, false);
  }
});
addEventListener('resize', () => { clearTimeout(render.r); render.r = setTimeout(() => { if (!state.leaving) { const k = document.activeElement?.dataset?.key; render(); if (k) document.querySelector(`[data-key="${k}"]`)?.focus(); } }, 120); });

/* ---------- prototype controls ---------- */
function setTheme(v) { v ? document.documentElement.setAttribute('data-theme', v) : document.documentElement.removeAttribute('data-theme'); }
function applyScale(s) { document.documentElement.style.fontSize = s > 1 ? s * 100 + '%' : ''; document.documentElement.classList.toggle('bigtext', s >= 1.3); }
const GOS = ['login', 'setup', 'reset', 'link-expired', 'link-used'];
$('p-go').value = GOS.includes(params.get('go')) ? params.get('go') : 'login';
$('p-off').checked = state.offline = params.get('off') === '1';
$('p-theme').value = params.get('theme') || ''; setTheme($('p-theme').value);
$('p-scale').value = ['1.3', '2'].includes(params.get('scale')) ? params.get('scale') : '1'; applyScale(+$('p-scale').value);
$('p-go').onchange = e => { load(e.target.value); render('f-title'); };
$('p-off').onchange = e => { state.offline = e.target.checked; };
$('p-theme').onchange = e => setTheme(e.target.value);
$('p-scale').onchange = e => { applyScale(+e.target.value); render(); };
load($('p-go').value);
render();
setInterval(() => { const r = document.querySelector('.ibar .r'); if (r) r.textContent = `${TODAY} ${hm(new Date())}`; }, 20000);
</script>
