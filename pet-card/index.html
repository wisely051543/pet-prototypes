<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寵物卡原型</title>
<script src="../test-kit/kit.js" data-proto="pet-card"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232E211B%22/%3E%3Cg fill=%22%23F6EFE7%22%3E%3Ccircle cx=%227.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Ccircle cx=%2210.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2213.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2216.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Cpath d=%22M8.5 16c0-2.2 1.6-4 3.5-4s3.5 1.8 3.5 4c0 1.7-1.6 2-3.5 2s-3.5-.3-3.5-2Z%22/%3E%3C/g%3E%3C/svg%3E">

<style>
/* 暖心生活 App world, staff tokens copied from the today board. Status colors are the fixed set shared by every surface and shop. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--surface:#FFFFFF;--surface-2:#FBF6F0;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;
  --ink:#2B211C;--ink-muted:#6E6058;--border:#EADFD3;--control-border:#9A8878;--track:#E6D9CC;
  --act:#FF6B3D;--act-hover:#FF7E55;--on-act:#2B160C;--act-tint:#FFE5DA;--act-ink:#B5431A;
  --rail:#2E211B;--rail-edge:transparent;--rail-ink:#DCCDC0;--rail-hover:#45352C;--rail-cur:#F6EFE7;--rail-cur-ink:#2B211C;
  --focus:#2B211C;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;--border-danger:#E9A9A3;--danger-tint:#FFF1EE;
  --toast:#2E211B;--on-toast:#FFFFFF;--scrim:#2B211C8C;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --lift-up:0 -12px 28px -16px rgb(74 44 26 / .35);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --railw:5.25rem;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
  --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
  --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
  --focus:#F6EDE6;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
  --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
    --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
    --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
    --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
    --focus:#F6EDE6;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
    --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px;scroll-padding-bottom:180px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:.9375rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
::selection{background:var(--act-tint);color:var(--ink)}
input,textarea{caret-color:var(--act-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--control-border) transparent}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:24px;height:24px}

/* ---------- prototype strip (not product UI) ---------- */
.proto{background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;display:flex;align-items:center;gap:6px 16px;padding:6px 16px;overflow-x:auto;white-space:nowrap;min-height:44px}
.proto b{font-weight:700}
.proto .muted{color:var(--proto-muted)}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select{background:transparent;border:1px solid var(--proto-line);border-radius:8px;padding:4px 8px;min-height:32px;color:var(--proto-ink)}
.proto select option{color:#2B211C;background:#fff}
.proto input[type=checkbox]{width:16px;height:16px;accent-color:var(--proto-ink)}
.proto :focus-visible{outline-color:var(--proto-ink)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
#app:not(.phone){background:linear-gradient(to right,var(--rail) var(--railw),transparent 0)}
#app.phone{display:block;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--rail);box-shadow:inset -1px 0 0 var(--rail-edge);display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}
.mark{width:44px;height:44px;border-radius:14px;background:var(--rail-cur);color:var(--rail);display:grid;place-items:center;margin-bottom:14px}
.mark .ico{width:26px;height:26px;stroke-width:0;fill:currentColor}
.rail-item{width:4rem;min-height:3.75rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--rail-ink);font-size:.75rem;font-weight:600;text-align:center;line-height:1.25;padding:6px 0;transition:background-color .2s var(--out)}
.rail-item:hover{color:var(--rail-cur);background:var(--rail-hover)}
.rail-item[aria-current="page"]{background:var(--rail-cur);color:var(--rail-cur-ink);font-weight:800;--cut:var(--rail-cur)}
.rail :focus-visible{outline-color:var(--rail-cur)}
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;background:var(--rail);display:grid;grid-template-columns:repeat(4,1fr);border-radius:var(--r-lg);padding:6px;box-shadow:var(--lift-hi)}
.bnav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:.75rem;font-weight:600;line-height:1.2;text-align:center;color:var(--rail-ink);border-radius:16px}
.bnav button[aria-current="page"]{color:var(--rail-cur-ink);background:var(--rail-cur);font-weight:800;--cut:var(--rail-cur)}
.bnav :focus-visible{outline-color:var(--rail-cur);outline-offset:-3px}
main{min-width:0}

/* ---------- buttons, chips, tags ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:var(--r-md);font-size:.9375rem;font-weight:700;line-height:1.3;text-align:center;border:1.5px solid transparent;transition:transform .35s var(--spring),background-color .2s var(--out),box-shadow .2s var(--out)}
.btn:active:not([aria-disabled="true"]){transform:scale(.96);transition-duration:.08s}
.btn.primary{background:var(--act);color:var(--on-act);font-weight:800;box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,var(--lift)}
.btn.primary:hover{background:var(--act-hover)}
.btn.secondary{background:var(--sunk);color:var(--ink)}
.btn.secondary:hover{background:var(--sunk-hover)}
.btn[aria-disabled="true"]{background:transparent;color:var(--ink-muted);cursor:not-allowed;border:1.5px dashed var(--control-border);box-shadow:none}
.textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;color:var(--ink);background:var(--sunk);font-weight:800;font-size:.875rem;border-radius:999px;transition:background-color .2s var(--out),transform .35s var(--spring)}
.textbtn:hover{background:var(--sunk-hover)}
.textbtn:active{transform:scale(.96);transition-duration:.08s}
.textbtn[aria-disabled="true"]{color:var(--ink-muted);background:transparent;border:1.5px dashed var(--control-border);cursor:not-allowed}
.reason{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-muted);margin-top:6px;line-height:1.4}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;color:var(--ink-muted);font-weight:800;border-radius:999px}
.back:hover{color:var(--ink);background:var(--sunk)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;line-height:1.4;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.neutral{color:var(--neutral);background:var(--neutral-bg)}
.chip.warning{color:var(--warning);background:var(--warning-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip.success{color:var(--success);background:var(--success-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 12px 4px 9px;border-radius:999px;font-size:.875rem;line-height:1.4;white-space:nowrap}
.tag.safety{background:var(--danger-solid);color:var(--on-danger-solid);font-weight:800}
.tag.care{background:var(--warning-bg);color:var(--warning);font-weight:700}
.tag.finding{background:var(--warning-bg);color:var(--warning);font-weight:800;font-size:.8125rem;padding:2px 10px 2px 8px}

/* ---------- 臉環: the face is the pet, the ring is today's visit ---------- */
.face{--s:56px;position:relative;flex:none;width:var(--s);height:var(--s);display:inline-grid;place-items:center}
.face>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.face circle{fill:none;stroke:var(--track);stroke-width:7;stroke-linecap:round}
.face circle.done{stroke:var(--ink)}
.face circle.cur{stroke:var(--ink);stroke-width:9;stroke-dasharray:0 600;animation:seg .7s var(--out) .15s forwards}
@keyframes seg{to{stroke-dasharray:var(--dash) 600}}
.face img,.face .ini{width:calc(var(--s) * .74);height:calc(var(--s) * .74);border-radius:50%;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-weight:900;color:var(--ink-muted);font-size:calc(var(--s) * .3)}
.face.plain img,.face.plain .ini{width:calc(var(--s) * .86);height:calc(var(--s) * .86)}
.face .badge{position:absolute;right:-2px;bottom:-2px;width:calc(var(--s) * .3);height:calc(var(--s) * .3);min-width:22px;min-height:22px;border-radius:50%;display:grid;place-items:center;background:var(--danger-solid);color:var(--on-danger-solid);border:3px solid var(--surface)}
.face .badge .ico{width:62%;height:62%;stroke-width:2.4}
.face .step{position:absolute;left:0;bottom:0;padding:2px 9px;border-radius:999px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);font-size:.875rem;font-weight:900;line-height:1.25}

/* ---------- page ---------- */
.page{container:page / inline-size;padding:14px 28px 120px}
.phone .page{padding:8px 16px 160px}
.grid{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:20px;align-items:start;margin-top:8px}
@container page (max-width: 820px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (min-height: 860px){#app:not(.phone) .lcol{position:sticky;top:16px}}
.lcol,.rcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--lift)}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2{font-size:1.0625rem;font-weight:900;line-height:1.3;display:inline-flex;align-items:center;gap:8px}
.panel-h .aside{margin-left:auto;font-size:.8125rem;font-weight:700;color:var(--ink-muted)}
.cnt{min-width:26px;padding:1px 9px;border-radius:999px;background:var(--sunk);font-size:.8125rem;font-weight:800;text-align:center}
.cnt.hot{background:var(--danger-solid);color:var(--on-danger-solid)}

/* identity */
.who{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.who .face{--s:112px}
.phone .who .face{--s:88px}
.who h1{font-size:1.75rem;font-weight:900;line-height:1.2}
.phone .who h1{font-size:1.5rem}
.who .breed{display:block;margin-top:4px;font-size:.9375rem;font-weight:700;color:var(--ink-muted)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.facts b{color:var(--ink);font-weight:800}
.today-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:.9375rem;font-weight:700}
.today-line .t{font-weight:900}
.today-line .muted{color:var(--ink-muted);font-weight:600}

/* 注意事項 band: what the hands must know before touching the animal */
.band{padding:0;overflow:hidden}
.band .panel-h{padding:20px 22px 0;margin-bottom:12px}
.band .src{padding:0 22px;margin:-6px 0 12px;font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.safe-rows{background:var(--danger-tint);border-top:1px solid var(--border-danger);border-bottom:1px solid var(--border-danger);padding:6px 22px;list-style:none}
.care-rows{padding:6px 22px;list-style:none}
.nrow{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
.safe-rows .nrow{border-bottom-color:var(--border-danger)}
.nrow:last-child{border-bottom:0}
.nrow .tag{justify-self:start}
.nrow .say{font-size:1rem;font-weight:800;line-height:1.5;text-wrap:pretty;padding-top:2px}
.safe-rows .say{color:var(--danger)}
.nrow .say.quiet{font-weight:600;color:var(--ink-muted)}
.phone .nrow{grid-template-columns:minmax(0,1fr)}
.health{padding:14px 22px 6px}
.health h3,.internal h3{display:flex;align-items:center;gap:8px;font-size:.9375rem;font-weight:900;margin-bottom:8px}
.dl{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:8px 14px;font-size:.9375rem;font-weight:700}
.dl dt{color:var(--ink-muted);font-size:.875rem;font-weight:700;padding-top:1px}
.internal{padding:14px 22px 6px;font-size:.9375rem;font-weight:700}
.internal p{text-wrap:pretty}
.none{padding:16px 22px;font-size:.9375rem;font-weight:700;color:var(--ink-muted)}
/* masked: protected, not missing */
.masked{display:inline-flex;align-items:center;gap:6px;color:var(--ink-muted);font-size:.8125rem;font-weight:800}
.vnotes li.shut{background:transparent}
.vcheck .masked{margin-right:8px}
.vnotes li.shut small{margin-top:0}
/* the clerk's own explanation sits under the heading, before anything it explains */
.band .mask-note{margin:0 22px 12px}
.panel-h .maskcnt{font-size:.8125rem;font-weight:800;color:var(--ink-muted)}
/* safety tags ride in the identity card, so they are on the first screen at any text size */
.who-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tog[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.tog-note{margin:8px 0 0;font-size:.8125rem;font-weight:700;color:var(--ink-muted)}
.masked .ico{width:14px;height:14px;stroke-width:2.2}
.mask-note{display:flex;gap:8px;align-items:flex-start;margin:10px 22px 0;padding:10px 12px;border-radius:var(--r-md);background:var(--neutral-bg);color:var(--neutral);font-size:.8125rem;font-weight:700;line-height:1.5}
.mask-note .ico{margin-top:1px}
.band-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 22px 20px}
.band-foot .reason{margin:0;flex-basis:100%}
.band-foot .nolog{font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.missing{max-width:560px;margin:24px auto 0;padding:28px 24px}
.missing h1{font-size:1.375rem;font-weight:900;margin:0 0 6px}
.missing p{font-weight:600;color:var(--ink-muted);margin:0 0 18px;text-wrap:pretty}
.missing .acts{display:flex;flex-wrap:wrap;gap:10px}
.missing a.btn{text-decoration:none}

/* 修改紀錄 */
.log{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.log li{padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);font-size:.875rem;font-weight:600}
.log .lh{display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:800;margin-bottom:6px}
.log .lh .muted{color:var(--ink-muted);font-weight:700}
.log ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.log .chg{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.log .b{text-decoration:line-through;color:var(--ink-muted)}
.log .why{margin-top:6px;color:var(--ink-muted)}

/* 歷次來店 */
.visits{list-style:none;display:flex;flex-direction:column}
.visit{display:grid;grid-template-columns:4.25rem minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--border)}
.visit:first-child{border-top:0;padding-top:4px}
.vdate{text-align:left;line-height:1.15}
.vdate b{display:block;font-size:1.375rem;font-weight:900;letter-spacing:-.01em}
.vdate small{display:block;margin-top:4px;font-size:.8125rem;font-weight:700;color:var(--ink-muted)}
.vh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.vh .svc{font-size:1rem;font-weight:900}

.phone .visit:not(.today) .vdate{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.phone .visit:not(.today) .vdate b{display:inline;font-size:1.125rem}
.phone .visit:not(.today) .vdate small{display:inline;margin:0}
.visit.off .vh .svc{color:var(--ink-muted);font-weight:800}
.visit.off .vdate b{color:var(--ink-muted)}

.visit.today{grid-template-columns:minmax(0,1fr);margin:0 -10px 6px;padding:16px;border:0;border-radius:var(--r-lg);background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--border)}

.compose{display:flex;flex-direction:column;gap:10px;margin-top:12px}

    ? (state.offline ? `<button class="btn secondary" aria-disabled="true" aria-describedby="ed-r" data-key="edit">${ic('pen','sm')}修改注意事項</button><span class="reason" id="ed-r">修改注意事項需連線</span>`

    : `<span class="reason">注意事項由櫃台或店長修改。看到不對的地方，請告訴櫃台。</span>`;
  const logN = p.audit.length;
  return `<section class="panel band" aria-labelledby="h-band">
    <div class="panel-h"><h2 id="h-band">注意事項${n ? `<span class="cnt${p.safety.length ? ' hot' : ''}" aria-label="${n} 個標籤">${n}</span>` : ''}</h2>${sens ? '' : `<span class="maskcnt">${n ? `${n} 個標籤・` : ''}${p.safety.length + 3} 項已遮</span>`}</div>
    ${sens ? '' : `<p class="mask-note">${ic('lock','sm')}<span>櫃台看得到標籤和照護說明；攻擊性說明、病史、過敏、內部備註，以及每次來店的現況說明與服務備註會遮住。需要細節請找店長或美容照護人員。</span></p>`}
    <p class="src">${esc(p.src)}</p>
    ${safeRows ? `<ul class="safe-rows" aria-label="安全注意">${safeRows}</ul>` : ''}
    ${careRows ? `<ul class="care-rows" aria-label="照護需求">${careRows}</ul>` : ''}
    ${n ? '' : '<p class="none">這隻寵物沒有特別注意事項。</p>'}
    <div class="health"${n ? ' style="border-top:1px solid var(--border)"' : ''}><h3>${ic('heart','sm')}健康</h3><dl class="dl"><dt>疾病史</dt>${val('疾病史', p.ill)}<dt>過敏</dt>${val('過敏', p.allergy)}</dl></div>
    ${internal}
    <div class="band-foot">${foot}${logN ? `<button class="textbtn" data-key="log" data-do="toggleLog" aria-expanded="${state.logOpen}" aria-controls="log-l">${ic('clock','sm')}修改紀錄<span class="cnt">${logN}</span></button>` : '<span class="nolog" data-key="log-none">還沒有異動紀錄</span>'}</div>
    ${logN && state.logOpen ? `<div style="padding:0 22px 22px"><ul class="log" id="log-l">${p.audit.map(logRow).join('')}</ul></div>` : ''}
  </section>`;
}
function logRow(r) {
  const chg = c => {
    if (c.sens && !canSens()) return `<li class="chg">${esc(c.k)}已修改<span class="masked" style="padding:1px 8px">${ic('lock')}內容已遮罩</span></li>`;
    if (c.b === undefined) return `<li class="chg">${esc(c.k)}「${esc(c.a)}」</li>`;
    return `<li class="chg">${esc(c.k)}：${c.b ? `<span class="b">${esc(c.b)}</span><span aria-hidden="true">→</span>` : ''}<span>${esc(c.a || '（清空）')}</span></li>`;
  };
  return `<li><div class="lh"><span>${esc(r.at)}</span><span>${esc(r.by)}（${esc(r.role)}）</span></div><ul>${r.ch.map(chg).join('')}</ul><p class="why">原因：${esc(r.why)}</p></li>`;
}

/* what a check found and what the groomer wrote are health and handling detail, so 櫃台 sees which item and that a note exists,
   never the words (decided 2026-10-17: 現況說明 and 服務備註 join the sensitive set) */
function findings(ab, label) {
  const keys = Object.keys(ab), okN = CHECK_ITEMS.length - keys.length;
  if (!keys.length) return `<div class="vcheck"><span class="ok">${label}：${CHECK_ITEMS.length} 項正常</span></div>`;
  const what = k => canSens() ? esc(ab[k]) : '';
  return `<div class="vcheck"><span class="ok">${label}：</span>${keys.map(k => `<span class="find"><span class="tag finding">${ic('warn','sm')}${esc(k)}${canSens() ? '' : '異常'}</span>${what(k)}</span>`).join('')}${canSens() ? '' : masked(`${label}說明`)}<span class="ok">其餘 ${okN} 項正常</span></div>`;
}
/* a clerk still reads the notes they wrote themselves; everyone else's are counted and locked */
const noteList = ns => {
  if (!ns.length) return '';
  const mine = n => n.by === me().who, open = canSens() ? ns : ns.filter(mine), shut = ns.length - open.length;
  return `<ul class="vnotes">${open.map(n => `<li>${esc(n.x)}<small>${esc(n.by)}・${esc(n.t)}${n.pending ? '<span class="chip warning">待同步</span>' : ''}</small></li>`).join('')}${shut ? `<li class="shut">${masked(`${shut} 則服務備註`, `服務備註 ${shut} 則`)}<small>${[...new Set(ns.filter(n => !mine(n)).map(n => n.by))].map(esc).join('、')}</small></li>` : ''}</ul>`;
};

function todayEntry(p) {
  const t = p.today;
  const c = state.composing, empty = !state.draft.trim();
  const save = empty ? `<div class="cell"><button class="btn" aria-disabled="true" aria-describedby="cp-r" data-key="cp-save">儲存備註</button><span class="reason" id="cp-r">先寫下備註內容</span></div>`
    : `<div class="cell"><button class="btn primary" data-key="cp-save" data-do="saveNote">儲存備註</button>${state.offline ? '<span class="reason">目前離線：先存在這台裝置，連線後自動同步</span>' : ''}</div>`;
  const comp = c ? `<div class="compose"><label for="cp">今天的服務備註</label>
      <textarea id="cp" data-key="cp" placeholder="例：吹風時會躲，改低風量；右耳仍微紅">${esc(state.draft)}</textarea>
      <div class="row">${save}<div class="cell"><button class="btn secondary" data-key="cp-no" data-do="cancelNote">取消</button></div></div></div>`
    : (state.phone || state.narrow) && !bigText() ? '' : `<div class="tact"><button class="btn primary" data-key="add" data-do="openNote">${ic('plus','sm')}新增服務備註</button></div>`;
  return `<li class="visit today" id="today-entry"><div>
    <div class="tday"><b>今天</b><span class="t">${DAY.m}/${DAY.d}（${dow(DAY.m, DAY.d)}）${t.t}</span><span class="chip ${STAGE_CHIP[t.i]}">${t.st || STAGE[t.i]}</span></div>
    <div class="vh"><span class="svc">${esc(t.svc)}</span><span class="by">${esc(t.res)}</span></div>
    ${t.from ? `<p class="src-line">${esc(t.from)}</p>` : ''}
    ${t.i >= 2 ? findings(t.ab || {}, '今天現況') : `<div class="vcheck"><span class="ok">${t.i === 0 ? '報到後記錄現況' : '現況還沒記錄，記錄後才能開始服務'}</span></div>`}
    ${noteList(t.notes)}${comp}</div></li>`;
}
function visitRow(v) {
  const date = `<div class="vdate"><b>${v.m}/${v.d}</b><small>週${dow(v.m, v.d)}</small></div>`;
  if (v.st !== 'done') return `<li class="visit off">${date}<div><div class="vh"><span class="svc">${esc(v.svc)}</span><span class="chip ${v.st === 'noshow' ? 'danger' : 'neutral'}">${v.st === 'noshow' ? '未到' : '已取消'}</span></div><div class="vcheck"><span class="ok">${esc(v.why)}</span></div></div></li>`;
  return `<li class="visit">${date}<div><div class="vh"><span class="svc">${esc(v.svc)}</span><span class="by">${esc(v.by)}・${esc(v.res)}${v.w ? `・${v.w} kg` : ''}</span></div>${v.ab ? findings(v.ab, '現況') : ''}${noteList(v.notes)}</div></li>`;
}
const SHOW = 5;
function visitsPanel(p) {
  const list = state.older ? p.visits : p.visits.slice(0, SHOW), more = p.visits.length - list.length;
  const empty = p.visits.length ? '' : p.board ? `<li class="empty"><b>沒有來店紀錄</b>這隻寵物只在今日看板的示範資料裡，原型沒有牠過去的來店紀錄。</li>` : `<li class="empty"><b>第一次來店</b>服務完成後，現況紀錄與服務備註會出現在這裡。</li>`;
  const noToday = !p.today ? `<li class="empty" style="padding-bottom:14px"><b>今天沒有預約</b>服務備註要記在當次預約上，下次來店時就能在這裡新增。</li>` : '';
  return `<section class="panel" aria-labelledby="h-visits"><div class="panel-h"><h2 id="h-visits">歷次來店<span class="cnt">${p.visits.length + (p.today ? 1 : 0)}</span></h2><span class="aside">新的在上面</span></div>
    <ol class="visits">${p.today ? todayEntry(p) : noToday}${list.map(visitRow).join('')}${empty}</ol>
    ${more ? `<button class="textbtn older" data-key="older" data-do="showOlder">${ic('chev','sm')}顯示更早 ${more} 筆</button>` : ''}</section>`;
}

function rail() {

  return `<nav class="rail" aria-label="主導覽"><div class="mark" aria-hidden="true">${ic('mark')}</div>${it('board','今日看板','board',true)}${it('search','掃 QR / 查詢預約','scan')}${it('notify','通知補發','send')}${it('me','個人帳號','user')}</nav>`;
}
function bnav() {

  return `<nav class="bnav" aria-label="主導覽">${it('board','看板','board',true)}${it('search','掃碼查詢','scan')}${it('walk','新增現場預約','walk')}${it('me','我的','user')}</nav>`;
}

/* ---------- render ---------- */
function missingView() {
  return `<main><div class="page"><section class="panel missing" aria-labelledby="nf-h"><h1 id="nf-h" tabindex="-1">找不到這隻寵物</h1>
    <p>寵物卡沒有這隻寵物的資料（代號「${esc(state.missing)}」）。可能是剛建立的現場預約還沒同步，回今日看板重新整理後再點一次；還是找不到，請店長到客戶與寵物查詢。</p>
    <div class="acts"><a class="btn primary" href="../today-board/index.html" data-key="nf-board">${ic('back','sm')}回今日看板</a>${history.length > 1 ? `<button class="btn secondary" data-key="nf-back" data-do="goBack">回上一頁</button>` : ''}</div></section></div></main>`;
}
function render(focusKey) {
  const p = pet(), app = $('app');
  if (state.missing) { app.className = state.phone ? 'phone' : state.narrow ? 'narrow' : ''; app.innerHTML = `${state.phone ? '' : rail()}${missingView()}${state.phone ? bnav() : ''}`; return; }

  app.innerHTML = `${state.phone ? '' : rail()}<main>
    <div class="page"><button class="back" data-key="back" data-do="nav">${ic('back')}今日看板</button>
      ${state.offline ? `<p class="mask-note" style="margin:8px 0 0">${ic('off','sm')}<span>目前離線，顯示的是最後同步的資料。可以新增服務備註，連線後自動同步。</span></p>` : ''}
      <div class="grid"><div class="lcol">${whoPanel(p)}${bandPanel(p)}</div><div class="rcol">${visitsPanel(p)}</div></div>
    </div></main>${dock}${state.phone ? bnav() : ''}`;
  if (keep) { const el = app.querySelector(`[data-key="${keep}"]`); if (el && el !== document.activeElement) el.focus({preventScroll: true}); }
}
function say(text) {
  clearTimeout(say.t); state.toast = text;
  const l = $('layer'); l.querySelector('.toast')?.remove();
  l.insertAdjacentHTML('beforeend', `<div class="toast" role="status">${esc(text)}</div>`);
  say.t = setTimeout(() => l.querySelector('.toast')?.remove(), 3200);
}

/* ---------- 修改注意事項 ---------- */
function openEdit() {
  const p = pet();
  state.edit = {step:'form', err:{}, why:'',
    safety: Object.fromEntries(p.safety.map(x => [x.t, x.note])), care: Object.fromEntries(p.care.map(x => [x.t, x.note])),
    ill:p.ill, allergy:p.allergy, internal:p.internal, ret: document.activeElement?.dataset?.key || 'edit'};
  renderEdit('ed-title');
}
function diffOf() {
  const p = pet(), e = state.edit, out = [];
  const cmp = (kind, label, before, after, sens) => {
    const bk = before.map(x => x.t);
    Object.keys(after).forEach(t => { if (!bk.includes(t)) out.push({k:`新增${label}`, a:t}); });
    before.forEach(x => {
      if (!(x.t in after)) out.push({k:`移除${label}`, a:x.t});
      else if ((after[x.t] || '') !== (x.note || '')) out.push({k:`${x.t}說明`, b:x.note || '', a:after[x.t] || '', sens});
    });
    Object.keys(after).forEach(t => { if (!bk.includes(t) && after[t]) out.push({k:`${t}說明`, b:'', a:after[t], sens}); });
  };
  cmp('safety', '安全', p.safety, e.safety, true);
  cmp('care', '照護', p.care, e.care, false);
  [['疾病史','ill'],['過敏','allergy'],['內部備註','internal']].forEach(([k, f]) => { if ((e[f] || '') !== (p[f] || '')) out.push({k, b:p[f] || '', a:e[f] || '', sens:true}); });
  return out;
}
function renderEdit(focusId) {
  const e = state.edit, l = $('layer');
  l.querySelector('.scrim')?.remove();
  if (!e) return;
  const sens = canSens(), p = pet();
  const lock = what => `<div class="lockbox">${masked(what)}</div>`;
  const togs = (kind, preset, cls) => {
    const all = [...new Set([...preset, ...Object.keys(e[kind])])];
    const held = all.filter(t => lockedSafety(kind, t));
    return `<div class="toggles">${all.map(t => `<button class="tog ${cls}" aria-pressed="${t in e[kind]}" data-key="tg-${kind}-${t}" data-do="toggleTag" data-kind="${kind}" data-t="${esc(t)}"${lockedSafety(kind, t) ? ' aria-disabled="true" aria-describedby="tg-held"' : ''}><span class="box">${t in e[kind] ? ic('check') : ''}</span>${esc(t)}</button>`).join('')}</div>${held.length ? `<p class="tog-note" id="tg-held">櫃台可以新增安全標籤；移除要店長以上確認。</p>` : ''}`;
  };
  const notes = (kind, sensKind) => Object.keys(e[kind]).map(t => `<div class="field">${sensKind && !sens
      ? `<span class="lbl">${esc(t)}：說明</span>${lock(t + '的說明')}`
      : `<label for="n-${kind}-${esc(t)}">${esc(t)}：說明</label><textarea id="n-${kind}-${esc(t)}" data-key="n-${kind}-${esc(t)}" data-field="note" data-kind="${kind}" data-t="${esc(t)}" placeholder="怎麼做才安全，例：需兩人保定">${esc(e[kind][t] || '')}</textarea>`}</div>`).join('');
  const txt = (f, label, ph) => `<div class="field">${sens ? `<label for="f-${f}">${label}</label><textarea id="f-${f}" data-key="f-${f}" data-field="${f}" placeholder="${ph}">${esc(e[f] || '')}</textarea>` : `<span class="lbl">${label}</span>${lock(label)}`}</div>`;
  let body;
  if (e.step === 'form') {
    const changes = diffOf().length;
    body = `<div><h2 id="ed-title" tabindex="-1">修改注意事項：${esc(p.name)}</h2><p class="lede">修改後所有店員都會看到，並寫入修改紀錄。${sens ? '' : '櫃台可新增安全標籤、修改照護標籤與照護說明；移除安全標籤、攻擊性說明、病史與內部備註由店長修改。'}</p></div>
      <fieldset class="fs"><legend>${ic('warn','sm')}安全（攻擊性）</legend>${togs('safety', SAFETY_PRESET, 's')}${notes('safety', true)}</fieldset>
      <fieldset class="fs"><legend>${ic('paw','sm')}照護</legend>${togs('care', CARE_PRESET, 'c')}${notes('care', false)}</fieldset>
      <fieldset class="fs"><legend>${ic('heart','sm')}健康與內部備註</legend>${txt('ill','疾病史','例：異位性皮膚炎（服藥中）')}${txt('allergy','過敏','例：雞肉')}${txt('internal','內部備註','只有店內人員看得到')}</fieldset>
      <div class="field"><label for="f-why">修改原因（必填）</label><input id="f-why" data-key="f-why" data-field="why" value="${esc(e.why)}" placeholder="例：飼主今天告知" ${e.err.why ? 'aria-invalid="true" aria-describedby="why-e"' : ''}>${e.err.why ? `<span class="err" id="why-e">${e.err.why}</span>` : ''}</div>
      <div class="dbtns"><div class="cell"><button class="btn secondary" data-key="ed-no" data-do="closeEdit">取消</button></div><div class="cell">${changes
        ? `<button class="btn secondary" data-key="ed-next" data-do="editNext">下一步：確認 ${changes} 項修改</button>`
        : `<button class="btn" aria-disabled="true" aria-describedby="ed-nr" data-key="ed-next">下一步：確認修改</button><span class="reason" id="ed-nr">還沒有任何修改</span>`}</div></div>`;
  } else {
    const d = diffOf();
    body = `<div><h2 id="ed-title" tabindex="-1">確認修改 ${d.length} 項</h2><p class="lede">儲存後無法刪除，會以「${esc(me().who)}（${me().role}）」寫入修改紀錄。</p></div>
      <ul class="diff">${d.map(c => `<li><span class="k">${esc(c.k)}</span>${c.b === undefined ? `<span class="a">「${esc(c.a)}」</span>` : `${c.b ? `<span class="b">${esc(c.b)}</span><span aria-hidden="true">→</span>` : ''}<span class="a">${esc(c.a || '（清空）')}</span>`}</li>`).join('')}</ul>
      <p class="lede" style="margin:0">原因：${esc(e.why)}</p>
      <div class="dbtns"><div class="cell"><button class="btn secondary" data-key="ed-back" data-do="editBack">返回修改</button></div><div class="cell"><button class="btn primary" data-key="ed-save" data-do="editSave">${ic('check','sm')}儲存修改</button></div></div>`;
  }
  l.insertAdjacentHTML('afterbegin', `<div class="scrim" data-do="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ed-title">${body}</div></div>`);
  const f = focusId && document.getElementById(focusId) || l.querySelector(`[data-key="${focusId}"]`);
  f?.focus();
}
function closeEdit() { const ret = state.edit?.ret; state.edit = null; renderEdit(); render(); document.querySelector(`#app [data-key="${ret}"]`)?.focus(); }

/* ---------- actions ---------- */
const act = {
  nav() { say('原型只做寵物卡；看板請開今日看板原型'); },
  goBack() { history.back(); },
  openNote() { state.composing = true; render(); const t = $('cp'); t?.focus(); $('today-entry')?.scrollIntoView({block:'nearest'}); },
  cancelNote() { state.composing = false; state.draft = ''; render('add'); },
  saveNote() {
    const x = state.draft.trim(); if (!x) return;
    pet().today.notes.push({by: me().who, t: nowT(), x, pending: state.offline});
    state.composing = false; state.draft = '';
    render('add'); say(state.offline ? '已存在這台裝置，連線後自動同步' : '已新增服務備註');
    if (state.pet === 'afu') lifeSay('noted');
  },
  showOlder() { state.older = true; render(); document.querySelector(`.visits li:nth-child(${SHOW + 2})`)?.setAttribute('tabindex','-1'); document.querySelector(`.visits li:nth-child(${SHOW + 2})`)?.focus(); },
  toggleLog() { state.logOpen = !state.logOpen; render('log'); if (state.logOpen && state.pet === 'afu') lifeSay('log'); },
  openEdit,
  closeEdit,
  scrim(el, ev) { if (ev.target === el) closeEdit(); },
  toggleTag(el) {
    const e = state.edit, k = el.dataset.kind, t = el.dataset.t;
    if (lockedSafety(k, t)) { say('移除安全標籤需店長以上'); return; }
    if (t in e[k]) delete e[k][t]; else e[k][t] = '';
    renderEdit(el.dataset.key);
  },
  editNext() {
    const e = state.edit;
    if (!e.why.trim()) { e.err = {why:'請寫下修改原因，例：飼主今天告知'}; renderEdit('f-why'); return; }
    e.err = {}; e.step = 'confirm'; renderEdit('ed-title');
  },
  editBack() { state.edit.step = 'form'; renderEdit('ed-title'); },
  editSave() {
    if (state.offline) { say('修改注意事項需連線'); return; }
    const p = pet(), e = state.edit, d = diffOf();
    const order = (before, after) => [...before.filter(x => x.t in after).map(x => x.t), ...Object.keys(after).filter(t => !before.some(x => x.t === t))].map(t => ({t, note: after[t] || ''}));
    p.safety = order(p.safety, e.safety); p.care = order(p.care, e.care);
    p.ill = e.ill; p.allergy = e.allergy; p.internal = e.internal;
    p.audit.unshift({at:`${DAY.m}/${DAY.d} ${nowT()}`, by: me().who, role: me().role, why: e.why.trim(), ch: d});
    state.edit = null; state.logOpen = true; renderEdit(); render(); document.querySelector('#app [data-key="edit"]')?.focus();
    say(`注意事項已更新 ${d.length} 項・已寫入修改紀錄`);
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-do]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  act[el.dataset.do]?.(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'cp') {
    const was = !state.draft.trim(); state.draft = el.value;
    if (was !== !state.draft.trim()) { const pos = el.selectionStart; render('cp'); const t = $('cp'); t.setSelectionRange(pos, pos); }
    return;
  }
  const e = state.edit; if (!e || !el.dataset.field) return;
  if (el.dataset.field === 'note') e[el.dataset.kind][el.dataset.t] = el.value;
  else e[el.dataset.field] = el.value;
  if (el.dataset.field === 'why' && e.err.why && el.value.trim()) { e.err = {}; }
  const btn = document.querySelector('[data-key="ed-next"]'), n = diffOf().length;
  if (btn && (btn.getAttribute('aria-disabled') === 'true') !== !n) { const pos = el.selectionStart; renderEdit(el.dataset.key); const t = document.querySelector(`[data-key="${el.dataset.key}"]`); t?.setSelectionRange?.(pos, pos); }
  else if (btn && n) btn.textContent = `下一步：確認 ${n} 項修改`;
});
document.addEventListener('keydown', ev => {
  if (!state.edit) return;
  if (ev.key === 'Escape') { closeEdit(); return; }
  if (ev.key === 'Tab') {
    const f = [...document.querySelectorAll('.dialog button, .dialog textarea, .dialog input, .dialog [tabindex="-1"]')].filter(x => x.tabIndex >= 0);
    if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
  }
});

/* ---------- prototype controls ---------- */
$('p-pet').innerHTML = PETS0.map(p => `<option value="${p.id}">${p.name}・${p.today ? '今天有預約' : '今天沒預約'}${p.lite ? '・精簡版' : ''}${p.photo ? '' : '・無照片'}${p.visits.length ? '' : p.board ? '・沒有來店紀錄' : '・第一次來店'}${p.safety.length + p.care.length ? '' : '・無注意事項'}</option>`).join('');
const q = new URLSearchParams(location.search);
if (q.get('role') in ROLES) state.role = q.get('role');
/* a ?pet= this prototype does not carry says so instead of quietly opening another pet */
if (q.get('pet')) { if (PETS0.some(p => p.id === q.get('pet'))) state.pet = q.get('pet'); else state.missing = q.get('pet'); }
if (q.get('off') === '1') state.offline = true;
if (LIFE) $('p-role').querySelector('option[value="groomer"]').textContent = '美容照護・阿哲';
$('p-role').value = state.role; $('p-pet').value = state.pet; $('p-off').checked = state.offline;
$('p-role').onchange = e => { state.role = e.target.value; state.edit = null; renderEdit(); render(); };
$('p-pet').onchange = e => { state.pet = e.target.value; state.missing = null; state.composing = false; state.draft = ''; state.older = false; state.logOpen = false; render(); };
$('p-off').onchange = e => {
  state.offline = e.target.checked;
  if (!state.offline) {
    let n = 0; PETS.forEach(p => p.today?.notes.forEach(x => { if (x.pending) { x.pending = false; n++; } }));
    if (n) say(`已連線，${n} 則備註已同步`);
  }
  render();
};
$('p-theme').onchange = e => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; };
const mq = matchMedia('(max-width: 767px)');
/* the page collapses to one column below ~960px (container ≤820 beside the rail); then the next step docks like on phone */
const mqN = matchMedia('(max-width: 960px)');
const setPhone = () => { state.phone = mq.matches; state.narrow = mqN.matches; render(); if (state.edit) renderEdit(); };
mq.addEventListener('change', setPhone); mqN.addEventListener('change', setPhone);
setPhone();
</script>
