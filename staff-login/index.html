<style>
/* 暖心生活 App world, staff tokens copied from the today board and the pet card. Status colors are the fixed set shared by every surface and shop. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--surface:#FFFFFF;--surface-2:#FBF6F0;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;
  --ink:#2B211C;--ink-muted:#6E6058;--border:#EADFD3;--control-border:#9A8878;--track:#E6D9CC;
  --act:#FF6B3D;--act-hover:#FF7E55;--on-act:#2B160C;--act-tint:#FFE5DA;--act-ink:#B5431A;
  --rail:#2E211B;--rail-edge:transparent;--rail-ink:#DCCDC0;--rail-hover:#45352C;--rail-cur:#F6EFE7;--rail-cur-ink:#2B211C;
  --focus:#2B211C;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;--border-danger:#E9A9A3;--danger-tint:#FFF1EE;
  --toast:#2E211B;--on-toast:#FFFFFF;--scrim:#2B211C8C;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --lift-up:0 -12px 28px -16px rgb(74 44 26 / .35);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --railw:5.25rem;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
  --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
  --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
  --focus:#F6EDE6;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
  --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
    --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;
    --act:#FF8257;--act-hover:#FF956F;--on-act:#2B160C;--act-tint:#4A2618;--act-ink:#FFA584;
    --rail:#0E0A08;--rail-edge:#3A2E27;--rail-ink:#BCAEA3;--rail-hover:#2A211C;--rail-cur:#F6EDE6;--rail-cur-ink:#15100D;
    --focus:#F6EDE6;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;--border-danger:#6B2A27;--danger-tint:#2C1715;
    --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    --lift-up:0 -12px 28px -16px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px;scroll-padding-bottom:180px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:.9375rem;line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
::selection{background:var(--act-tint);color:var(--ink)}
input,textarea{caret-color:var(--act-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--control-border) transparent}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:24px;height:24px}

/* ---------- prototype strip (not product UI) ---------- */
.proto{background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;display:flex;align-items:center;gap:6px 16px;padding:6px 16px;overflow-x:auto;white-space:nowrap;min-height:44px}
.proto b{font-weight:700}
.proto .muted{color:var(--proto-muted)}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select{background:transparent;border:1px solid var(--proto-line);border-radius:8px;padding:4px 8px;min-height:32px;color:var(--proto-ink)}
.proto select option{color:#2B211C;background:#fff}
.proto input[type=checkbox]{width:16px;height:16px;accent-color:var(--proto-ink)}
.proto :focus-visible{outline-color:var(--proto-ink)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
#app:not(.phone){background:linear-gradient(to right,var(--rail) var(--railw),transparent 0)}
#app.phone{display:block;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--rail);box-shadow:inset -1px 0 0 var(--rail-edge);display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}
.mark{width:44px;height:44px;border-radius:14px;background:var(--rail-cur);color:var(--rail);display:grid;place-items:center;margin-bottom:14px}
.mark .ico{width:26px;height:26px;stroke-width:0;fill:currentColor}
.rail-item{width:4rem;min-height:3.75rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--rail-ink);font-size:.75rem;font-weight:600;text-align:center;line-height:1.25;padding:6px 0;transition:background-color .2s var(--out)}
.rail-item:hover{color:var(--rail-cur);background:var(--rail-hover)}
.rail-item[aria-current="page"]{background:var(--rail-cur);color:var(--rail-cur-ink);font-weight:800;--cut:var(--rail-cur)}
.rail :focus-visible{outline-color:var(--rail-cur)}
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;background:var(--rail);display:grid;grid-template-columns:repeat(4,1fr);border-radius:var(--r-lg);padding:6px;box-shadow:var(--lift-hi)}
.bnav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:.75rem;font-weight:600;line-height:1.2;text-align:center;color:var(--rail-ink);border-radius:16px}
.bnav button[aria-current="page"]{color:var(--rail-cur-ink);background:var(--rail-cur);font-weight:800;--cut:var(--rail-cur)}
.bnav :focus-visible{outline-color:var(--rail-cur);outline-offset:-3px}
main{min-width:0}


/* pre-login screens have no rail: the device itself is the frame */
#app.pre{display:block;background:none}
#app.home:not(.phone){background:linear-gradient(to right,var(--rail) var(--railw),transparent 0)}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:var(--r-md);font-size:1rem;font-weight:700;line-height:1.3;text-align:center;border:1.5px solid transparent;transition:transform .35s var(--spring),background-color .2s var(--out),box-shadow .2s var(--out)}
.btn:active:not([aria-disabled="true"]){transform:scale(.96);transition-duration:.08s}
.btn.primary{background:var(--act);color:var(--on-act);font-weight:800;box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,var(--lift)}
.btn.primary:hover{background:var(--act-hover)}
.btn.secondary{background:var(--sunk);color:var(--ink)}
.btn.secondary:hover{background:var(--sunk-hover)}
.btn.wide{width:100%}
.btn[aria-disabled="true"]{background:transparent;color:var(--ink-muted);cursor:not-allowed;border:1.5px dashed var(--control-border);box-shadow:none}
.btn.dangerish{background:var(--danger-solid);color:var(--on-danger-solid);font-weight:800}
.textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;color:var(--ink);background:var(--sunk);font-weight:800;font-size:.875rem;border-radius:999px;transition:background-color .2s var(--out),transform .35s var(--spring)}
.textbtn:hover{background:var(--sunk-hover)}
.textbtn:active{transform:scale(.96);transition-duration:.08s}
.lnk{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px;margin:0 -6px;border-radius:999px;color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.lnk:hover{background:var(--sunk)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;color:var(--ink-muted);font-weight:800;border-radius:999px}
.back:hover{color:var(--ink);background:var(--sunk)}
.reason{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-muted);margin-top:6px;line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;line-height:1.4;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.neutral{color:var(--neutral);background:var(--neutral-bg)}
.chip.success{color:var(--success);background:var(--success-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.9375rem;font-weight:800}
.field input{width:100%;min-height:52px;border:1.5px solid var(--control-border);border-radius:var(--r-md);background:var(--surface);padding:10px 14px;font-size:1.0625rem;font-weight:600}
.field input:hover{border-color:var(--ink)}
.field input::placeholder{color:var(--ink-muted);font-weight:500}
.field input[aria-invalid="true"]{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.field .err{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:800;color:var(--danger)}
.field .hint{font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.pw{position:relative}
.pw input{padding-right:56px}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--ink-muted)}
.pw .eye:hover{color:var(--ink);background:var(--sunk)}
.code input{font-family:"Nunito",var(--font);font-size:1.5rem;font-weight:800;letter-spacing:.3em;text-align:center}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:.9375rem;font-weight:600;line-height:1.5}
.notice b{display:block;font-weight:900}
.notice .ico{flex:none;margin-top:2px}
.notice>span{flex:1;min-width:0}
.notice.warning{background:var(--warning-bg);color:var(--warning)}
.notice.danger{background:var(--danger-bg);color:var(--danger)}
.notice.neutral{background:var(--neutral-bg);color:var(--neutral)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.success{background:var(--success-bg);color:var(--success)}
.notice .lnk{color:inherit;margin:-10px 0}

/* ---------- device head: whose device, where, what time ---------- */
.dev-head{width:100%;display:flex;align-items:center;gap:14px;padding:20px 32px 8px;max-width:1280px;margin:0 auto}
.shop-mark{width:48px;height:48px;border-radius:14px;background:var(--rail);color:#F6EFE7;display:grid;place-items:center;flex:none}
.shop-mark .ico{width:28px;height:28px;stroke-width:0;fill:currentColor}
.shop{min-width:0;line-height:1.3}
.shop b{display:block;font-size:1.0625rem;font-weight:900}
.shop span{display:block;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.clock{margin-left:auto;text-align:right;line-height:1.1}
.clock b{display:block;font-family:"Nunito",var(--font);font-size:2.25rem;font-weight:800;letter-spacing:-.02em}
.clock span{display:block;margin-top:4px;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.phone .dev-head{padding:14px 16px 4px}
.phone .clock b{font-size:1.75rem}

/* ---------- 員工牆 ---------- */
.wall{max-width:1280px;margin:0 auto;padding:20px 32px 40px}
.wall h1{font-size:2.25rem;font-weight:900;line-height:1.2;text-wrap:balance}
.lede{margin-top:6px;font-size:1rem;font-weight:600;color:var(--ink-muted);text-wrap:pretty;max-width:60ch}
.wall .notice{margin-top:18px;max-width:720px}
.people{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px;margin-top:28px}
.people>li{position:relative;min-width:0}
.pcard{width:100%;min-height:216px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 14px 20px;text-align:center;transition:transform .35s var(--spring),box-shadow .2s var(--out);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pcard:hover{box-shadow:var(--lift-hi)}
.pcard:active{transform:scale(.97);transition-duration:.08s}
.disc{--s:88px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-size:calc(var(--s) * .4);font-weight:900;line-height:1}
.pcard .disc{margin-bottom:8px}
.pcard .nm{font-size:1.25rem;font-weight:900;line-height:1.25}
.pcard .rl{font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.pcard .chip{margin-top:6px}
.pcard .last{margin-top:6px;font-size:.8125rem;font-weight:700;color:var(--ink-muted)}
.pcard.add{background:transparent;box-shadow:none;border:2px dashed var(--control-border);color:var(--ink-muted)}
.pcard.add:hover{border-color:var(--ink);color:var(--ink);box-shadow:none}
.pcard.add .disc{background:transparent;border:2px dashed var(--control-border);color:inherit}
.pcard.add .disc .ico{width:32px;height:32px}
.pcard.add .nm{color:var(--ink)}
.pcard.add[aria-disabled="true"]{cursor:not-allowed}
.pcard.add[aria-disabled="true"] .nm{color:var(--ink-muted)}
.wall-foot{margin-top:28px;font-size:.875rem;font-weight:600;color:var(--ink-muted);text-wrap:pretty}
/* long press: the card turns over to its one quiet action */
.pmenu{position:absolute;inset:0;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink),var(--lift-hi);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px;animation:fade .2s var(--out)}
.pmenu p{font-size:.9375rem;font-weight:900;text-align:center;margin-bottom:4px}
.pmenu .btn{min-height:48px;font-size:.9375rem}
/* picking: the others step back into a row of small cards */
.people.picking{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.people.picking>li.open{grid-column:1/-1;margin-bottom:6px}
.people.picking>li:not(.open) .pcard{min-height:68px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 16px;text-align:left;box-shadow:none;background:var(--surface-2);border:1px solid var(--border)}
.people.picking>li:not(.open) .pcard:hover{background:var(--surface);border-color:var(--control-border)}
.people.picking>li:not(.open) .disc{--s:44px;margin:0}
.people.picking>li:not(.open) .pcard .nm{font-size:1rem}
.people.picking>li:not(.open) .pcard .rl{display:none}
.people.picking>li:not(.open) .pcard .chip,.people.picking>li:not(.open) .pcard .last{display:none}
.people.picking>li:not(.open) .pcard.add{border:1.5px dashed var(--control-border);background:transparent}
.people.picking>li:not(.open) .pcard.add .disc{border-width:1.5px}
.people.picking>li:not(.open) .pcard.add .disc .ico{width:22px;height:22px}

/* ---------- the PIN card: the person's card grown in place ---------- */
.pin-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:inset 0 0 0 2px var(--ink),var(--lift-hi);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:24px 48px;align-items:center;padding:32px 40px}
.pin-who{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.pin-who .disc{--s:104px;margin-bottom:16px}
.pin-who h2{font-size:2rem;font-weight:900;line-height:1.2}
.pin-who .rl{margin-top:2px;font-size:1rem;font-weight:700;color:var(--ink-muted)}
.pin-who .seen{margin-top:10px;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.pin-who .ask{margin-top:22px;font-size:1.0625rem;font-weight:800}
.dots{display:flex;gap:16px;margin-top:12px}
.dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);transition:background-color .12s var(--out),transform .25s var(--spring)}
.dot.on{background:var(--ink);transform:scale(1.08)}
.dots.bad .dot{border-color:var(--danger)}
.dots.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:1.5em;margin-top:14px;font-size:.9375rem;font-weight:800;line-height:1.5;text-wrap:pretty;max-width:34ch}
.pin-msg.bad{display:flex;gap:6px;align-items:flex-start;color:var(--danger)}
.pin-msg.bad .ico{margin-top:2px}
.pin-links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px}
.pin-links .lnk{font-size:.9375rem;color:var(--ink-muted)}
.pin-links .lnk:hover{color:var(--ink)}

/* ---------- demo clock: starts at 10:52 on 10/11 and keeps real time ---------- */
/* 毛孩日和開張 (prototypes/open-day): ?life=open-tablet is 10/14（三）09:30, the closed day before the shop opens; 阿凱 is the first on the
   new counter tablet, and reaching the board posts the act's key action to the director page.
   阿楷離職那天 (prototypes/last-day): ?life=qt-leave is 10/9（五）11:14, 阿楷's last day. He has just finished 湯圓, his last booking, on
   this tablet (剛剛用過), and removes himself from it before he goes; removing 阿楷 posts 'removed'. */
const LIFE = (v => ['open-tablet', 'qt-leave'].includes(v) ? v : null)(params.get('life'));
const lifeSay = k => { if (LIFE && parent !== window) try { parent.postMessage({pp:'life', act:LIFE, done:k}, location.origin); } catch (e) { /* opened on its own */ } };
if (LIFE === 'qt-leave') { ACCOUNTS0.find(a => a.id === 'kai').last = '剛剛'; ACCOUNTS0.find(a => a.id === 'akai').last = '今天 10:58'; }
const T0 = Date.now(), START = LIFE === 'open-tablet' ? new Date(2026, 9, 14, 9, 30) : LIFE === 'qt-leave' ? new Date(2026, 9, 9, 11, 14) : new Date(2026, 9, 11, 10, 52);
let skew = 0;  /* the strip's 快轉 moves the demo clock forward */
const now = () => new Date(START.getTime() + (Date.now() - T0) + skew);
const hm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const dateLine = d => `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;
setInterval(() => { const c = document.querySelector('.clock b'); if (c) c.textContent = hm(now()); }, 10000);

/* ---------- SMS codes: the same rule on every surface (店員 App, 管理 Web, M-03 換手機) ----------
   A code lives 10 minutes; resend opens after 60 s; one number gets at most 5 texts an hour; 5 wrong tries kill a code
   (after that even the right digits are refused); 10 wrong in total lock the number for 15 minutes, written to the audit log.
   Kept per phone number, outside any form, so 換一支手機 or going back cannot clear it. */
const SMS = {life:10 * 60000, gap:60000, cap:5, hour:60 * 60000, perCode:5, lockAt:10, lockFor:15 * 60000};
const smsBook = {};
const clockMs = () => now().getTime();
const hmT = t => hm(new Date(t));
const smsOf = ph => smsBook[ph] || (smsBook[ph] = {sends:[], code:null, wrong:0, until:0});
function smsLock(ph) { const s = smsOf(ph); if (s.until && s.until <= clockMs()) { s.until = 0; s.wrong = 0; } return s.until; }
function smsCapUntil(ph) { const s = smsOf(ph), t = clockMs(); s.sends = s.sends.filter(x => t - x < SMS.hour); return s.sends.length >= SMS.cap ? s.sends[0] + SMS.hour : 0; }
const capMsg = t => `這支手機一小時內已傳 ${SMS.cap} 次，請 ${hmT(t)} 後再試`;
/* '' when a new code went out, 'locked', or why not in words */
function smsSend(ph) {
  if (smsLock(ph)) return 'locked';
  const cap = smsCapUntil(ph); if (cap) return capMsg(cap);
  const s = smsOf(ph); s.sends.push(clockMs()); s.code = {at:clockMs(), tries:0}; return '';
}
const smsWait = ph => { const c = smsOf(ph).code; return c ? Math.max(0, Math.ceil((c.at + SMS.gap - clockMs()) / 1000)) : 0; };
/* '' when right, 'locked' when this try locked the number, otherwise the error in words */
function smsCheck(ph, v) {
  const s = smsOf(ph), c = s.code;
  if (smsLock(ph)) return 'locked';
  if (!c) return '請重新傳送驗證碼';
  if (c.tries >= SMS.perCode) return `這組驗證碼輸錯 ${SMS.perCode} 次，已經失效，請重新傳送`;
  if (clockMs() - c.at > SMS.life) return '驗證碼已過期，請重新傳送';
  if (v === CODE) { s.code = null; s.wrong = 0; return ''; }
  c.tries++; s.wrong++;
  if (s.wrong >= SMS.lockAt) { s.until = clockMs() + SMS.lockFor; s.code = null; return 'locked'; }
  return c.tries >= SMS.perCode ? `這組驗證碼輸錯 ${SMS.perCode} 次，已經失效，請重新傳送` : `驗證碼不對，請再看一次簡訊（這組還能試 ${SMS.perCode - c.tries} 次）`;
}

    const rules = PW_RULES.map(([t, fn]) => { const c = !f.npw ? 'idle' : fn(f.npw) ? 'met' : f.err.npw ? 'miss' : 'idle'; return `<li class="${c}">${ic(c === 'met' ? 'check' : c === 'miss' ? 'warn' : 'dotI')}${t}</li>`; }).join('');
    body = `<div class="field"><label for="fp-npw">新密碼</label><ul class="rules" aria-label="密碼規則">${rules}</ul>
      <div class="pw"><input id="fp-npw" data-key="fp-npw" type="${f.show ? 'text' : 'password'}" autocomplete="new-password" value="${esc(f.npw)}"${inv(f,'npw')}>

  return formShell(`<h1 id="f-title" tabindex="-1">${f.step < 3 ? '忘記密碼' : '設定新密碼'}</h1><p class="lede">${lede}</p>
    <form data-form="forgot" novalidate>${topNote(f)}${body}</form>`, {back:['toLogin', '手機和密碼登入']});

/* ---------- render, with the one authored moment: the tapped card grows into the PIN pad ---------- */
function render(focusId) {
  const app = $('app');
  const before = calm() ? null : Object.fromEntries([...app.querySelectorAll('[data-pid]')].map(el => [el.dataset.pid, el.getBoundingClientRect()]));
  const keep = !focusId && document.activeElement?.dataset?.key;
  const wasOpen = app.querySelector('li.open')?.dataset.pid;
  state.phone = innerWidth < 640; state.tall = !state.phone && (innerWidth < 1000 || innerHeight > innerWidth);
  const v = state.view;
  app.className = `${v === 'home' ? 'home' : 'pre'}${state.phone ? ' phone' : ''}${state.tall ? ' tall' : ''}`;
  app.innerHTML = v === 'wall' ? wallView() : v === 'login' ? loginView() : v === 'otp' ? otpView() : v === 'forgot' ? forgotView()
    : v === 'setup' ? setupView() : v === 'home' ? homeView() : outView();
  renderLayer();
  if (before) flip(before, wasOpen);
  const f = focusId && document.getElementById(focusId);
  if (f) f.focus({preventScroll: false});
  else if (keep) { const el = document.querySelector(`[data-key="${keep}"]`); if (el && el !== document.activeElement) el.focus({preventScroll: true}); }
}
function flip(before, wasOpen) {
  document.querySelectorAll('#app [data-pid]').forEach(el => {
    const o = before[el.dataset.pid]; if (!o) return;
    const n = el.getBoundingClientRect();
    if (el.classList.contains('open') && el.dataset.pid !== wasOpen) {
      const card = el.firstElementChild;
      card.animate([{clipPath:`inset(${o.top - n.top}px ${n.right - o.right}px ${n.bottom - o.bottom}px ${o.left - n.left}px round 20px)`}, {clipPath:'inset(0 0 0 0 round 28px)'}], {duration:420, easing:'cubic-bezier(.16,1,.3,1)'});
      card.querySelectorAll('.keypad,.pin-who>*:not(.disc)').forEach((c, i) => c.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:260, delay:140 + i * 20, easing:'ease-out', fill:'backwards'}));
    } else {
      const dx = o.left - n.left, dy = o.top - n.top;
      if (dx || dy) el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:380, easing:'cubic-bezier(.16,1,.3,1)'});
    }
  });
}
function renderLayer() {
  const l = $('layer');
  l.querySelectorAll('.sheet-scrim,.os-scrim').forEach(e => e.remove());
  if (state.view === 'wall' && state.phone && state.sel && bound().length > 1) {
    l.insertAdjacentHTML('beforeend', `<div class="sheet-scrim" data-do="closePad" data-key="sheet-scrim"><div role="dialog" aria-modal="true" aria-labelledby="pin-name" style="width:100%">${pinCard(acc(state.sel))}</div></div>`);
  }
  if (state.os) l.insertAdjacentHTML('beforeend', `<div class="os-scrim"><div class="os" role="alertdialog" aria-modal="true" aria-labelledby="os-t"><p class="cap">手機系統的詢問視窗（模擬）</p>
    <p class="t" id="os-t">「寵派商家中心」想要傳送通知</p><p class="d">通知可能包含提示、聲音和圖像標記。</p>
    <div class="b"><button data-key="os-no" data-do="osNo">不允許</button><button data-key="os-yes" data-do="osYes">允許</button></div></div></div>`);
}
function say(text) {
  clearTimeout(say.t);
  const l = $('layer'); l.querySelector('.toast')?.remove();
  l.insertAdjacentHTML('beforeend', `<div class="toast" role="status" data-key="toast">${esc(text)}</div>`);
  say.t = setTimeout(() => l.querySelector('.toast')?.remove(), 3600);
}

/* ---------- PIN pad ---------- */
function openPad(id, mode = 'login', quiet) {
  state.sel = id; state.menu = null; state.pad = {mode, val:'', err:''};
  if (!quiet) { render('pin-name'); keysInView(); }
}
function digit(d) {
  const p = state.pad; if (!p || p.busy || p.val.length >= 4) return;
  if (state.view === 'wall' && acc(state.sel)?.locked && p.mode !== 'remove' && p.mode !== 'unlock') return;
  p.val += d; p.err = ''; render(); progress();
  if (p.val.length === 4) { p.busy = true; setTimeout(() => { p.busy = false; settle(); }, FAST ? 0 : 160); }
}
/* large text pushes the keypad under the fold: bring its last row into view once the card has grown */
function keysInView() { setTimeout(() => { const k = document.querySelector('#app .keypad'); if (k && k.getBoundingClientRect().bottom > innerHeight) k.scrollIntoView({block:'end', behavior: calm() ? 'auto' : 'smooth'}); }, calm() ? 0 : 440); }
function undo() { const p = state.pad; if (!p || !p.val) return; p.val = p.val.slice(0, -1); p.err = ''; render(); progress(); }
/* a screen reader hears how many digits are in, never the digits; the region lives outside #app so a re-render never drops it */
function progress() { const l = $('pin-live'); if (l && state.pad) l.textContent = `已輸入 ${state.pad.val.length} 碼`; }
const weak = v => /^(\d)\1{3}$/.test(v) || '01234567890'.includes(v) || '09876543210'.includes(v);
function settle() {
  const p = state.pad;
  if (p.mode === 'set1') {
    if (weak(p.val)) { p.err = '這組太好猜了，換一組。'; p.val = ''; return render(); }
    p.first = p.val; p.val = ''; p.mode = 'set2'; return render();
  }
  if (p.mode === 'set2') {
    if (p.val !== p.first) { Object.assign(p, {mode:'set1', val:'', first:null, err:'兩次不一樣，請重新設定。'}); return render(); }
    const a = acc(state.setup.who); a.pin = p.val; a.fails = 0; a.locked = false;
    say('PIN 已設定'); return nextStep();
  }
  const a = acc(state.sel);
  /* a manager's PIN lifts someone else's lock on this device; a wrong one counts against the manager, never the locked person */
  if (p.mode === 'unlock') {
    const m = acc(p.by);
    if (p.val === m.pin) {
      m.fails = 0; a.locked = false; a.fails = 0; a.unlockedBy = {by:m.name, at:hm(now())};
      Object.assign(p, {mode:'login', val:'', err:'', by:null});
      render('pin-name'); say(`${m.name}已解鎖${a.name}的 PIN，已記錄`); return;
    }
    m.fails++; p.val = '';
    if (m.fails >= PIN_TRIES) { m.locked = true; Object.assign(p, {mode:'login', by:null, err:''}); render('pin-name'); say(`${m.name}的 PIN 也鎖定了`); return; }
    p.err = `${m.name}的 PIN 不對，再試一次。`; return render();
  }
  if (p.val === a.pin) {
    a.fails = 0;
    if (p.mode === 'remove') return removeFromDevice(a, `已把${a.name}從這台移除`);
    return signIn(a);
  }
  a.fails++; p.val = '';
  if (a.fails >= PIN_TRIES) { a.locked = true; p.err = ''; p.mode = 'login'; render('pin-name'); return; }
  const left = PIN_TRIES - a.fails;
  /* most wrong PINs on a shared tablet are the right PIN on the wrong card: say whose card this is */
  const who = bound().length > 1 ? `你是${a.name}嗎？不是的話，點自己的名字。` : '';
  p.err = left <= 2 ? `PIN 不對。再錯 ${left} 次會鎖定。${who}` : `PIN 不對。${who || '再試一次。'}`;
  render();
}
function closePad() { state.sel = null; state.pad = null; render('wall-title'); }
function removeFromDevice(a, msg) {
  if (LIFE === 'qt-leave' && a.id === 'kai') lifeSay('removed');
  a.bound = false; a.fails = 0; a.locked = false; a.pin = null; a.push = null;
  state.sel = null; state.pad = null; state.menu = null;
  if (!bound().length) { if (!device.personal) device.branch = device.branch; state.view = 'login'; state.form = newForm('login'); }
  else if (bound().length === 1) openPad(bound()[0].id, 'login', true);
  render(state.view === 'login' ? 'f-title' : 'wall-title'); say(msg);
}

/* ---------- sign-in outcomes ---------- */
function signIn(a, branch) {
  state.session = {who:a.id, branch: branch || (a.branches.includes(device.branch) ? device.branch : a.branches[0])};
  a.last = '剛剛'; A.forEach(o => { if (o.id !== a.id && o.last === '剛剛') o.last = '今天 10:42'; });
  state.view = 'home'; state.sel = null; state.pad = null; state.form = null; state.setup = null;
  poke(); render('home-title');
}
function startSetup(a, reset) {
  const steps = ['pin'];
  if (!reset && a.push === null) steps.push('push');
  if (!reset && a.branches.length > 1) steps.push('branch');
  state.setup = {who:a.id, steps, i:0, reset, branch: a.branches.includes(device.branch) ? device.branch : a.branches[0], pushDenied:false};
  state.pad = {mode:'set1', val:'', err:''};
  state.view = 'setup'; render('f-title');
}
function nextStep() {
  const s = state.setup; s.i++; state.pad = s.steps[s.i] === 'pin' ? {mode:'set1', val:'', err:''} : null;
  if (s.i >= s.steps.length) {
    const a = acc(s.who); a.bound = true;
    if (!device.branch) device.branch = s.branch;
    if (a.push === null) a.push = 'off';
    if (LIFE === 'open-tablet') lifeSay('ready');
    return signIn(a, s.branch);
  }
  render('f-title');
}
/* the password path: every check the server makes, in the order it makes them */
function passwordOk(a) {
  const f = state.form;
  if (a.status === 'disabled') { f.top = ['danger', '此帳號已停用', a.role === '店長' ? '請聯絡店家管理者。' : '請聯絡店長。']; return false; }
  if (a.status === 'invited') { f.top = ['warning', '這個帳號還沒啟用', '請先打開店長傳給你的邀請連結，設定密碼。']; return false; }
  if (device.branch && !a.branches.includes(device.branch) && a.role !== '店家管理者') {
    f.top = ['danger', `這台${device.personal ? '手機' : '平板'}屬於${device.branch}`, `你的帳號沒有${device.branch}的權限。請用${a.branches.join('、')}的裝置，或請店長調整分店。`]; return false;
  }
  return true;
}
function afterCredentials(a) {
  const f = state.form;
  if (a.bound && !a.locked && f.after !== 'resetPin') { say(`${a.name}已在這台，下次點名字輸入 PIN 就好`); return signIn(a); }
  if (a.bound) return startSetup(a, true);
  if (!device.personal && bound().length >= 12) { f.top = ['warning', '這台已有 12 人', '請先把不再使用的人從這台移除。']; return render(); }
  startSetup(a, false);
}
function submitLogin() {
  const f = state.form; f.acct = $('lg-acct').value; f.pw = $('lg-pw').value; f.err = {}; f.top = null;
  const d = f.acct.replace(/\D/g, '');
  if (!d) f.err.acct = '請輸入手機號碼';
  else if (!/^09\d{8}$/.test(d)) f.err.acct = '手機號碼是 09 開頭的 10 碼';
  if (!f.pw) f.err.pw = '請輸入密碼';
  if (f.err.acct || f.err.pw) return render(f.err.acct ? 'lg-acct' : 'lg-pw');
  if (state.offline) { f.top = ['neutral', '連不上網路', '用手機和密碼登入需要連線。請確認 Wi-Fi 後再試，已輸入的資料會留著。']; return render(); }
  const a = byPhone(f.acct);
  if (!a || f.pw !== PASS) {
    f.tries++;
    f.top = f.tries >= 5 ? ['warning', '嘗試太多次', '請 10 分鐘後再試，或改用簡訊驗證碼登入。'] : ['danger', '手機號碼或密碼不正確', f.tries >= 3 ? `再錯 ${5 - f.tries} 次要等 10 分鐘。忘記密碼可以用手機重設。` : '請再檢查一次。'];
    f.pw = ''; return render('lg-pw');
  }
  if (!passwordOk(a)) return render();
  afterCredentials(a);
}
function submitCode(kind) {
  const f = state.form, pre = kind === 'otp' ? 'otp' : 'fp'; f.err = {}; f.top = null;
  if (f.step === 1) {
    f.ph = $(`${pre}-ph`).value;
    const digits = f.ph.replace(/\D/g, '');
    if (!digits) f.err.ph = '請輸入手機號碼';
    else if (!/^09\d{8}$/.test(digits)) f.err.ph = '手機號碼是 09 開頭的 10 碼';
    if (f.err.ph) return render(`${pre}-ph`);
    if (state.offline) { f.top = ['neutral', '連不上網路', '傳送驗證碼需要連線。']; return render(); }
    const r = smsSend(digits);
    if (r && r !== 'locked') { f.top = ['warning', '這次沒有傳出驗證碼', `${r}。`]; return render(`${pre}-ph`); }
    f.step = 2; f.code = ''; f.sendErr = ''; tickWait(); return render(r ? `${pre}-lock` : `${pre}-code`);
  }
  if (f.step === 2) {
    const ph = f.ph.replace(/\D/g, '');
    f.code = $(`${pre}-code`).value.replace(/\D/g, '');
    /* a locked number is refused before the code is looked at, even the right one (Enter included) */
    if (smsLock(ph)) { f.code = ''; return render(`${pre}-lock`); }
    if (f.code.length !== 6) { f.err.code = '驗證碼是 6 位數字'; return render(`${pre}-code`); }
    const r = smsCheck(ph, f.code);
    if (r) { f.code = ''; if (r === 'locked') return render(`${pre}-lock`); f.err.code = r; return render(`${pre}-code`); }
    const a = byPhone(f.ph);
    /* a number with no account answers exactly like a wrong code, so nobody can learn which phones have accounts (decided 2026-10-17) */
    if (!a) { f.code = ''; f.err.code = '驗證碼不對，請再看一次簡訊'; return render(`${pre}-code`); }
    if (kind === 'otp') { if (!passwordOk(a)) return render(); return afterCredentials(a); }
    if (a.status !== 'active') { passwordOk(a); f.step = 1; return render(); }
    f.step = 3; f.show = false; return render('fp-npw');
  }
  f.npw = $('fp-npw').value;
  if (!PW_RULES.every(([, fn]) => fn(f.npw))) { f.err.npw = '新密碼還不符合上面的規則'; return render('fp-npw'); }
  const a = byPhone(f.ph);
  state.view = 'login'; state.form = newForm('login', {acct: a.ph, after: f.after, for: f.for}); render('lg-pw');
  say('密碼已更新，請用新密碼登入');
}
let waitT;
function tickWait() { clearInterval(waitT); waitT = setInterval(() => { const f = state.form, el = document.querySelector('[data-key$="-wait"]'); if (!f || f.step !== 2 || !el) return clearInterval(waitT); const left = smsWait(f.ph.replace(/\D/g, '')); if (left <= 0) { clearInterval(waitT); keepCode(); render(); } else el.textContent = `${left} 秒後可以重新傳送`; }, 1000); }
/* a typed code survives a re-render */
function keepCode() { const f = state.form, c = document.querySelector('.code input'); if (f && c) f.code = c.value.replace(/\D/g, ''); }

/* ---------- actions ---------- */
const ACT = {
  pick(el) {
    if (pressed.fired) { pressed.fired = false; return; }
    const id = el.dataset.id;
    if (state.sel === id) return;
    openPad(id);
  },
  closePad, undo,
  digit(el) { digit(el.dataset.d); },
  askUnlock(el) { Object.assign(state.pad, {mode:'unlock', by:el.dataset.by, val:'', err:''}); render('pin-name'); },
  cancelUnlock() { Object.assign(state.pad, {mode:'login', by:null, val:'', err:''}); render('pin-name'); },
  /* leaving the first PIN step drops this sign-in: nobody is added to the device until setup finishes */
  cancelSetup() { state.setup = null; state.pad = null; if (bound().length) ACT.toWall(); else { state.view = 'login'; state.form = newForm('login'); render('f-title'); } },
  menuClose() { state.menu = null; render(); },
  menuRemove(el) { openPad(el.dataset.id, 'remove'); },
  startRemove(el) { openPad(el.dataset.id, 'remove'); },
  addPerson() { state.sel = null; state.pad = null; state.view = 'login'; state.form = newForm('login'); render('f-title'); },
  toPassword(el) { const a = acc(el.dataset.id); state.view = 'login'; state.form = newForm('login', {acct:a.ph, after:'resetPin', for:a.id}); state.sel = null; state.pad = null; render('lg-pw'); },
  toWall() { state.view = 'wall'; state.form = null; state.sel = null; state.pad = null; if (bound().length === 1) openPad(bound()[0].id, 'login', true); render('wall-title'); },
  toLogin() { const f = state.form; state.view = 'login'; state.form = newForm('login', {after:f?.after, for:f?.for, acct: f?.for ? acc(f.for).ph : ''}); render('f-title'); },
  toOtp() { const f = state.form; state.view = 'otp'; state.form = newForm('otp', {after:f.after, for:f.for}); render('f-title'); },
  toForgot() { const f = state.form; state.view = 'forgot'; state.form = newForm('forgot', {after:f.after, for:f.for}); render('f-title'); },
  toggleShow() { const f = state.form; const pw = $('lg-pw') || $('fp-npw'); if (pw) f[pw.id === 'lg-pw' ? 'pw' : 'npw'] = pw.value; const acct = $('lg-acct'); if (acct) f.acct = acct.value; f.show = !f.show; render(); },
  resend() {
    const f = state.form, ph = f.ph.replace(/\D/g, ''), pre = f.kind === 'otp' ? 'otp' : 'fp', r = smsSend(ph);
    f.code = ''; f.err = {}; f.sendErr = r === 'locked' ? '' : r; tickWait(); render(r === 'locked' ? `${pre}-lock` : `${pre}-code`);
    if (!r) say(`驗證碼已重新傳到 ${maskPh(ph)}`);
  },
  rephone() { const f = state.form; f.step = 1; f.code = ''; f.err = {}; render(`${f.kind === 'otp' ? 'otp' : 'fp'}-ph`); },
  restartPin() { Object.assign(state.pad, {mode:'set1', val:'', first:null, err:''}); render(); },
  pushAsk() { state.os = true; renderLayer(); document.querySelector('[data-key="os-yes"]')?.focus(); },
  pushNo() { state.setup.pushDenied = true; acc(state.setup.who).push = 'off'; render('f-title'); },
  osYes() { state.os = false; if (state.view === 'setup') { acc(state.setup.who).push = 'on'; say('通知已開啟'); return nextStep(); } acc(state.session.who).push = 'on'; render(); say('通知已開啟'); },
  osNo() { state.os = false; if (state.view === 'setup') { state.setup.pushDenied = true; acc(state.setup.who).push = 'off'; return render('f-title'); } render(); },
  nextStep,
  pickBranch(el) { state.setup.branch = el.dataset.b; render(); },
  switchUser() { state.session = null; state.view = 'wall'; state.sel = null; state.pad = null; if (bound().length === 1) openPad(bound()[0].id, 'login', true); render('wall-title'); },
  navStub() { say('這個原型只做到登入；看板請打開今日看板原型'); },
  outOk() { state.out = null; ACT.toWall(); if (!bound().length) { state.view = 'login'; state.form = newForm('login'); render('f-title'); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-do]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  if (el.classList.contains('sheet-scrim') && e.target !== el) return;
  e.preventDefault(); ACT[el.dataset.do]?.(el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const k = e.target.dataset.form;
  if (k === 'login') submitLogin(); else submitCode(k);
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'branch') { state.session.branch = e.target.value; render(); say(`已切換到${e.target.value}`); }
});
document.addEventListener('input', e => {
  const f = state.form; if (!f) return;
  if (e.target.id === 'fp-npw') { f.npw = e.target.value; const r = document.querySelector('.rules'); if (r) r.innerHTML = PW_RULES.map(([t, fn]) => { const c = !f.npw ? 'idle' : fn(f.npw) ? 'met' : 'idle'; return `<li class="${c}">${ic(c === 'met' ? 'check' : 'dotI')}${t}</li>`; }).join(''); }
});
/* keyboard: digits and backspace drive whichever pad is showing; Esc closes it */
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (state.os) { if (e.key === 'Escape') ACT.osNo(); return; }
  if (state.pad && !typing && !(state.view === 'wall' && !state.sel)) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); const b = document.querySelector(`.keypad [data-d="${e.key}"]`); b?.classList.add('hit'); setTimeout(() => b?.classList.remove('hit'), 90); return digit(e.key); }
    if (e.key === 'Backspace') { e.preventDefault(); return undo(); }
    if (e.key === 'Escape' && state.view === 'wall' && bound().length > 1) { e.preventDefault(); return closePad(); }
  }
  if (state.menu && e.key === 'Escape') { state.menu = null; render(); return; }
  const card = document.activeElement?.closest?.('.pcard[data-id]');
  if (card && (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) { e.preventDefault(); state.menu = card.dataset.id; render(`_`); document.querySelector(`[data-key="m-remove-${card.dataset.id}"]`)?.focus(); }
});
/* long press on a person's own card opens its one action */
const pressed = {t:null, fired:false};
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.pcard[data-id]'); if (!c || state.sel) return;
  pressed.fired = false; clearTimeout(pressed.t);
  pressed.t = setTimeout(() => { pressed.fired = true; state.menu = c.dataset.id; render(); document.querySelector(`[data-key="m-remove-${c.dataset.id}"]`)?.focus(); }, 600);
});
['pointerup','pointercancel','pointerleave'].forEach(t => document.addEventListener(t, () => clearTimeout(pressed.t)));
document.addEventListener('contextmenu', e => { const c = e.target.closest('.pcard[data-id]'); if (!c) return; e.preventDefault(); clearTimeout(pressed.t); state.menu = c.dataset.id; render(); });
addEventListener('resize', () => { clearTimeout(render.r); render.r = setTimeout(() => render(), 120); });

/* ---------- prototype controls ---------- */
function setTheme(v) { v ? document.documentElement.setAttribute('data-theme', v) : document.documentElement.removeAttribute('data-theme'); }
function applyScale(s) { document.documentElement.style.fontSize = s > 1 ? s * 100 + '%' : ''; document.documentElement.classList.toggle('bigtext', s >= 1.3); }
function kick(reason) {
  const se = state.session;
  if (!se) return say('先登入，才能示範被登出');
  const a = acc(se.who);
  if (reason === 'deact') a.status = 'disabled';
  a.bound = false; a.pin = null; a.fails = 0; a.locked = false;
  state.session = null; clearTimeout(idleT);
  state.out = {who:a.id, reason, by: a.id === 'lin' ? '陳老闆' : '林店長', at: hm(now())};
  $('layer').querySelector('.toast')?.remove(); state.view = 'out'; render('f-title');
}
$('p-go').value = SCENES[params.get('go')] ? params.get('go') : 'wall';
$('p-susp').checked = state.suspended = params.get('suspended') === '1';
$('p-off').checked = state.offline = params.get('offline') === '1';
$('p-theme').value = params.get('theme') || ''; setTheme($('p-theme').value);
$('p-scale').value = ['1.3', '2'].includes(params.get('scale')) ? params.get('scale') : '1'; applyScale(+$('p-scale').value);
$('p-go').onchange = e => { load(e.target.value); render(state.view === 'wall' ? 'wall-title' : 'f-title'); };
$('p-susp').onchange = e => { state.suspended = e.target.checked; render(); };
$('p-off').onchange = e => { state.offline = e.target.checked; render(); };
$('p-theme').onchange = e => setTheme(e.target.value);
$('p-scale').onchange = e => { applyScale(+e.target.value); render(); };
$('p-idle').onclick = () => state.session ? idleOut() : say('先登入，才能示範閒置');
$('p-deact').onclick = () => kick('deact');
$('p-unbind').onclick = () => kick('unbind');
/* 快轉: the demo clock jumps, so a code can expire, a wait can end and a lock can lift without waiting */
const fastForward = min => { skew += min * 60000; keepCode(); const k = document.activeElement?.dataset?.key; render(); if (k) document.querySelector(`[data-key="${k}"]`)?.focus(); tickWait(); say(`簡訊時間快轉 ${min} 分鐘，現在 ${hm(now())}`); };
$('p-ff1').onclick = () => fastForward(1);
$('p-ff10').onclick = () => fastForward(10);
load($('p-go').value);
render();
</script>
