<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寵派小管家原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232E211B%22/%3E%3Cg fill=%22%23F6EFE7%22%3E%3Ccircle cx=%227%22 cy=%2210%22 r=%221.6%22/%3E%3Ccircle cx=%2210.5%22 cy=%226.5%22 r=%221.6%22/%3E%3Ccircle cx=%2214.5%22 cy=%226.5%22 r=%221.6%22/%3E%3Ccircle cx=%2218%22 cy=%2210%22 r=%221.6%22/%3E%3Cpath d=%22M12.5 11c2.6 0 5 3.3 5 5.6 0 1.5-1.2 2.1-2.4 2.1-1.1 0-1.7-.5-2.6-.5s-1.5.5-2.6.5c-1.2 0-2.4-.6-2.4-2.1 0-2.3 2.4-5.6 5-5.6z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/Huninn-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 暖心生活 App world: the prototype index. Staff tokens copied from prototypes/m01-dashboard; no new color tokens.
   Each main flow is drawn in the 客服支援 trace vocabulary: a stop with a prototype is solid, a stop without one is dashed. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--surface:#FFFFFF;--surface-2:#FBF6F0;--sunk:#F1E7DC;--sunk-hover:#E9DCCE;
  --ink:#2B211C;--ink-muted:#6E6058;--border:#EADFD3;--control-border:#9A8878;--track:#E6D9CC;--hair:#F3EBE2;
  --act:#FF6B3D;--act-hover:#FF7E55;--on-act:#2B160C;--act-tint:#FFE5DA;--act-ink:#B5431A;
  --rail:#2E211B;--rail-ink:#DCCDC0;--rail-cur:#F6EFE7;
  --focus:#2B211C;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--info:#1D5FA8;--info-bg:#E0EEFB;
  --neutral:#4A4F57;--neutral-bg:#ECEDEF;--boarding:#5B3BA6;--boarding-bg:#EDE7FA;
  --sh-1:0 1px 2px rgba(74,48,30,.06),0 4px 14px rgba(74,48,30,.07);
  --sh-2:0 2px 4px rgba(74,48,30,.07),0 10px 28px rgba(74,48,30,.11);
  --r-md:12px;--r-lg:18px;--r-xl:24px;
  --out:cubic-bezier(.16,1,.3,1);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;--hair:#2B221C;
  --act:#FF8257;--act-hover:#FF956F;--act-tint:#4A2618;--act-ink:#FFA584;
  --rail:#0E0A08;--rail-ink:#BCAEA3;--rail-cur:#F6EDE6;--focus:#F6EDE6;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--info:#8CC2F5;--info-bg:#14304F;
  --neutral:#C3C7CE;--neutral-bg:#2E3136;--boarding:#C6B3F5;--boarding-bg:#2D2347;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.28);--sh-2:0 2px 4px rgba(0,0,0,.32),0 10px 28px rgba(0,0,0,.36);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15100D;--surface:#211915;--surface-2:#271E19;--sunk:#30261F;--sunk-hover:#3B2F27;
  --ink:#F6EDE6;--ink-muted:#BCAEA3;--border:#3A2E27;--control-border:#8D7C6F;--track:#46382F;--hair:#2B221C;
  --act:#FF8257;--act-hover:#FF956F;--act-tint:#4A2618;--act-ink:#FFA584;
  --rail:#0E0A08;--rail-ink:#BCAEA3;--rail-cur:#F6EDE6;--focus:#F6EDE6;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--info:#8CC2F5;--info-bg:#14304F;
  --neutral:#C3C7CE;--neutral-bg:#2E3136;--boarding:#C6B3F5;--boarding-bg:#2D2347;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.28);--sh-2:0 2px 4px rgba(0,0,0,.32),0 10px 28px rgba(0,0,0,.36);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--control-border) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--font);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased}
::selection{background:var(--act-tint);color:var(--ink)}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px;border-radius:8px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}

/* ---------- header ---------- */
.top{background:var(--rail);color:var(--rail-cur)}
.top-in{max-width:1200px;margin:0 auto;padding:28px 24px 30px;display:grid;grid-template-columns:auto 1fr auto;gap:18px 20px;align-items:center}
.mark{width:52px;height:52px;border-radius:50%;background:var(--rail-cur);color:var(--rail);display:grid;place-items:center}
.mark .ico{width:30px;height:30px;fill:currentColor;stroke:none}
.top h1{font-size:1.75rem;font-weight:900;line-height:1.25;letter-spacing:.01em}
.top p{color:var(--rail-ink);font-weight:700;font-size:.9375rem;margin-top:2px;text-wrap:pretty}
.tally{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tally span{display:inline-flex;align-items:baseline;gap:4px;padding:6px 12px;border-radius:999px;background:rgba(246,239,231,.1);font-weight:800;font-size:.8125rem;color:var(--rail-ink);white-space:nowrap}
.tally b{font-size:1.0625rem;color:var(--rail-cur);font-weight:900}
.theme{display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(246,239,231,.28);background:transparent;color:var(--rail-cur);font:800 .8125rem var(--font);cursor:pointer}
.theme:hover{border-color:var(--rail-cur)}

/* ---------- layout ---------- */
main{max-width:1200px;margin:0 auto;padding:36px 24px 72px}
.sec+.sec{margin-top:56px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:1.375rem;font-weight:900;line-height:1.25}
.sec-h p{color:var(--ink-muted);font-weight:700;font-size:.875rem;max-width:60ch}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8125rem;font-weight:800;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid var(--ink)}
.legend i.gap{border-top:3px dashed var(--control-border)}

/* ---------- flows: one trace per flow ---------- */
.flows{display:grid;gap:14px}
.flow{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px 22px 18px;display:grid;grid-template-columns:220px 1fr;gap:16px 24px;align-items:start}
.flow-h h3{font-size:1.0625rem;font-weight:900;line-height:1.3}
.flow-h .who{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.flow-h .note{margin-top:10px;font-size:.8125rem;font-weight:700;color:var(--ink-muted);line-height:1.45;text-wrap:pretty}
.flow-h .note.warn{color:var(--warning)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:800;line-height:1.5;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.chip.owner{background:var(--act-tint);color:var(--act-ink)}
.chip.floor{background:var(--success-bg);color:var(--success)}
.chip.shop{background:var(--info-bg);color:var(--info)}
.chip.plat{background:var(--neutral-bg);color:var(--neutral)}
.chip.stay{background:var(--boarding-bg);color:var(--boarding)}
.chip.warn{background:var(--warning-bg);color:var(--warning)}

.trace{display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.stop{position:relative;flex:1 0 132px;min-width:132px;max-width:220px;padding-top:26px;scroll-snap-align:start}
/* the line runs from this stop's node to the next one */
.stop::before{content:"";position:absolute;left:9px;right:-9px;top:8px;border-top:3px solid var(--ink)}
.stop:last-child::before{display:none}
.stop.gap::before,.stop:has(+ .gap)::before{border-top-style:dashed;border-top-color:var(--control-border)}
.node{position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--surface)}
.stop.gap .node{background:var(--surface);border:2.5px dashed var(--control-border)}
.stop.last .node{background:var(--act)}
.stop a,.stop .nolink{display:block;margin-right:12px;padding:8px 10px 9px;border-radius:var(--r-md);text-decoration:none;transition:background-color .2s var(--out),transform .2s var(--out)}
.stop a:hover{background:var(--sunk)}
.stop a:active{transform:scale(.97);transition-duration:.08s}
.stop b{display:block;font-weight:900;font-size:.9375rem;line-height:1.35;text-wrap:balance}
.stop small{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:.75rem;font-weight:800;color:var(--ink-muted);line-height:1.4}
.stop a small .ico{opacity:0;transform:translateX(-4px);transition:opacity .2s var(--out),transform .2s var(--out)}
.stop a:hover small .ico,.stop a:focus-visible small .ico{opacity:1;transform:none}
.stop.gap .nolink{border:1.5px dashed var(--control-border)}
.stop.gap b{color:var(--ink-muted)}
.stop.gap small{color:var(--warning)}

/* ---------- directory: four ends ---------- */
.ends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.end{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.end-h{padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.end-h h3{font-size:1.0625rem;font-weight:900;display:flex;align-items:center;gap:8px}
.end-h h3 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.end-h p{margin-top:4px;font-size:.8125rem;font-weight:700;color:var(--ink-muted);text-wrap:pretty}
.pages li+li{border-top:1px solid var(--hair)}
.pg{display:block;padding:12px 18px 13px}
.pg>a{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-weight:900;font-size:.9375rem;line-height:1.35}
.pg>a:hover{text-decoration:underline;text-decoration-thickness:2px}
.pg>a code{font:800 .6875rem/1 var(--font);letter-spacing:.02em;color:var(--ink-muted);background:var(--sunk);padding:3px 6px;border-radius:6px;flex:none;transform:translateY(-1px)}
.pg .roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.pg .roles a{display:inline-flex;align-items:center;min-height:28px;padding:0 9px;border-radius:999px;border:1.5px solid var(--border);font-size:.75rem;font-weight:800;color:var(--ink-muted);text-decoration:none;transition:border-color .15s,color .15s}
.pg .roles a:hover{border-color:var(--ink);color:var(--ink)}
.pg .desc{margin-top:4px;font-size:.8125rem;font-weight:700;color:var(--ink-muted);line-height:1.45;text-wrap:pretty}

/* ---------- gaps ---------- */
.extra{margin-top:14px;font-size:.8125rem;font-weight:700;color:var(--ink-muted)}
.extra a{font-weight:800;color:var(--ink)}

footer{max-width:1200px;margin:0 auto;padding:0 24px 40px;color:var(--ink-muted);font-size:.8125rem;font-weight:700}

/* ---------- responsive ---------- */
@media (max-width: 1080px){.ends{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 820px){
  .flow{grid-template-columns:1fr;gap:12px}
  .top-in{grid-template-columns:auto 1fr}
  .tally{grid-column:1 / -1;justify-content:flex-start}
}
@media (max-width: 640px){
  .top-in{padding:22px 16px 24px}
  .top h1{font-size:1.5rem}
  main{padding:28px 16px 56px}
  footer{padding:0 16px 32px}
  .ends{grid-template-columns:1fr}
  .flow{padding:18px 16px 14px}
  /* phone: the trace turns on its side, nodes down the left */
  .trace{flex-direction:column;overflow:visible;padding:0}
  .stop{flex:none;max-width:none;min-width:0;padding:0 0 4px 30px}
  .stop::before{left:8px;right:auto;top:10px;bottom:-10px;border-top:0;border-left:3px solid var(--ink)}
  .stop.gap::before,.stop:has(+ .gap)::before{border-left-style:dashed;border-left-color:var(--control-border)}
  .node{top:10px}
  .stop a,.stop .nolink{margin-right:0}
  .stop a small .ico{opacity:1;transform:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div class="top-in">

<main>

    </div>
    <div class="ends" id="ends"></div>

  <section class="sec">
    <p class="extra">設計比較稿，不是產品畫面：<a href="today-board/looks-compare.html">今日看板外觀比較</a>・<a href="today-board/handover-compare.html">平板簽署交接比較</a></p>

</main>
<footer>原型只在瀏覽器裡模擬，不會送出任何資料。規格以 docs/ 內的主流程 Wireflow 與 V1.0b 補丁為準。</footer>

const chip = k => `<span class="chip ${WHO[k][0]}">${WHO[k][1]}</span>`;
const stop = ([what, page, href], i, all) => {
  const end = i === all.length - 1 ? ' last' : '';
  if (!href) return `<li class="stop gap${end}"><span class="node"></span><span class="nolink"><b>${esc(what)}</b><small>${ic('warn')}${esc(page)}</small></span></li>`;
  return `<li class="stop${end}"><span class="node"></span><a href="${href}"><b>${esc(what)}</b><small>${esc(page)}${ic('fwd')}</small></a></li>`;
};
document.getElementById('flows').innerHTML = FLOWS.map(f => `<li class="flow">
  <div class="flow-h"><h3>${esc(f.t)}</h3><div class="who">${f.who.map(chip).join('')}</div>${f.note ? `<p class="note${f.warn ? ' warn' : ''}">${esc(f.note)}</p>` : ''}</div>
  <ol class="trace" aria-label="${esc(f.t)}的步驟">${f.stops.map(stop).join('')}</ol></li>`).join('');

const href = (dir, role) => `${dir}/index.html${role ? `?role=${role}` : ''}`;
document.getElementById('ends').innerHTML = ENDS.map(e => `<section class="end" style="--c:${e.c}" aria-labelledby="e-${e.pages[0][2]}">
  <div class="end-h"><h3 id="e-${e.pages[0][2]}"><i aria-hidden="true"></i>${e.t}</h3><p>${e.d}</p></div>
  <ul class="pages">${e.pages.map(([code, name, dir, roles, d]) => `<li class="pg">
    <a href="${href(dir, roles[0])}">${code ? `<code>${code}</code>` : ''}<span>${name}</span></a>
    <p class="desc">${d}</p>
    ${roles.length > 1 ? `<div class="roles" aria-label="${name}換身分看">${roles.map(r => `<a href="${href(dir, r)}">${R[r]}</a>`).join('')}</div>` : ''}</li>`).join('')}</ul></section>`).join('');

/* theme: follows the system until the viewer picks one */
const btn = document.getElementById('theme');
const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const paint = () => { const d = dark(); btn.setAttribute('aria-pressed', String(d)); btn.innerHTML = `${ic(d ? 'sun' : 'moon')}<span>${d ? '淺色' : '深色'}</span>`; };
try { const t = localStorage.getItem('proto-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
btn.addEventListener('click', () => { const t = dark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('proto-theme', t); } catch (e) {} paint(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
paint();
</script>
