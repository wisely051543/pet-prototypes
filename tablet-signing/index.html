<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平板簽署原型</title>
<script src="../test-kit/kit.js" data-proto="tablet-signing"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232E211B%22/%3E%3Cg fill=%22%23F6EFE7%22%3E%3Ccircle cx=%227.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Ccircle cx=%2210.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2213.5%22 cy=%227.5%22 r=%221.6%22/%3E%3Ccircle cx=%2216.5%22 cy=%2210.5%22 r=%221.6%22/%3E%3Cpath d=%22M8.5 16c0-2.2 1.6-4 3.5-4s3.5 1.8 3.5 4c0 1.7-1.6 2-3.5 2s-3.5-.3-3.5-2Z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/Huninn-subset.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* 暖心生活 App world, owner side. Status colors are the fixed set shared by every surface and shop; the shop brand slot replaces persimmon. */
@font-face{font-family:"Nunito";src:url(fonts/Nunito-latin.woff2) format("woff2");font-weight:500 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Huninn";src:url(fonts/Huninn-subset.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#F6EFE7;--sunk:#F1E7DC;--ink:#2B211C;--ink-muted:#6E6058;
  --act:#FF6B3D;--on-act:#2B160C;--act-tint:#FFE5DA;
  --success:#1E6B3A;--success-bg:#E3F4EA;--warning:#8A5300;--warning-bg:#FDF0D5;--danger:#B4231B;--danger-bg:#FCE4E2;
  --info:#1D5FA8;--info-bg:#E0EEFB;--neutral:#4A4F57;--neutral-bg:#ECEDEF;
  --danger-solid:#C62F25;--on-danger-solid:#FFFFFF;
  --toast:#2E211B;--on-toast:#FFFFFF;--scrim:#2B211C8C;
  --sig-ink:#2B211C;--sig-paper:#FFFFFF;
  --owner-surface:#FFFFFF;--owner-surface-variant:#F6EFE7;--owner-ink:#2B211C;--owner-ink-muted:#6E6058;--owner-border:#EADFD3;--owner-control-border:#9A8878;
  --ring-ahead:#927F70;
  --proto-bg:#1F1612;--proto-ink:#F1E7DC;--proto-muted:#BCAEA3;--proto-line:#4A3A31;
  --lift:0 1px 2px rgb(74 44 26 / .06),0 8px 20px -10px rgb(74 44 26 / .22);
  --lift-hi:0 2px 4px rgb(74 44 26 / .07),0 18px 36px -14px rgb(74 44 26 / .30);
  --font:"Nunito","Huninn",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r-md:14px;--r-xl:28px;--r-owner-lg:16px;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --protoh:48px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15100D;--sunk:#30261F;--ink:#F6EDE6;--ink-muted:#BCAEA3;
  --act:#FF8257;--on-act:#2B160C;--act-tint:#4A2618;
  --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
  --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
  --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;
  --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
  --owner-surface:#211915;--owner-surface-variant:#15100D;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
  --ring-ahead:#8D7C6F;
  --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
  --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
  --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--sunk:#30261F;--ink:#F6EDE6;--ink-muted:#BCAEA3;
    --act:#FF8257;--on-act:#2B160C;--act-tint:#4A2618;
    --success:#8EDBA9;--success-bg:#173B26;--warning:#F5C46A;--warning-bg:#3F2E0B;--danger:#FF9C94;--danger-bg:#47191A;
    --info:#8CC2F5;--info-bg:#14304F;--neutral:#C3C7CE;--neutral-bg:#2E3136;
    --danger-solid:#D23A30;--on-danger-solid:#FFFFFF;
    --toast:#F6EDE6;--on-toast:#15100D;--scrim:#000000B3;
    --owner-surface:#211915;--owner-surface-variant:#15100D;--owner-ink:#F6EDE6;--owner-ink-muted:#BCAEA3;--owner-border:#3A2E27;--owner-control-border:#8D7C6F;
    --ring-ahead:#8D7C6F;
    --proto-bg:#F1E7DC;--proto-ink:#2B211C;--proto-muted:#6E6058;--proto-line:#D3C3B3;
    --lift:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -12px rgb(0 0 0 / .65);
    --lift-hi:0 2px 4px rgb(0 0 0 / .4),0 20px 40px -16px rgb(0 0 0 / .75);
    color-scheme:dark;
  }
}
html.bigtext{font-size:125%}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
::selection{background:var(--brand-tint);color:var(--owner-ink)}
input{caret-color:var(--owner-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--owner-control-border) transparent}
:focus-visible{outline:3px solid var(--owner-ink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-feature-settings:"tnum"}

/* ---------- prototype strip (not product UI, never part of the owner's screen) ---------- */
.proto{position:fixed;top:0;left:0;right:0;z-index:90;height:var(--protoh);background:var(--proto-bg);color:var(--proto-ink);font-size:.8125rem;display:flex;align-items:center;gap:6px 14px;padding:0 14px;overflow-x:auto;white-space:nowrap}
.proto b{font-weight:800}
.proto .muted{color:var(--proto-muted)}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select{background:transparent;border:1px solid var(--proto-line);border-radius:8px;padding:4px 8px;min-height:32px;color:var(--proto-ink);font-size:.8125rem}
.proto select option{color:#2B211C;background:#fff}
.proto input[type=checkbox]{width:16px;height:16px;accent-color:var(--proto-ink)}
.proto :focus-visible{outline-color:var(--proto-ink)}
.proto .note{margin-left:auto;padding-left:10px;border-left:1px solid var(--proto-line)}
.proto .note b{font-feature-settings:"tnum";letter-spacing:.06em}

/* ---------- staff stand-in (prototype only: replaces the 今日看板 around the hand-over) ---------- */
.staff{padding:calc(var(--protoh) + 32px) 24px 48px;max-width:880px;margin:0 auto}
.staff h1{font-size:1.5rem;font-weight:900}
.staff .lead{color:var(--ink-muted);font-weight:600;margin:4px 0 20px;max-width:40em}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--owner-surface);border-radius:20px;padding:14px 16px;box-shadow:var(--lift);margin-bottom:12px}
.srow .face{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-weight:900;color:var(--ink-muted)}
.srow .face img{width:100%;height:100%;object-fit:cover}
.srow b{font-size:1.125rem;font-weight:900}
.srow .meta{font-size:.875rem;font-weight:700;color:var(--ink-muted)}
.srow .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:.8125rem;font-weight:800}
.tag.warning{background:var(--warning-bg);color:var(--warning)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.success{background:var(--success-bg);color:var(--success)}
.tag.neutral{background:var(--neutral-bg);color:var(--neutral)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}
.abtn{min-height:48px;padding:0 20px;border-radius:999px;background:var(--act);color:var(--on-act);font-weight:900;white-space:nowrap;transition:transform .3s var(--spring)}
.abtn:active{transform:scale(.96);transition-duration:.08s}
.abtn[aria-disabled="true"]{background:transparent;color:var(--ink-muted);border:2px dashed var(--owner-control-border);cursor:not-allowed}
.srow .why{grid-column:3;font-size:.8125rem;font-weight:700;color:var(--ink-muted);text-align:right}
.srow.flash{animation:lit 1.6s var(--out)}
@keyframes lit{0%,55%{outline:3px solid var(--owner-ink);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;background:var(--toast);color:var(--on-toast);padding:12px 20px;border-radius:999px;font-weight:800;box-shadow:var(--lift-hi);animation:rise .35s var(--out);max-width:calc(100vw - 32px)}
@keyframes rise{from{transform:translate(-50%,16px);opacity:0}}

/* ---------- tablet sign mode ---------- */
/* focus and the active code field use owner ink, so a shop brand near danger never carries focus */
.handover{position:fixed;top:var(--protoh);left:0;right:0;bottom:0;z-index:60;background:var(--owner-surface-variant);color:var(--owner-ink);display:flex;flex-direction:column;font-size:1rem}
.signbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:68px;padding:10px 20px;background:var(--owner-surface);border-bottom:1px solid var(--owner-border)}
.signbar .who{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;min-width:0}
.signbar .step{font-size:1.125rem;font-weight:900;text-align:center}
.signbar .n{justify-self:end;display:flex;align-items:center;gap:10px;font-size:.9375rem;font-weight:800;color:var(--owner-ink-muted)}
.signbar .pause{min-height:44px;padding:0 14px;border-radius:999px;font-weight:800;font-size:.875rem;color:var(--owner-ink-muted);background:var(--owner-surface-variant);white-space:nowrap}
.signbar .pause:hover{color:var(--owner-ink)}
.signbar .ring{display:inline-grid}
.hoback{display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 16px 0 8px;border-radius:999px;font-weight:800;color:var(--owner-ink)}
.hoback:hover{background:var(--owner-surface-variant)}
.logo{width:64px;height:64px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:1.625rem;font-weight:900;line-height:1;flex:none}
.logo.s{width:36px;height:36px;border-radius:12px;font-size:1.0625rem}

/* body: on a landscape tablet the pet's ring stands beside the reading column as the progress */
.ho-body{flex:1;display:flex;min-height:0}
.ho-side{display:none}
.ho-stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ho-main{flex:1;overflow:auto;padding:28px 28px 32px;overscroll-behavior:contain}
.ho-col{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ho-col.wide{max-width:940px}
.ho-col{container-type:inline-size}
.ho-col.mid{min-height:100%;justify-content:center}
.ho-col>h2{font-size:1.625rem;font-weight:900;line-height:1.3;text-wrap:balance}
.ho-col>.sub{font-size:1rem;color:var(--owner-ink-muted);font-weight:600;line-height:1.6;margin-top:-8px}
.ho-col>.sub+.sub{margin-top:-14px}
.ho-foot{background:var(--owner-surface);border-top:1px solid var(--owner-border);padding:14px 28px calc(14px + env(safe-area-inset-bottom))}
.ho-foot .in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ho-foot.wide .in{max-width:940px}
.ho-foot .hint{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted);text-align:center}
@media (min-width:1000px) and (orientation:landscape){
  .ho-side{display:flex;flex-direction:column;align-items:center;gap:14px;width:300px;flex:none;padding:36px 28px;border-right:1px solid var(--owner-border);overflow:auto;text-align:center}
  .ho-side .pname{font-size:1.375rem;font-weight:900;line-height:1.3}
  .ho-side .psvc{font-size:.9375rem;font-weight:700;color:var(--owner-ink-muted);margin-top:-8px}
  .hsteps{list-style:none;align-self:stretch;margin-top:14px;display:flex;flex-direction:column;gap:2px;text-align:left}
  .hsteps li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-weight:700;color:var(--owner-ink-muted)}
  .hsteps .dot{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--ring-ahead);display:grid;place-items:center}
  .hsteps .dot .ico{width:14px;height:14px;stroke-width:3}
  .hsteps li.done{color:var(--owner-ink)}
  .hsteps li.done .dot{background:var(--owner-ink);border-color:var(--owner-ink);color:var(--owner-surface-variant)}
  .hsteps li.cur{background:var(--owner-surface);color:var(--owner-ink);font-weight:900;box-shadow:var(--lift)}
  .hsteps li.cur .dot{border:7px solid var(--brand)}
  .signbar .ring{display:none}
}

.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:14px 20px;border-radius:18px;background:var(--brand);color:var(--on-brand);font-size:1.125rem;font-weight:900;width:100%;border:2px solid transparent;transition:transform .35s var(--spring),filter .2s var(--out)}
.obtn:hover{filter:brightness(1.07)}
.obtn:active:not([aria-disabled="true"]){transform:scale(.97);transition-duration:.08s}
.obtn.sec{background:var(--owner-surface);color:var(--owner-ink);border-color:var(--owner-control-border);font-weight:800}
.obtn.sec:hover{filter:none;border-color:var(--owner-ink)}
.obtn[aria-disabled="true"]{background:transparent;color:var(--owner-ink-muted);border:2px dashed var(--owner-control-border);cursor:not-allowed;filter:none}
.obtn.big{min-height:68px;width:min(420px,100%)}
.holink{min-height:44px;padding:0 10px;font-weight:800;font-size:.9375rem;color:var(--owner-ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;border-radius:999px;align-self:center}
.holink:hover{background:var(--owner-surface-variant)}
.holink[aria-disabled="true"]{color:var(--owner-ink-muted);text-decoration:none;cursor:not-allowed}
.hold{position:relative;overflow:hidden;isolation:isolate;padding:0 16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold-fill{position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--owner-border);transform:scaleX(0);transform-origin:left;transition:transform .2s var(--out)}
.hold.holding .hold-fill{transform:scaleX(1);transition:transform 2s linear}

/* start / end */
.ho-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;position:relative}
.ho-center h2{font-size:1.75rem;font-weight:900;line-height:1.3}
.ho-center p{font-size:1.0625rem;color:var(--owner-ink-muted);font-weight:800;line-height:1.6;max-width:28em}
.ho-start .store{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:12px;text-align:left;font-size:1.125rem;font-weight:900}
.ho-start .store small{display:block;font-size:.9375rem;color:var(--owner-ink-muted);font-weight:700}
.ho-start .logo{width:48px;height:48px;border-radius:var(--r-md);font-size:1.375rem}
.ho-start .pet{font-size:1.1875rem;font-weight:800;color:var(--owner-ink-muted);margin-top:4px}
.ho-start h2{font-size:clamp(2rem,4.4vw,2.75rem);margin-bottom:18px;text-wrap:balance}
.ho-start .holink{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));color:var(--owner-ink-muted)}
.ho-start .offnote{font-weight:800;color:var(--owner-ink-muted);margin-top:-8px}
.ho-center .sface{margin-bottom:6px}
@media (max-height:640px){.ho-start .sface{--s:150px!important}.ho-start .store,.ho-start .holink{position:static}}
.endsum{display:grid;grid-template-columns:auto auto;gap:6px 16px;font-weight:700;text-align:left;margin-top:4px}
.endsum dt{color:var(--owner-ink-muted)}

/* 臉環 for the signing session: one segment per step. done = owner ink, current = brand, ahead = pale; closed and checked on 簽署完成 */
.sface{--s:56px;position:relative;flex:none;width:var(--s);height:var(--s);display:inline-grid;place-items:center}
.sface>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.sface circle{fill:none;stroke:var(--ring-ahead);stroke-width:3.5;stroke-linecap:round;transition:stroke .4s var(--out)}
.sface circle.done{stroke:var(--owner-ink);stroke-width:6}
.sface circle.cur{stroke:var(--brand);stroke-width:8.5}
.sface.closed circle{stroke:var(--brand);stroke-width:7}
.sface img,.sface .ini{width:calc(var(--s) * .76);height:calc(var(--s) * .76);border-radius:50%;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:calc(var(--s) * .3);color:var(--owner-ink-muted)}
.sface .ok,.sface .flag{position:absolute;right:2%;bottom:2%;width:calc(var(--s) * .3);height:calc(var(--s) * .3);border-radius:50%;display:grid;place-items:center;border:4px solid var(--owner-surface-variant)}
.sface .ok{background:var(--brand);color:var(--on-brand);animation:pop .5s var(--spring) .35s both}
.sface .ok .ico{width:58%;height:58%;stroke-width:3}
.sface .flag .ico{width:56%;height:56%;stroke-width:2.6}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.tone-info .flag{background:var(--info-bg);color:var(--info)}
.tone-warn .flag{background:var(--warning-bg);color:var(--warning)}
.tone-danger .flag{background:var(--danger-solid);color:var(--on-danger-solid)}
.endnote,.pausenote{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:.9375rem}
.endnote .ico,.pausenote .ico{width:18px;height:18px}
.tone-info .endnote{background:var(--info-bg);color:var(--info)}
.tone-warn .endnote,.pausenote{background:var(--warning-bg);color:var(--warning)}
.tone-danger .endnote{background:var(--danger-bg);color:var(--danger)}
.sface.closing circle{stroke-dasharray:0 600;animation:segclose .7s var(--out) forwards}
.sface.closing circle:nth-child(2){animation-delay:.08s}.sface.closing circle:nth-child(3){animation-delay:.16s}.sface.closing circle:nth-child(4){animation-delay:.24s}.sface.closing circle:nth-child(5){animation-delay:.32s}
@keyframes segclose{to{stroke-dasharray:var(--len) 600}}
/* the one authored moment: the owner's space rises when signing mode opens, and the ring closes on 簽署完成 */
.handover.enter{animation:hoin .55s var(--out) both}
.handover.enter .sface{animation:hoface .7s var(--spring) .12s both}
@keyframes hoin{from{opacity:0;transform:translateY(24px);clip-path:inset(6% 3% 0 3% round 28px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 0)}}
@keyframes hoface{from{opacity:0;transform:scale(.86)}}

/* notices inside the owner column */
.ho-card{background:var(--owner-surface);border-radius:var(--r-owner-lg);padding:20px 22px;box-shadow:var(--lift)}
.ho-card h3{font-size:1.0625rem;font-weight:900;margin-bottom:10px}
.ho-card h3 small{margin-left:8px;font-size:.8125rem;font-weight:700;color:var(--owner-ink-muted)}
.ho-pet{display:flex;align-items:center;gap:14px}
.ho-pet img,.ho-pet .ini{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:var(--owner-ink-muted)}
.ho-pet b{display:block;font-size:1.25rem;font-weight:900}
.ho-pet span{font-size:.9375rem;font-weight:700;color:var(--owner-ink-muted)}
.ho-dl{display:grid;grid-template-columns:5.5rem 1fr;gap:10px 14px;font-size:1rem;font-weight:700;margin-top:14px}
.ho-dl dt{color:var(--owner-ink-muted)}
.readmark,.vernote{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-weight:800;line-height:1.5}
.readmark{background:var(--success-bg);color:var(--success)}
.vernote{background:var(--info-bg);color:var(--info)}
.vernote b{display:block;font-size:1.125rem;font-weight:900}
.vernote span{font-weight:700}
.readmark .ico,.vernote .ico{width:22px;height:22px;stroke-width:2.4;margin-top:2px}
.keylist{list-style:none;display:flex;flex-direction:column}
.keylist li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--owner-border);font-weight:700}
.keylist li:first-child{border-top:0}
/* money and authorization clauses carry their plain-language point at signing time, even when read at home */
.keylist .kt{min-width:0}
.keylist .plain{display:block;margin-top:3px;font-size:.9375rem;font-weight:600;line-height:1.55;color:var(--owner-ink);text-wrap:pretty}
.keylist li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand);transform:translateY(-2px)}
.ho-ver{font-size:.875rem;font-weight:700;color:var(--owner-ink-muted);margin-top:10px}
.upd{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;margin-left:8px;border-radius:999px;background:var(--info-bg);color:var(--info);font-size:.75rem;font-weight:900;vertical-align:2px}
.netbar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--warning-bg);color:var(--warning);font-weight:800}
.netbar .ico{width:20px;height:20px;stroke-width:2.2}
.netbar .holink{margin-left:auto;color:var(--warning)}

/* full text */
.doc{background:var(--owner-surface);border-radius:var(--r-owner-lg);padding:26px 28px;line-height:1.85;font-size:1.0625rem;max-width:70ch}
.doc h3{font-size:1.125rem;font-weight:900;margin:22px 0 6px}
.doc h3:first-child{margin-top:0}
.doc p{font-weight:500}
.doc .key{margin:14px -12px 4px;padding:14px 14px 10px;border-radius:14px;background:var(--brand-tint)}
.doc .key h3{margin-top:0}
.doc .key h3 small{margin-left:8px;font-size:.8125rem;font-weight:800;color:var(--brand-ink);vertical-align:2px}
.tick{display:flex;align-items:center;gap:12px;min-height:52px;margin-top:8px;padding:6px 12px;border-radius:12px;background:var(--owner-surface);font-weight:800;cursor:pointer;border:2px solid var(--owner-control-border)}
.tick input{appearance:none;width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--owner-control-border);display:grid;place-items:center;background:var(--owner-surface);cursor:pointer}
.tick input:checked{background:var(--brand);border-color:var(--brand)}
.tick input:checked::after{content:"";width:12px;height:7px;border-left:3px solid var(--on-brand);border-bottom:3px solid var(--on-brand);transform:rotate(-45deg) translate(1px,-1px)}
.tick:has(input:checked){border-color:var(--brand)}
.tick input:focus-visible{outline:none}
.tick:has(input:focus-visible){outline:3px solid var(--owner-ink);outline-offset:3px}
.docend{margin-top:26px;padding-top:16px;border-top:2px dashed var(--owner-border);text-align:center;font-weight:800;color:var(--owner-ink-muted)}
.conds{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conds li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--owner-surface-variant);font-size:.9375rem;font-weight:800;color:var(--owner-ink-muted)}
.conds li .c{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--owner-control-border);display:grid;place-items:center}
.conds li.ok{color:var(--owner-ink)}
.conds li.ok .c{background:var(--success);border-color:var(--success);color:var(--success-bg)}
.conds li.ok .c .ico{width:14px;height:14px;stroke-width:3}
.conds li .v{margin-left:auto;font-size:.8125rem;font-feature-settings:"tnum"}

/* sheet and dialogs */
.hosheet-scrim{position:fixed;inset:var(--protoh) 0 0 0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--out)}
.hosheet-scrim.center{align-items:center}
@keyframes fade{from{opacity:0}}
.hosheet{width:min(680px,100%);background:var(--owner-surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sheet .35s var(--out)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.hosheet .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hosheet h2{font-size:1.375rem;font-weight:900}
.hosheet p{font-size:1rem;font-weight:600;line-height:1.7;color:var(--owner-ink-muted)}
.hosheet .opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.hosheet .opts .obtn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:2px;min-height:68px}
.hosheet .opts .obtn small{font-size:.875rem;font-weight:600;color:var(--owner-ink-muted)}
.hosheet.ho-dialog{border-radius:24px;width:min(460px,92vw)}
.hosheet.ho-dialog.wide{width:min(500px,92vw)}
.ho-dialog .row2{display:flex;gap:10px;flex-wrap:wrap}
.ho-dialog .row2 .obtn{flex:1 1 12em}
.xbtn{min-height:44px;padding:0 14px;border-radius:999px;font-weight:800;background:var(--owner-surface-variant)}

/* pet data */
.prow{display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--owner-border)}
.prow:first-of-type{border-top:0}
.prow .k{font-weight:800;color:var(--owner-ink-muted);font-size:.9375rem}
.prow .v{font-weight:800;font-size:1.0625rem;line-height:1.5}
.prow .src{grid-column:2;font-size:.8125rem;font-weight:800;color:var(--owner-ink-muted)}
.prow.staff{margin:0 -12px;padding:14px 12px;border-radius:14px;background:var(--warning-bg);border-top-color:transparent}
.prow.staff .src{color:var(--warning)}
.prow.staff+.prow{border-top-color:transparent}
.prow.staff+.prow.staff{margin-top:6px}
.prow .acts{grid-column:3;grid-row:1 / span 2;display:flex;gap:8px}
.prow .acts button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:.9375rem;background:var(--owner-surface);border:2px solid var(--owner-control-border)}
.prow .acts button.yes{border-color:var(--owner-ink)}
.prow .acts button[aria-pressed="true"]{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.prow .edit{grid-column:2 / -1;display:flex;gap:8px}
.prow .edit input{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--owner-control-border);padding:0 12px;font-size:1rem;background:var(--owner-surface)}
.prow .edit button{min-height:48px;padding:0 16px;border-radius:12px;font-weight:900;background:var(--owner-ink);color:var(--owner-surface)}
.prow .was{grid-column:2;font-size:.8125rem;font-weight:800;color:var(--info)}

/* ID number: entered once, confirmed once, masked for good */
.idcard p.note{font-size:.9375rem;font-weight:600;color:var(--owner-ink-muted);margin:-4px 0 12px}
.idcard label{display:block;font-weight:900;margin-bottom:8px}
.idfield{display:flex;gap:10px;flex-wrap:wrap}
.idfield input{flex:1 1 14em;min-width:0;max-width:100%;min-height:60px;border-radius:14px;border:2px solid var(--owner-control-border);padding:0 16px;font-size:1.375rem;font-weight:800;letter-spacing:.08em;background:var(--owner-surface);font-feature-settings:"tnum";text-transform:uppercase}
.idfield input[aria-invalid="true"]{border-color:var(--danger-solid)}
.idfield .obtn{width:auto;flex:0 0 auto;min-height:60px}
.idmsg{min-height:1.5em;margin-top:8px;font-size:.9375rem;font-weight:800;color:var(--owner-ink-muted)}
.idmsg.bad{color:var(--danger)}
.idconfirm{display:flex;flex-direction:column;gap:12px}
.idconfirm .masked{font-size:1.625rem;font-weight:900;letter-spacing:.08em;font-feature-settings:"tnum"}
.idconfirm .row2{display:flex;gap:10px;flex-wrap:wrap}
.idconfirm .row2 .obtn{flex:1 1 10em}
.iddone{display:flex;align-items:center;gap:12px;font-weight:800}
.iddone .masked{font-size:1.25rem;font-weight:900;letter-spacing:.08em;font-feature-settings:"tnum"}
.iddone .tag{margin-left:auto}

/* signature */
.sigsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sigsum div{background:var(--owner-surface);border-radius:14px;padding:10px 14px;font-weight:800;line-height:1.4;min-width:0}
@container (max-width:760px){.sigsum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sigsum span{display:block;font-size:.8125rem;color:var(--owner-ink-muted)}
.pad{position:relative;height:max(220px,40vh);border-radius:20px;background:var(--owner-surface);border:2px dashed var(--owner-ink-muted);touch-action:none;overflow:hidden}
/* landscape phone: a 220px pad would fill the scroll area, and the page only scrolls outside it */
@media (max-height:500px){.pad{height:max(120px,32vh)}}
.pad.has{border-style:solid;border-color:var(--owner-ink)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .base{position:absolute;left:28px;right:28px;bottom:26%;border-top:2px solid var(--owner-border);pointer-events:none}
.pad .signer{position:absolute;left:28px;top:calc(74% + 8px);font-size:.9375rem;font-weight:800;color:var(--owner-ink-muted);pointer-events:none}
.sigwhat{margin:-4px 0 14px;font-size:1rem;font-weight:800;line-height:1.5;color:var(--owner-ink)}
.ho-start .forwho{margin-top:-6px;font-size:1.0625rem;font-weight:800;color:var(--owner-ink)}
.pad .x{position:absolute;left:28px;bottom:calc(26% + 6px);font-size:1.5rem;font-weight:900;color:var(--owner-control-border);pointer-events:none}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:1.125rem;font-weight:800;color:var(--owner-ink-muted);pointer-events:none}
.pad.has .ph{display:none}
.padbar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;font-size:.9375rem;color:var(--owner-ink-muted)}
.alt{display:flex;flex-direction:column;gap:12px}
.alt input[type=text]{min-height:60px;border-radius:14px;border:2px solid var(--owner-control-border);padding:0 16px;font-size:1.375rem;font-weight:800;background:var(--owner-surface)}

/* otp: one real field (paste and one-time-code autofill keep working), drawn as six cells */
.otp{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.otp label{font-weight:900;font-size:1.125rem}
.otp .to{font-weight:700;color:var(--owner-ink-muted)}
.otp .cells{position:relative;display:flex;gap:10px;width:min(372px,100%)}
.otp .cells i{flex:1;height:76px;border-radius:14px;border:2px solid var(--owner-ink-muted);background:var(--owner-surface);display:grid;place-items:center;font-style:normal;font-size:2rem;font-weight:900;font-feature-settings:"tnum";pointer-events:none}
.otp .cells:focus-within i.on{border:3px solid var(--owner-ink)}
.otp .cells.bad i{border-color:var(--danger-solid)}
.otp input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:1rem;opacity:.01;cursor:text}
.otp input:focus{outline:none}
.otp .err{min-height:1.5em;font-weight:800;color:var(--danger)}
.locked{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:10px 0}
.locked .ico{width:44px;height:44px;padding:9px;border-radius:50%;background:var(--danger-bg);color:var(--danger)}

/* record */
.reclist{list-style:none}
.reclist li{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--owner-border);font-weight:700}
.reclist li:first-child{border-top:0}
.reclist .num{font-weight:900}
.reclist .find{color:var(--warning)}

html.bigtext .conds{grid-template-columns:minmax(0,1fr)}
html.bigtext .sigsum{grid-template-columns:repeat(2,minmax(0,1fr))}
html.bigtext .ho-start .store,html.bigtext .ho-start .holink{position:static}
html.bigtext .ho-start .sface{--s:150px!important}
html.bigtext .ho-side{width:260px}
@media (max-width:760px){
  .conds{grid-template-columns:1fr}
  .sigsum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:minmax(0,1fr)}
  .prow .src,.prow .was,.prow .edit{grid-column:1}
  .prow .acts{grid-column:1;grid-row:auto}
  /* narrow: back and pause share the top row, the step name gets its own full row so large text never squeezes it a character per line */
  .signbar{padding:8px 12px;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"who n" "step step";row-gap:4px}
  .signbar .who{grid-area:who}.signbar .n{grid-area:n;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
  .signbar .ring{display:none}
  .signbar .step{grid-area:step;text-align:left}
  .signbar .hoback,.signbar .num{white-space:nowrap}
  .signbar .who .sname,.signbar .who .logo{display:none}
  .doc{padding:20px}
  /* narrow: the handover button drops under the row so the pet and owner keep a readable line */
  .staff{padding-left:16px;padding-right:16px}
  .srow{grid-template-columns:auto minmax(0,1fr)}
  .srow .abtn,.srow .why{grid-column:1 / -1}
  .srow .why{text-align:left}
  .ho-main{padding:20px 16px 28px}
  .ho-foot{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .sface.closing circle{stroke-dasharray:var(--len) 600}
  .hold .hold-fill{transform:scaleX(0)}
  .hold.holding .hold-fill{animation:holdstep 2s steps(8,end) forwards !important}
}
@keyframes holdstep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<style id="brandvars"></style>
</head>
<body>
<div class="proto" role="region" aria-label="原型控制（不是產品畫面）">
  <b>原型</b>
  <label>情境 <select id="p-sc" data-key="p-sc"></select></label>
  <label>跳到 <select id="p-jump" data-key="p-jump"></select></label>
  <label>店家 <select id="p-shop" data-key="p-shop"><option value="hiyori">毛孩日和（示範）</option><option value="wangmiao">汪喵小棧（示範）</option></select></label>
  <label>主題 <select id="p-theme" data-key="p-theme"><option value="">跟系統</option><option value="light">淺色</option><option value="dark">深色</option></select></label>
  <label><input type="checkbox" id="p-big" data-key="p-big">大字</label>
  <label><input type="checkbox" id="p-off" data-key="p-off">模擬斷線</label>
  <span class="note muted" id="p-note"></span>
</div>
<div id="app"></div>
<div id="layer"></div>
<div class="sr" aria-live="polite" id="live"></div>
<script>
/* ---------- helpers ---------- */
const I = {
  back:'<path d="m14 6-6 6 6 6"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  warn:'<path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17v.5"/>',
  send:'<path d="M20 4 3 11l7 2 2 7 8-16Z"/><path d="m10 13 4-4"/>',
  refresh:'<path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4h-4"/>',
  wifioff:'<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a10 10 0 0 1 4.2-2.4M14.8 10.1A10 10 0 0 1 19 12.5"/><path d="M12 20h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>'
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const nt = n => `NT$${fmt(n)}`;
const live = document.getElementById('live');
const say = msg => { live.textContent = ''; setTimeout(() => live.textContent = msg, 30); };
const pn = n => /^[A-Za-z]/.test(n) ? ` ${esc(n)} ` : esc(n);   /* a Latin pet name gets a space on each side inside CJK */
const imgOf = a => a.photo ? `<img src="pets/${a.photo}.webp" alt="">` : `<span class="ini" aria-hidden="true">${esc(a.pet[0])}</span>`;

/* ---------- demo shops (fictional): only the brand slot changes between them ---------- */
const SHOPS = {
  hiyori:  {name:'毛孩日和', branch:'中山店', logo:'毛', light:{b:'#3D6B57', on:'#FFFFFF', t:'#E6EFE6', ink:'#2F5A47'}, dark:{b:'#93CBB0', on:'#0E2A1F', t:'#20302A', ink:'#93CBB0'}},
  wangmiao:{name:'汪喵小棧', branch:'板橋店', logo:'汪', light:{b:'#2D5C8C', on:'#FFFFFF', t:'#E4EDF7', ink:'#24507C'}, dark:{b:'#9CC3EC', on:'#0D2238', t:'#1A2836', ink:'#9CC3EC'}}
};
function applyShop() {
  const s = SHOPS[state.shop], v = p => `--brand:${p.b};--on-brand:${p.on};--brand-tint:${p.t};--brand-ink:${p.ink};`;
  document.getElementById('brandvars').textContent = `:root{${v(s.light)}}:root[data-theme="dark"]{${v(s.dark)}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${v(s.dark)}}}`;
}
const shop = () => SHOPS[state.shop];

/* ---------- contracts (示範條文，正式版本待法務確認) ---------- */
const GROOM = {name:'犬貓美容定型化契約', ver:'v3', clauses:[
  {t:'第一條　服務內容', b:'店家依預約內容提供美容服務，服務項目、使用的工具與洗劑，在服務前會向你說明。你可以在服務開始前要求調整或取消加購項目。'},
  {t:'第二條　費用與付款', b:'服務費用以本契約記載為準，加購項目需經你同意後才會收費。費用在接回毛孩時結清，店家應開立收據。'},
  {t:'第三條　取消與改期費用', key:true, upd:true, sum:a => `24 小時內取消，最多收 ${nt(Math.round(a.fee * .2))}；沒到也沒通知，收 ${nt(Math.round(a.fee * .3))}`, b:'你在預約時間 24 小時前取消或改期，不收任何費用；24 小時內取消，店家得收取不超過服務費 20% 的費用；未到且未通知，店家得收取服務費 30%。'},
  {t:'第四條　健康狀況告知', key:true, b:'你應如實告知毛孩的疾病史、過敏、攻擊行為與近期用藥。店家發現毛孩有傳染病或身體不適，得暫停服務並通知你，不收取未完成部分的費用。'},
  {t:'第五條　保定與攻擊行為', key:true, b:'毛孩有攻擊行為時，店家得使用頭套等保定工具，並在服務紀錄中載明。保定方式以不造成傷害為原則。'},
  {t:'第六條　服務中意外與緊急就醫授權', key:true, sum:() => '聯絡不到你又情況緊急時，店家會送鄰近動物醫院急救，費用由你負擔（店家過失除外）', b:'服務中毛孩受傷或突發疾病，店家應立即通知你。無法聯絡你且情況緊急時，你同意店家將毛孩送往鄰近動物醫院急救，費用由你負擔，但因店家過失造成者由店家負擔。'},
  {t:'第七條　接回與逾時', key:true, upd:true, sum:() => '完成後超過 2 小時沒接回，會收逾時照護費', b:'店家完成服務後會以 LINE 通知你。超過約定接回時間 2 小時仍未接回，店家得依公告收取逾時照護費。'},
  {t:'第八條　服務紀錄', b:'服務前後的檢查與服務內容會記錄在服務紀錄中，接回時請你確認並簽名。紀錄正本會傳送給你保存。'},
  {t:'第九條　個人資料', b:'店家僅為履行本契約使用你與毛孩的資料，不得作其他用途。你可以隨時要求查閱或更正。'}
]};
const BOARD = {name:'住宿同意書', ver:'v1', clauses:[

  const h = state.handover; if (!h) return; h.last = Date.now();
  const t = e.target;
  if (t.id === 'otp') {
    /* typing again retires the last error, for screen readers as well as on screen */
    if (h.otpErr) { h.otpErr = ''; t.removeAttribute('aria-invalid'); const er = document.getElementById('otp-e'); if (er) er.textContent = ''; }
    hoOtpInput(t.value.replace(/\D/g, '').slice(0, 6));
  }
  else if (t.id === 'idin') hoIdInput(t);
  else if (t.id === 'altname') { h.altName = t.value; document.getElementById('ho-signbox').innerHTML = hoSignBtn(h); }
});
document.addEventListener('change', e => {
  const h = state.handover; if (!h) return; const t = e.target;
  if (t.dataset.tick !== undefined) { const a = scen(h.id), before = hoCond(h, a).keys; h.ticks[t.dataset.tick] = t.checked; if (hoCond(h, a).keys === keysOf(a).length && before !== keysOf(a).length) say('重點條款已全部勾選'); hoRefreshFull(); }
  if (t.hasAttribute('data-altok')) { h.altOk = t.checked; document.getElementById('ho-signbox').innerHTML = hoSignBtn(h); }
});
document.addEventListener('keydown', e => {
  const h = state.handover; if (!h) return; h.last = Date.now();
  if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('[data-hold]')) { e.preventDefault(); if (!e.repeat) holdStart(e.target.closest('[data-hold]')); return; }
  if (e.key === 'Enter' && e.target.id === 'otp' && h.otpVal.length === 6) { e.preventDefault(); HO.verify(); return; }
  if (e.key === 'Enter' && e.target.id === 'idin') { e.preventDefault(); HO.idGo(); return; }
  if (e.key === 'Escape') {
    if (h.idleWarn) return HO.idleGo();
    if (h.pauseAsk) return HO.pauseNo();
    if (h.sheet) return HO.sheetClose();
  }
  /* focus stays inside an open dialog */
  if (e.key === 'Tab') {
    const box = document.querySelector('.hosheet') || document.querySelector('.handover'); if (!box) return;
    const f = [...box.querySelectorAll('button,input,[tabindex="0"]')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  }
});
['pointerdown','scroll','touchstart'].forEach(ev => document.addEventListener(ev, () => { if (state.handover && !state.handover.idleWarn) state.handover.last = Date.now(); }, {capture:true, passive:true}));
document.addEventListener('visibilitychange', () => {});

/* ---------- prototype strip ---------- */
const pSc = document.getElementById('p-sc'), pJump = document.getElementById('p-jump');
pSc.innerHTML = SCEN.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
function jumpTargets() {
  const a = scen(state.sc), steps = hoSteps({kind: a.kind || 'contract'}, a);
  const t = [['', '—'], ['staff', '店員端'], ['start', '交接畫面'], ...steps.map(s => [s, STEP_NAME[s]])];
  if (!a.kind) t.push(['sheet', '關於審閱期']);
  t.push(['idle', '閒置警告'], ['pause', '暫停確認'], ['nophone', '手機不在身邊'], ['locked', '驗證已鎖定'], ['done', '簽署完成']);
  if (!a.kind && a.line) t.push(['later', '帶回家用 LINE 看']);
  if (a.kind === 'record') t.push(['fix', '已請店員更正']);
  return t;
}
function syncProto() {
  pSc.value = state.sc;
  pJump.innerHTML = jumpTargets().map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  const h = state.handover, n = document.getElementById('p-note');
  n.innerHTML = !h ? '按「現場簽名」開始交接'
    : h.step === 'otp' ? `示範驗證碼 <b>${DEMO_OTP}</b>・錯 5 次鎖定・重送間隔 60 秒，最多 3 次`
    : h.step === 'full' ? `閱讀時間依 200 字／分計算，原型縮短為 1/6（${readSecs(scen(h.id))} 秒）・條文為示範，待法務確認`
    : h.step === 'pet' && h.idStage !== 'skip' ? '示範身分證字號 <b>A123456789</b>・身分證在平板輸入是 [ASSUMPTION]'
    : h.step === 'start' ? '交接時審閱狀態全部重設・飼主本人按「開始」'
    : '閒置 90 秒跳出「還在嗎？」・再 30 秒清除進度';
}
function jumpTo(v) {
  const a = scen(state.sc);
  if (v === 'staff') { state.handover = null; render(); return; }
  hoStart(a.id); const h = state.handover; h.enter = false;
  if (v === 'start') return render();
  const steps = hoSteps(h, a), want = steps.includes(v) ? v : v === 'sheet' ? 'full' : steps.at(-1);
  /* everything before the target counts as done, so each state is reachable on its own */
  const upto = ['done','later','fix','locked','nophone','idle','pause'].includes(v) ? steps.length : steps.indexOf(want);
  steps.slice(0, upto).forEach(s => {
    if (s === 'full') { h.read = readSecs(a); h.end = true; keysOf(a).forEach(k => h.ticks[k.t] = true); }
    if (s === 'pet') { h.rows.forEach(r => r.ok = true); h.ownerOk = true; if (h.idStage === 'entry') { h.idVal = 'A123456789'; h.idStage = 'done'; } }
    if (s === 'sign') { h.sig = 'jump'; }
  });
  if (steps.indexOf('otp') < upto || want === 'otp') { h.otpSent = true; h.resendAt = Date.now() + 42000; }
  h.step = v === 'locked' || v === 'nophone' ? 'otp' : ['done','later','fix'].includes(v) ? v : ['idle','pause'].includes(v) ? (steps.includes('pet') ? 'pet' : steps[0]) : want;
  if (v === 'later') { h.step = 'later'; }
  if (v === 'locked') { h.locked = true; h.otpTries = 5; }
  if (v === 'nophone') h.noPhone = true;
  if (v === 'sheet') h.sheet = true;
  if (v === 'pause') h.pauseAsk = true;
  if (v === 'idle') { h.idleWarn = true; h.last = Date.now() - 92000; }
  if (h.sig === 'jump' && h.step === 'sign') h.sig = null;
  render(); document.getElementById('ho-t')?.focus();
}
pSc.addEventListener('change', () => { state.sc = pSc.value; if (state.handover) hoStart(state.sc); else render(); });
pJump.addEventListener('change', () => { const v = pJump.value; if (v) jumpTo(v); });
document.getElementById('p-shop').addEventListener('change', e => { state.shop = e.target.value; applyShop(); render(); });
document.getElementById('p-theme').addEventListener('change', e => { const v = e.target.value; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; render(); });
document.getElementById('p-big').addEventListener('change', e => { document.documentElement.classList.toggle('bigtext', e.target.checked); render(); });
document.getElementById('p-off').addEventListener('change', e => { state.offline = e.target.checked; if (!state.offline && state.handover) state.handover.net = state.handover.net; render(); });

/* deep link for review: ?sc=live&at=full&shop=wangmiao&theme=dark&big=1&off=1 */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('shop') && SHOPS[q.get('shop')]) { state.shop = q.get('shop'); document.getElementById('p-shop').value = state.shop; }
  if (q.get('theme')) { document.documentElement.dataset.theme = q.get('theme'); document.getElementById('p-theme').value = q.get('theme'); }
  if (q.get('big')) { document.documentElement.classList.add('bigtext'); document.getElementById('p-big').checked = true; }
  if (q.get('off')) { state.offline = true; document.getElementById('p-off').checked = true; }
  if (q.get('sc') && scen(q.get('sc'))) state.sc = q.get('sc');
  applyShop(); render();
  if (q.get('at')) jumpTo(q.get('at'));
  if (q.get('net') && state.handover) { state.offline = true; document.getElementById('p-off').checked = true; state.handover.net = 'next'; render(); }
})();
</script>
